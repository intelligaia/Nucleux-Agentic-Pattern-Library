  <script>
    /* Leaves a one-shot marker for the landing page: if the next thing the
       visitor sees is the hero, its typing intro is skipped.

       The landing page also checks document.referrer, but the referrer is
       empty on a BACK navigation — the history entry keeps the referrer it
       was first loaded with, not the page you just came from. That is the
       case this marker covers, and it is the common one: most people leave
       an auth screen with the back button. */
    try { sessionStorage.setItem('nx-from-auth', '1'); } catch (e) {}
  </script>

<body class="auth">

         measure the global nav uses, and matching it is what keeps the
         wordmark on the exact same x as every other page. -->
    <div class="container container--wide auth-nav__inner">
      <a class="brand" href="index-v2.html" aria-label="Nucleux">

      </a>

  <main class="auth-main">
    <div class="auth-card">

      <!-- No gradient word here. The headline on the two entry screens is a
           pitch; this one is an instruction, and an ornament on it would be
           the wrong register for somebody who is already locked out. -->
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">
        Enter the email you use for Nucleux and we&rsquo;ll send you a link to
        set a new one.
      </p>

      <!-- One field and one action. Everything else an auth screen usually
           carries — the third-party route, the rule, the switch line — is
           absent because none of it is a way out of this particular state. -->
      <form class="auth-fields" action="#reset" method="post" novalidate>
        <div>
          <label class="auth-label" for="reset-email">Email</label>
          <span class="auth-input-shell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="2.5" y="4.5" width="19" height="15" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <path d="m3.5 6.5 8.5 6 8.5-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <!-- autocomplete="username": this is the account identifier, and
                 saying so lets a password manager offer the address the
                 person is actually locked out of. -->
            <input class="auth-input" id="reset-email" name="email" type="email"
                   autocomplete="username" placeholder="you@company.com" required />
          </span>
        </div>

        <button class="auth-btn auth-btn--primary" type="submit">Send reset link</button>
      </form>

      <!-- The way back. Same component as the switch line on the other two
           screens, so the last row of an auth card is always the exit. -->
      <p class="auth-switch">
        <a href="signin.html">
          <svg class="auth-back" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M11 18l-6-6 6-6"/>
          </svg>
          <span>Back to sign in</span>
        </a>
      </p>

    </div>
  </main>

  <!-- The same page footer the other auth screens carry, so moving between
       them never shifts it. -->
  <footer class="auth-footer">
    <a href="index-v2.html">Home</a>
    <a href="#terms">Terms</a>
    <a href="#privacy">Privacy</a>
  </footer>

</body>
</html>
