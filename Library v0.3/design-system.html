  <script>
  /* ── Design System page: Gaiametry inside Nucleux ─────────────────────
     Gaiametry's CTAs leave Nucleux: each opens its Gaiametry page as an
     external link, in a new browser tab.

       Browse components  → https://gaiametry.vercel.app/#/components
       Start designing    → https://gaiametry.vercel.app/#/designers
       Start building     → https://gaiametry.vercel.app/#/components
       Set up your agent  → https://gaiametry.vercel.app/#/ai  (page top)
       any other route    → that same route on gaiametry.vercel.app

     HOW. Gaiametry serves its page and scripts with
     `Access-Control-Allow-Origin: *`, so this page fetches Gaiametry's
     live index.html and renders it in the frame as `srcdoc` (with a
     <base> pointing at gaiametry.vercel.app). A srcdoc frame belongs to
     this page's origin, so Nucleux can see which link or button inside
     it was clicked and send each one to its own destination.

     FALLBACK. If that fetch fails (offline, CORS changed), the frame
     loads gaiametry.vercel.app directly. Nucleux can then only see that
     the frame changed route (Gaiametry routes by hash, and every route
     change adds one entry to this tab's history.length), not which link
     did it — so any route change opens the components page. */
  (function () {
    var GAIA = 'https://gaiametry.vercel.app/';
    var HOME = GAIA + '#/';
    var COMPONENTS = GAIA + '#/components';
    var frame = document.querySelector('.ds-frame');

    /* a CTA by its visible label → where it goes */
    var BY_LABEL = [
      [/^\s*Browse components\s*$/i, COMPONENTS],
      [/^\s*Start designing\s*$/i,   GAIA + '#/designers'],
      [/^\s*Start building\s*$/i,    COMPONENTS],
      [/^\s*Set up your agent\s*$/i, GAIA + '#/ai']   /* top of the AI page — #/ai/agents jumps to its 'For agents' section */
    ];

    /* New, external tab. The click that got us here gives this page the
       user activation window.open needs; if a browser still refuses the
       tab, this tab goes instead — never Gaiametry inside Nucleux. */
    function goOut(url) {
      var w = null;
      try { w = window.open(url, '_blank'); } catch (e) {}
      if (w) { try { w.opener = null; } catch (e) {} }
      else { window.location.assign(url); }
    }

    function destFor(el) {
      var label = (el.textContent || '').trim();
      for (var i = 0; i < BY_LABEL.length; i++) if (BY_LABEL[i][0].test(label)) return BY_LABEL[i][1];
      if (el.tagName === 'A') {
        var href = el.getAttribute('href') || '';
        if (href.charAt(0) === '#') return GAIA + href;   /* an in-site route */
        if (/^https?:/i.test(href)) return href;          /* an outside link */
      }
      return null;
    }

    /* ── same-origin mode ── */
    function wire(win) {
      var doc = win.document;   /* throws if the frame is not ours */
      win.addEventListener('click', function (e) {
        if (e.defaultPrevented || e.button !== 0) return;
        var t = e.target && e.target.closest ? e.target.closest('a[href], button') : null;
        if (!t) return;
        var url = destFor(t);
        if (!url) return;                   /* copy button, toggles… stay in place */
        e.preventDefault();
        e.stopPropagation();
        goOut(url);
      }, true);
      /* Any other route change (a button that routes in script) also
         leaves: open that route outside and put the embed back home. */
      win.addEventListener('hashchange', function () {
        var h = win.location.hash;
        if (!h || h === '#' || h === '#/') return;
        goOut(GAIA + h);
        win.location.hash = '#/';
      });
      return doc;
    }

    function srcdocMode(html) {
      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + GAIA + '">');
      frame.addEventListener('load', function onload() {
        try { wire(frame.contentWindow); }
        catch (e) { frame.removeEventListener('load', onload); crossOriginMode(); }
      });
      frame.srcdoc = html;
    }

    /* ── fallback: cross-origin mode ── */
    function crossOriginMode() {
      var base = null, armed = false;
      frame.removeAttribute('srcdoc');
      frame.name = 'ds-' + Date.now();   /* no stale frame URL restored on Back */
      frame.addEventListener('load', function () {
        setTimeout(function () { base = history.length; }, 800);
      });
      frame.addEventListener('mouseenter', function () { armed = true; });
      frame.addEventListener('mouseleave', function () { if (document.activeElement !== frame) armed = false; });
      addEventListener('blur', function () {
        setTimeout(function () { if (document.activeElement === frame) armed = true; }, 0);
      });
      setInterval(function () {
        if (base === null || history.length <= base) return;
        if (armed) {
          goOut(COMPONENTS);
          try { frame.contentWindow.location.replace(HOME); } catch (e) { frame.src = HOME; }
          base = null;
          setTimeout(function () { base = history.length; }, 400);
          return;
        }
        base = history.length;
      }, 50);
      addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        armed = false; base = null;
        try { frame.contentWindow.location.replace(HOME); } catch (err) { frame.src = HOME; }
        setTimeout(function () { base = history.length; }, 800);
      });
      frame.src = HOME;
    }

    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; crossOriginMode(); } }, 8000);
    fetch(GAIA, { cache: 'no-store', credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) { if (done) return; done = true; clearTimeout(timer); srcdocMode(html); })
      .catch(function () { if (done) return; done = true; clearTimeout(timer); crossOriginMode(); });
  })();
  </script>
