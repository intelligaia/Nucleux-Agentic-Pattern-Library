    /* ════════════════════════════════════════════════════════════
       MATERIAL 3.0 — LIBRARY HOME

       The layout is not styled here: .lib-stage, .lib-sub, .lib-grid,
       .pcard and .badge all come from styles.css, the same rules the
       ShadCN home uses. Only the card visuals and the kicker are
       page-local, and both resolve to --md-sys-* tokens.
       ════════════════════════════════════════════════════════════ */
    .mh-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      align-self: flex-start;
      padding: 6px 14px;
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-family: var(--md-ref-typeface-plain);
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
    }

    /* A live thumbnail. The component is mounted at its true size on
       a fixed-width stage and the whole stage is scaled — never the
       font size, which would relayout the component and show a shape
       the real one never takes. pointer-events off: the card is the
       link, and a button inside it must not swallow the click. */
    .mh-live {
      height: 100%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
      pointer-events: none; user-select: none;
    }
    .mh-live__scale {
      width: 560px; flex: 0 0 auto;
      transform: scale(0.52);
      transform-origin: center center;
    }

    .mh-vis { display: block; width: 100%; height: auto; }
    .v-fill-p    { fill: var(--md-sys-color-primary); }
    .v-fill-pc   { fill: var(--md-sys-color-primary-container); }
    .v-fill-sc   { fill: var(--md-sys-color-secondary-container); }
    .v-fill-tc   { fill: var(--md-sys-color-tertiary-container); }
    .v-fill-on   { fill: var(--md-sys-color-on-surface-variant); }
    .v-fill-line { fill: var(--md-sys-color-outline-variant); }
    .v-stroke    { fill: none; stroke: var(--md-sys-color-outline-variant); stroke-width: 1.5; }

    /* A card with no page behind it must not look pressable. */
    .pcard--placeholder { cursor: default; }

    /* The sidebar rows: only built patterns are links; the rest are
       spans, so they are not focusable and do not advertise a
       destination that does not exist. */
    .tree__pattern:not(a) { cursor: default; }
    .tree__pattern:not(a):hover { background: transparent; color: var(--fg-alt); }
  </style>

  <!-- ══════════════════════════════════════════════════════
       MATERIAL 3.0 · AGENTIC COMPONENTS

       Same shell as the ShadCN page (library.html): the global
       nav, then the sidebar / main split. The difference is
       where the content comes from — library.html builds itself
       from patterns.js at runtime, and this page is static.

       That is deliberate while the set is empty. Pointing this
       page at patterns.js would render the ShadCN patterns
       under a Material heading, which is worse than showing
       nothing: it would claim components that do not exist yet.

       The four stages and their sub-categories mirror the
       ShadCN set exactly — same names, same order, same ids.
       That is the point: the two sets are the same map drawn
       in two design languages, so a reader who knows one can
       find their way around the other.

       Pattern rows are what is missing, not the structure.
       ══════════════════════════════════════════════════════ -->
