  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
  <script>
    /* Leaves a one-shot marker for the landing page: if the next thing the
       visitor sees is the hero, its typing intro is skipped.

       The landing page also checks document.referrer, but the referrer is
       empty on a BACK navigation — the history entry keeps the referrer it
       was first loaded with, not the page you just came from. That is the
       case this marker covers, and it is the common one: most people leave
       an auth screen with the back button. */
    try { sessionStorage.setItem('nx-from-auth', '1'); } catch (e) {}
  </script>
</head>
<body class="auth">

  <header class="auth-nav">
    <!-- `container--wide` (1480px), not the default container: that is the
         measure the global nav uses, and matching it is what keeps the
         wordmark on the exact same x as every other page. -->
    <div class="container container--wide auth-nav__inner">
      <a class="brand" href="index-v2.html" aria-label="Nucleux">
      <svg class="brand__mark brand__mark--inline" aria-hidden="true" width="120" height="24" viewBox="0 0 120 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.30469 3.23047V19.8459H6.45853V9.69201L14.3047 19.8459H18.4585V3.23047H14.3047V13.3843L6.45853 3.23047H2.30469Z" fill="var(--brand-word, #8A8F96)"/>
      <path d="M20.7656 3.23047V14.3074C20.7656 18.3074 23.0733 20.3074 27.6887 20.3074C32.3041 20.3074 34.6118 18.3074 34.6118 14.3074V3.23047H30.4579V13.8459C30.4579 15.692 29.5349 16.6151 27.6887 16.6151C25.8425 16.6151 24.9195 15.692 24.9195 13.8459V3.23047H20.7656Z" fill="var(--brand-word, #8A8F96)"/>
      <path d="M38.0781 11.5382C38.0781 5.9997 40.5397 3.23047 45.4627 3.23047H51.9243V6.92278H46.155C43.5397 6.92278 42.232 8.46124 42.232 11.5382C42.232 14.6151 43.5397 16.1535 46.155 16.1535H51.9243V19.8459H45.4627C40.5397 19.8459 38.0781 17.0766 38.0781 11.5382Z" fill="var(--brand-word, #8A8F96)"/>
      <path d="M54.2344 3.23047V19.8459H65.7728V16.1535H58.3882V3.23047H54.2344Z" fill="var(--brand-word, #8A8F96)"/>
      <path d="M68.0781 3.23047V19.8459H80.7704V16.1535H72.232V13.1535H79.8474V9.92278H72.232V6.92278H80.7704V3.23047H68.0781Z" fill="var(--brand-word, #8A8F96)"/>
      <path d="M83.5391 3V14.0769C83.5391 18.0769 85.8468 20.0769 90.4621 20.0769C95.0775 20.0769 97.3852 18.0769 97.3852 14.0769V3H93.2314V13.6154C93.2314 15.4615 92.3083 16.3846 90.4621 16.3846C88.616 16.3846 87.6929 15.4615 87.6929 13.6154V3H83.5391Z" fill="url(#paint0_linear_auth)"/>
      <path d="M99.6959 3H104.773L108.465 8.53846L112.157 3H117.696L112.157 11.3077L117.696 19.6154H112.157L108.465 14.0769L104.773 19.6154H99.2344L105.234 11.3077L99.6959 3Z" fill="url(#paint1_linear_auth)"/>
      <defs>
      <linearGradient id="paint0_linear_auth" x1="84" y1="10.5" x2="118" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21A4D7"/>
      <stop offset="0.975962" stop-color="#8B57C7"/>
      </linearGradient>
      <linearGradient id="paint1_linear_auth" x1="84" y1="10.5" x2="118" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21A4D7"/>
      <stop offset="0.975962" stop-color="#8B57C7"/>
      </linearGradient>
      </defs>
      </svg>
      </a>
    </div>
  </header>

  <!-- Form-level, and only ever for a form-level fault: the pair was not
       accepted. It rides at the top of the window rather than inside the
       card because it belongs to the ATTEMPT, not to any field — putting
       it between the fields would push the form down and read as a
       problem with whatever it happened to land above.

       `role="alert"` announces it on arrival without moving focus away
       from what the reader is editing. -->
  <p class="auth-alert" id="signin-alert" role="alert" aria-live="polite" hidden>
    <span class="auth-alert__dot" aria-hidden="true"></span>
    <span>We couldn&rsquo;t sign you in with that email and password.
          Check your details and try again.</span>
  </p>

  <main class="auth-main">
    <div class="auth-card">

      <h1 class="auth-title">Welcome back. Continue building better <em>agentic</em> experiences.</h1>
      <p class="auth-sub">Sign in to continue.</p>

      <!-- Email, then password, then the primary action. The
           third-party route sits BELOW the rule: the form is the path
           most people on a sign-in screen are taking, and putting the
           alternative first makes them read past it every time. -->
      <form class="auth-fields" action="#signin" method="post" novalidate>
        <div>
          <label class="auth-label" for="signin-email">Email</label>
          <span class="auth-input-shell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="2.5" y="4.5" width="19" height="15" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <path d="m3.5 6.5 8.5 6 8.5-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <!-- autocomplete="username" rather than "email": it tells a password
                 manager this is the identifier on a SIGN-IN form, so it offers a
                 saved account instead of a fresh address. -->
            <input class="auth-input" id="signin-email" name="email" type="email"
                   autocomplete="username" placeholder="you@example.com" required
                   aria-describedby="signin-email-msg" />
          </span>
          <p class="auth-msg" id="signin-email-msg" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.6v5m0 3.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span></span></p>
        </div>

        <div>
          <!-- The recovery link rides the label's baseline rather than
               sitting under the field, where it would push the primary
               button down and read as a second action of equal weight. -->
          <div class="auth-label-row">
            <label class="auth-label" for="signin-password">Password</label>
            <a class="auth-mini" href="reset-password.html">Forgot password?</a>
          </div>
          <span class="auth-input-shell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.6" stroke="currentColor" stroke-width="1.7"/>
              <path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <input class="auth-input auth-input--reveal" id="signin-password" name="password"
                   type="password" autocomplete="current-password"
                   placeholder="Enter your password" required
                   aria-describedby="signin-password-msg" />
            <!-- Masked by default; the control says what it will DO, not
                 what the field currently is. -->
            <button class="auth-reveal" type="button" data-reveal
                    aria-controls="signin-password" aria-pressed="false">Show</button>
          </span>
          <p class="auth-msg" id="signin-password-msg" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.6v5m0 3.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span></span></p>
        </div>

        <!-- Live from the start. A disabled primary action leaves a reader
             who has missed a field with nothing to press and no reason
             given; pressing this one always produces an answer — either it
             submits, or it says what is missing. The only time it is
             disabled is while a submission is outstanding. -->
        <button class="auth-btn auth-btn--primary" type="submit" data-submit>
          <span data-submit-label>Sign In</span>
        </button>
      </form>

      <div class="auth-or">OR</div>

      <a class="auth-btn auth-btn--google" href="#google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </a>

      <p class="auth-switch">
        New to Nucleux? <a href="signup.html">Create an account</a>
      </p>

    </div>
  </main>

  <!-- Page footer, not card content. Terms and Privacy keep their links
       but sit at the foot of the screen, out of the path between the
       reader and the one thing this page is for. `body.auth` is already
       a flex column with `.auth-main { flex: 1 }`, so this lands on the
       bottom edge without any positioning. -->
  <footer class="auth-footer">
    <a href="index-v2.html">Home</a>
    <a href="#terms">Terms</a>
    <a href="#privacy">Privacy</a>
  </footer>

  <script src="auth-signin.js"></script>

</body>
</html>
