       and fade out on their own radial falloff. */
    .ln-wrap .ag-hero-media {
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
    }
    .ln-wrap .scene { overflow: visible; }
    /* Hero type: more air between lines (concept). */
    .ln-wrap .hero__title { line-height: 1.12; }
