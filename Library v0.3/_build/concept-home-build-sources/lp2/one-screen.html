  <style>
    /* ── One section per screen, everything centred (concept, 27 Oct) ──
       Every chapter fills the screen below the nav, its content centred
       both ways, and the page snaps chapter to chapter on desktop, so only
       one section is in view at a time. Content is tightened to fit a
       laptop screen rather than cut: the demo, playground and bento size
       themselves to the viewport. Phones keep a normal free scroll. */
    .ln-wrap .ln-sec { padding-block: clamp(40px, 6vh, 72px); }

    /* centred headers + ledes everywhere */
    .ln-wrap .ln-head,
    .ln-wrap .ln-head--row { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px; margin-bottom: clamp(24px, 4vh, 40px); }
    .ln-wrap .ln-head--row > div { max-width: 760px; }
    .ln-wrap .ln-head .ln-h2,
    .ln-wrap .ln-head .ln-lede { margin-inline: auto; }
    .ln-wrap .ln-head .ln-lede { margin-top: 14px; }

    /* How it works: tabs centred, flow as a compact centred row */
    .ln-wrap .ln-ag__tabs { margin-inline: auto; }
    .ln-wrap .ln-ag { max-width: 1120px; margin-inline: auto; }
    .ln-wrap .ln-flow { max-width: 1120px; margin: clamp(20px, 3vh, 32px) auto 0; text-align: center; }
    .ln-wrap .ln-flow__s p { display: none; }
    .ln-wrap .ln-flow__s { justify-items: center; }

    /* Developers: header above, code panel centred below */
    .ln-wrap .ln-dev { display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(24px, 4vh, 40px); }
    .ln-wrap .ln-dev > header { max-width: 760px; }
    .ln-wrap .ln-dev > header .ln-lede { margin: 14px auto 0; }
    .ln-wrap .ln-dev > div { width: 100%; max-width: 820px; display: flex; flex-direction: column; align-items: center; }
    .ln-wrap .ln-dev .ln-code { width: 100%; text-align: left; }
    .ln-wrap .ln-dev .ln-tabs { margin-inline: auto; }

    /* Labs banner centred */
    .ln-wrap .ln-labs { justify-content: center; text-align: center; flex-wrap: wrap; }

    @media (min-width: 900px) {
      /* the hero fills the first screen exactly — no peek of section two */
      :root, body, body.landing-light,
      html.hero-intro-done body.landing-light .ln-wrap .hero { --fold-peek: 0px; }
      /* each chapter = one screen under the nav */
      .ln-wrap > .ln-sec {
        min-height: calc(100svh - var(--nav-h, 72px));
        display: flex; flex-direction: column; justify-content: center;
        box-sizing: border-box;
      }
      .ln-wrap > .ln-sec > .container { width: 100%; }

      /* fit the content to the screen */
      .ln-wrap .ln-ag__chat, .ln-wrap .ln-ag__canvas { height: clamp(300px, calc(100svh - 620px), 540px); }
      .ln-wrap .ln-ag__app { max-height: calc(100% - 56px); }
      .ln-wrap .home-pg__frame { height: clamp(360px, calc(100svh - 456px), 760px); }
      .ln-wrap .ln-head .ln-h2 { max-width: 30ch; margin-bottom: 0; font-size: clamp(34px, 3.4vw, 50px); }
      .ln-wrap .ln-head .ln-lede { font-size: 17px; }
      /* the three steps as one compact row under the demo */
      .ln-wrap .ln-flow__bar { margin-bottom: 12px; }
      .ln-wrap .ln-flow__s { display: block; }
      .ln-wrap .ln-flow__n { display: inline; margin: 0 8px 0 0; font-size: 18px; }
      .ln-wrap .ln-flow__s h3 { display: inline; font-size: 16px; }
    }

  </style>
