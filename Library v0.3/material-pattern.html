      position: absolute; left: 0; bottom: calc(100% + 10px);
      min-width: 268px; padding: 8px 0;
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--md-sys-color-surface-container-lowest);
      box-shadow: var(--md-sys-elevation-3);
      z-index: 6;
    }
    /* 2px between rows, not the 11px of a standard M3 menu: this list
       is nine items long and the reference sets it tight. The rows
       keep 32px of height so they are still a real target. */
    .gc-add__group {
      padding: 4px 0;
      display: flex; flex-direction: column; gap: 2px;
    }
    .gc-add__rule {
      height: 1px; margin: 4px 16px;
      background: var(--md-sys-color-outline-variant);
    }
    .gc-add__item {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      min-height: 32px;
      width: 100%; padding: 6px 16px;
      border: 0; background: transparent; cursor: pointer; text-align: left;
      font-family: var(--md-ref-typeface-plain);
      font-size: var(--md-sys-typescale-body-medium-size);
      line-height: var(--md-sys-typescale-body-medium-line);
      letter-spacing: 0;
      color: var(--md-sys-color-on-surface);
    }
    .gc-add__item::before {
      content: ""; position: absolute; inset: 0;
      background: var(--gc-state); opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .gc-add__item:hover::before  { opacity: var(--md-sys-state-hover-opacity); }
    .gc-add__item:active::before { opacity: var(--md-sys-state-pressed-opacity); }
    .gc-add__item:focus-visible  { outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px; }
    .gc-add__ico {
      position: relative; flex: 0 0 auto; width: 20px; height: 20px;
      fill: none; stroke: var(--md-sys-color-on-surface); stroke-width: 1.6;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .gc-add__label { position: relative; flex: 1 1 auto; }
    .gc-add__more {
      position: relative; flex: 0 0 auto; width: 18px; height: 18px;
      fill: none; stroke: var(--md-sys-color-on-surface-variant); stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* Open state: the + spins into a cross and the button fills, so
       the control that opened the menu is visibly the one that shuts
       it. 135deg rather than 45 — the extra half-turn reads as a
       deliberate spin instead of a jump to the nearest equivalent
       angle, and it lands on exactly the same cross either way. */
    .gc__addico {
      transition: transform 320ms var(--md-sys-motion-easing-emphasized);
    }
    .gc__icon.is-open .gc__addico { transform: rotate(135deg); }
    .gc__icon.is-open::before { opacity: var(--md-sys-state-focus-opacity); }

    /* M3 menu — surface-container, extra-small corner, elevation 2. */
    .gc__menu {
      position: absolute; right: 56px; bottom: calc(100% + 8px);
      min-width: 216px; padding: 8px 0;
      border-radius: var(--md-sys-shape-corner-extra-small);
      background: var(--md-sys-color-surface-container);
      box-shadow: var(--md-sys-elevation-2);
      z-index: 5;
    }
    .gc__menu-item {
      display: flex; align-items: flex-start; gap: 12px;
      width: 100%; padding: 10px 16px;
      border: 0; background: transparent; cursor: pointer; text-align: left;
      font-family: var(--md-ref-typeface-plain);
      color: var(--md-sys-color-on-surface);
    }
    .gc__menu-item:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface)
                  calc(var(--md-sys-state-hover-opacity) * 100%), transparent);
    }
    .gc__menu-item[aria-checked="true"] { font-weight: 500; }
    .gc__menu-check { width: 18px; flex: 0 0 auto; color: var(--md-sys-color-primary); }
    .gc__menu-t { font-size: var(--md-sys-typescale-label-large-size); }
    .gc__menu-d {
      display: block; margin-top: 2px;
      font-size: var(--md-sys-typescale-body-small-size);
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Send — hidden until there is text. That swap with the mic is the
       composer's most characteristic state change, and the one place
       the brand gradient appears on a control. */
    .gc__send {
      position: relative;
      flex: 0 0 auto;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: linear-gradient(135deg, var(--demo-g1), var(--demo-g2));
      cursor: pointer; padding: 0;
      transition: transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    /* The send button had no hover at all — the one control on the
       composer you are most likely to point at. Same neutral layer as
       its neighbours, which on a filled button reads as a darken. */
    .gc__send::before {
      content: ""; position: absolute; inset: 0;
      border-radius: inherit; background: var(--gc-state); opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .gc__send:hover::before  { opacity: var(--md-sys-state-hover-opacity); }
    .gc__send:active::before { opacity: var(--md-sys-state-pressed-opacity); }
    .gc__send svg { position: relative; width: 18px; height: 18px; fill: #fff; }
    .gc__send:active { transform: scale(0.94); }
    .gc__send:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }
    /* sending → the send affordance becomes stop, which is the honest
       control while a reply is in flight. */
    .gc__send--stop {
      background: var(--md-sys-color-secondary-container);
    }
    .gc__send--stop svg { fill: var(--md-sys-color-on-secondary-container); }

    /* ── Turns ────────────────────────────────────────────── */
    .demo__turn { display: flex; gap: 14px; align-items: flex-start; }
    .demo__turn--user { justify-content: flex-end; }
    .demo__bubble {
      max-width: 74%;
      padding: 12px 16px; border-radius: 18px 18px 4px 18px;
      background: #f0f4f9; color: var(--demo-ink);
      font-size: 14px; line-height: 20px;
    }
    .demo__av {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
      background: conic-gradient(from 200deg, var(--demo-g1), var(--demo-g2), var(--demo-g3), var(--demo-g1));
      display: grid; place-items: center;
    }
    .demo__av svg { fill: #fff; }
    /* Unlabelled agent avatar — flat grey, no gradient, no mark. What
       an unmarked turn actually looks like next to a human one. */
    .demo__av--plain {
      background: #dfe1e5; color: #3c4043;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 500;
    }
    .demo__agent { min-width: 0; flex: 1 1 auto; }
    .demo__agent-head {
      display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .demo__agent-name { font-size: 14px; font-weight: 600; color: var(--demo-ink); }
    .demo__text {
      margin: 0; font-size: 14px; line-height: 22px; color: #3c4043; max-width: 58ch;
    }
    .demo__text b { color: var(--demo-ink); font-weight: 600; }

    /* Thinking — a rise-and-settle, never a constant spin: a constant
       spin says "busy" and tells you nothing about progress. */
    /* The dots are targeted by CLASS, not `.demo__thinking span`.
       That descendant selector also matched the label — which is a
       span — so the label inherited the dot's size, background and
       pulse animation, and sat translating under the dots. Hence the
       overlap and the flicker. */
    .demo__thinking { display: flex; align-items: center; gap: 5px; }
    .demo__dot {
      flex: 0 0 auto;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--demo-g2);
      animation: demo-pulse 1.3s ease-in-out infinite;
    }
    .demo__dot:nth-child(2) { animation-delay: 0.16s; }
    .demo__dot:nth-child(3) { animation-delay: 0.32s; }
    .demo__thinking-label {
      margin-left: 8px;
      font-size: 13px; line-height: 20px; color: var(--demo-dim);
      white-space: nowrap;
    }
    @keyframes demo-pulse {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50%      { opacity: 1;    transform: translateY(-2px); }
    }

    .demo__enter { animation: demo-rise 380ms cubic-bezier(.2, 0, 0, 1) both; }
    @keyframes demo-rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Hint ─────────────────────────────────────────────── */
    .demo__hintbar {
      margin: 0 18px 16px; padding: 11px 14px;
      border-radius: 10px;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12px; line-height: 1.55;
    }
