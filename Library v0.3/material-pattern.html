    /* Nudges: tonal asks for attention, plain waits to be noticed. */
    .md-nudge--plain {
      background: transparent;
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    /* Connect a Data Source: density, measured against the real
       defaults rather than invented.

       The first attempt guessed at values and several were LARGER
       than what they replaced — compact made the source list taller.
       Every number below is the measured default tightened, and
       every surface the nine scenes actually draw is named, because
       the first attempt covered four of them and silently did
       nothing in the other five.

       display:contents, not a box. The stage is a grid with
       place-items:center, which shrink-wraps a block child — the
       hazard documented at .pv-stage above. A plain wrapper became
       that child and collapsed every scene to min-content. With no
       box of its own it carries the attribute and nothing else. */
    .md-conn-wrap { display: contents; }

    /* The list row: 9/14, gap 12 */
    .md-conn-wrap[data-density="compact"] .md-conn-row {
      /* The row has a 52px floor, so padding alone cannot tighten
         it — the floor has to come down too. 44px keeps the row a
         comfortable target, and the Connect button inside carries
         its own regardless. */
      padding: 6px 12px; gap: 10px; min-height: 44px;
    }
    /* The status card: 14, gap 10 */
    .md-conn-wrap[data-density="compact"] .md-conn {
      padding: 10px; gap: 8px;
    }
    .md-conn-wrap[data-density="compact"] .md-conn__head { gap: 8px; }
    .md-conn-wrap[data-density="compact"] .md-conn__foot { gap: 6px; }
    /* The authorise card: 28/24/22, gap 20 — the roomiest surface
       here, and the one with the most to gain. */
    .md-conn-wrap[data-density="compact"] .md-conn-review {
      padding: 20px 20px 16px; gap: 14px;
    }
    .md-conn-wrap[data-density="compact"] .md-conn-review__id { gap: 8px; }
    .md-conn-wrap[data-density="compact"] .md-conn-review__benefits {
      padding: 2px 14px;
    }
    .md-conn-wrap[data-density="compact"] .md-conn-review__benefit {
      padding: 10px 0; gap: 10px;
    }
    .md-conn-wrap[data-density="compact"] .md-conn-review__actions { gap: 4px; }
    /* Manage and Disconnect: the overlay and the sheet inside it. */
    .md-conn-wrap[data-density="compact"] .md-conn-modal { padding: 8px; }
    .md-conn-wrap[data-density="compact"] .md-conn-manage { padding: 18px; }
    .md-conn-wrap[data-density="compact"] .md-conn-manage__actions { gap: 6px; }
    .md-conn-wrap[data-density="compact"] .md-conn__ro { gap: 4px; }
    /* The scene and its caption. */
    .md-conn-wrap[data-density="compact"] .md-conn-scene { gap: 10px; }
    /* Default is 6px, so 8 would have made this LOOSER. */
    .md-conn-wrap[data-density="compact"] .md-conn-note { margin-bottom: 4px; }

    /* Capability Discovery: one density hook, four patterns. */
    .pv-composer.is-compact, .md-ex-open.is-compact { padding: 14px 16px; }
    /* The gallery's own classes — `.md-ex-grid` / `.md-ex-list` were
       renamed out of the view, so these rules matched nothing and
       Density was inert in Browsing and Filtered. Defaults measured:
       gallery gap 12, grid gap 10, card 14/16, open foot 18/14. */
    .md-gallery.is-compact { gap: 8px; }
    .md-gallery.is-compact .md-grid { gap: 6px; }
    .md-gallery.is-compact .md-ex { padding: 10px 12px; }
    .md-gallery.is-compact .md-ex__k { margin-bottom: 5px; }
    .md-ex-open.is-compact .md-ex-open__ask { margin-top: 8px; padding: 9px 11px; }
    .md-ex-open.is-compact .md-ex-open__out { margin-top: 10px; }
    .md-ex-open.is-compact .md-ex-open__foot { margin-top: 13px; padding-top: 10px; }
    .md-nudge.is-compact { padding: 12px 14px; }
    .md-disclaim.is-compact { padding: 16px 18px; }
    .md-tpl.is-compact { padding: 14px 16px; }

    /* The foot sits outside the scroll container, so what the panel
       produced is reachable from anywhere in a long list. */
    .pvc__foot {
      flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 16px; border-top: 1px solid var(--border);
      background: var(--md-sys-color-surface-container-lowest);
    }
    .pvc__copy {
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
      background: transparent; font: inherit; font-size: 11.5px;
      color: var(--fg); cursor: pointer;
    }
    .pvc__copy:hover { background: var(--ink-50); }
    .pvc__copy.is-done { border-color: transparent;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container); }
    .pvc__foot-note { font-size: 11px; color: var(--fg-muted); }

    /* Original | Customized. Small, beside the state select, and
       hidden entirely until there is something to compare. */
    /* Same height as the rest of the toolbar, measured the same way:
       2px of padding around a 26px option makes 32 with the border. */
    .pv-cmp {
      display: inline-flex; align-items: center; gap: 2px; padding: 2px;
      height: var(--pv-bar-h, 32px);
      border: 1px solid var(--border); border-radius: 999px;
    }
    .pv-cmp[hidden] { display: none; }
    .pv-cmp__btn {
      display: inline-flex; align-items: center;
      height: 100%; min-height: 26px;
      border: 0; border-radius: 999px; padding: 0 10px; background: transparent;
      font: inherit; font-size: 11.5px; color: var(--fg-muted); cursor: pointer;
      white-space: nowrap;
      transition: background-color 160ms var(--md-sys-motion-easing-standard),
                  color 160ms var(--md-sys-motion-easing-standard);
    }
    .pv-cmp__btn[aria-pressed="true"] {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container); font-weight: 600;
    }
    .pv-cmp__btn:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    /* It arrives; it does not inflate. Opacity and 6px of travel, so
       the control appears without the toolbar appearing to stretch. */
    @keyframes pv-cmp-in {
      from { opacity: 0; transform: translateX(6px); }
      to   { opacity: 1; transform: none; }
    }
    .pv-cmp.is-entering {
      animation: pv-cmp-in var(--md-sys-motion-duration-medium1, 250ms)
                 var(--md-sys-motion-easing-emphasized-decelerate,
                     cubic-bezier(0.05, 0.7, 0.1, 1)) both;
    }
    .pv-stage { position: relative; }
    .pv-stage__ribbon {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      padding: 2px 9px; border-radius: 999px;
      font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 650;
      background: var(--ink-100, #e6e6e2); color: var(--fg-muted);
    }
    /* The panel says which state it is editing, because the panel's
       CONTENTS depend on it. Without this the reader has to look back
       up at the state select to know what they are changing. */
    .pvc__scope {
      font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--md-sys-color-primary); font-weight: 600;
    }
    .pvc__reset-wrap { position: relative; }
    .pvc__reset {
      border: 0; background: transparent; padding: 4px 8px; border-radius: 6px;
      font: inherit; font-size: 12px; color: var(--md-sys-color-primary); cursor: pointer;
    }
    .pvc__reset:hover:not(:disabled) { background: var(--ink-50); }
    .pvc__reset:disabled { color: var(--fg-muted); cursor: default; opacity: 0.6; }
    .pvc__menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 6;
      min-width: 232px; padding: 6px;
      border: 1px solid var(--border);
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-lowest);
      box-shadow: var(--md-sys-elevation-2, 0 6px 22px rgba(16,16,20,0.14));
      animation: pvc-in 160ms var(--md-sys-motion-easing-standard) both;
    }
    .pvc__menu-item {
      display: grid; gap: 2px; width: 100%; text-align: left;
      padding: 8px 10px; border: 0; border-radius: 8px;
      background: transparent; font: inherit; font-size: 12.5px;
      color: var(--fg); cursor: pointer;
    }
    .pvc__menu-item span { font-size: 11px; color: var(--fg-muted); }
    .pvc__menu-item:hover:not(:disabled) { background: var(--ink-50); }
    .pvc__menu-item:disabled { opacity: 0.45; cursor: default; }
    .pvc__close {
      width: 26px; height: 26px; border: 0; border-radius: 50%;
      background: transparent; color: var(--fg-muted); cursor: pointer;
      font-size: 17px; line-height: 1;
    }
    .pvc__close:hover { background: var(--ink-50); color: var(--fg); }
    /* The scroll container. Nothing in the customizer ever replaces
       this element, so its scrollTop survives every setting change. */
    .pvc__body {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px 16px 16px;
    }

    /* The accent gutter is carried by EVERY row, transparent until the
       value differs. It hangs 12px into the body's margin and gives
       10 + 2 straight back, so the label sits on the same left edge
       whatever the state — and, because the box never changes size,
       becoming modified cannot move the row sideways. */
    .pvc-row {
      padding: 14px 0; border-bottom: 1px solid var(--border);
      margin-left: -12px; padding-left: 10px;
      border-left: 2px solid transparent;
    }
    .pvc-row:last-child { border-bottom: 0; }
    /* The label takes the slack, so the dot and the reset sit against
       the trailing edge instead of trailing the text. */
    .pvc-row__head { display: flex; align-items: center; gap: 8px; }
    .pvc-row__label {
      flex: 0 1 auto; min-width: 0;
      font-size: 12.5px; font-weight: 600; color: var(--fg);
    }
    /* Modified, subtly. A 5px dot beside the label and a tinted left
       edge — the word itself has gone, because a pill wide enough to
       read is a pill wide enough to push the label onto a second line
       the moment a reader touches the setting.

       Both markers are always in the row and merely invisible while
       the value matches: `visibility: hidden` keeps the box, where
       `display: none` would hand back the width and reflow the head.
       The row's height, the label's width, the switch's position and
       the hint's baseline are therefore identical in all three
       states — default, modified, reset. */
    /* The dot sits against the label; the slack after it is what
       pushes the read-out and the reset to the trailing edge. It takes
       the slack even while invisible, so nothing slides on change. */
    .pvc-row__dot { margin-left: 0; margin-right: auto; }
    .pvc-row__undo {
      flex: 0 0 auto;
      width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px;
      background: transparent; color: var(--fg-muted); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .pvc-row__undo .mi { width: 14px; height: 14px; }
    .pvc-row__undo:hover { background: var(--ink-50); color: var(--fg); }
    .pvc-row__dot[data-off],
    .pvc-row__undo[data-off] { visibility: hidden; pointer-events: none; }
    .pvc-row.is-modified { border-left-color: var(--md-sys-color-primary); }
    /* The current value lives with the label, not inside the control:
       a number that moves with a thumb is read where the eye already is. */
    .pvc-row__value {
      flex: 0 0 auto; font-size: 11.5px; color: var(--fg-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .pvc-row__control { margin-top: 9px; }
    .pvc-row__hint { margin: 8px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--fg-muted); }

    /* Groups, not one long list. Each carries the scope it belongs to,
       so "All states" and "Generated · Expanded · Sources" are readable
       facts about the setting rather than something to infer. */
    .pvc-group { padding: 14px 0 4px; border-bottom: 1px solid var(--border); }
    .pvc-group:last-child { border-bottom: 0; }
    .pvc-group__head { display: flex; align-items: baseline; gap: 8px; }
    .pvc-group__label {
      margin: 0; font-size: 12.5px; font-weight: 700; color: var(--fg);
      letter-spacing: 0.01em;
    }
    .pvc-group__scope {
      margin-left: auto; font-size: 10.5px;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      border: 0; border-radius: 999px; padding: 1px 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
    }
    .pvc-group__note {
      margin: 6px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--fg-muted);
    }
    .pvc-group .pvc-row:last-child { border-bottom: 0; }
    .pvc-group .pvc-row { border-bottom: 0; padding: 12px 0 0 10px; }
    /* Sectioned patterns: the section heading is the only heading, so
       the group is a container and nothing more. */
    .pvc-group--bare { padding: 0; border-bottom: 0; }
    .pvc-group--bare .pvc-row { padding: 10px 0 0 10px; }
    .pvc-group--bare .pvc-row__hint { margin-top: 6px; }
    .pvc-sec__rows > .pvc-group--bare:first-child .pvc-row:first-child { padding-top: 4px; }
    .pvc-row--cap .pvc-row__control { margin-top: 6px; }
    /* Label and switch on one line, hint beneath: a column of
       on/off decisions reads as one list, not five settings. */
    .pvc-row--switch { display: flex; align-items: center; flex-wrap: wrap; }
    .pvc-row--switch .pvc-row__head { flex: 1 1 auto; min-width: 0; }
    .pvc-row--switch .pvc-row__control,
    .pvc-row--cap.pvc-row--switch .pvc-row__control { flex: none; margin-top: 0; }
    .pvc-row--switch .pvc-row__hint { flex-basis: 100%; margin-top: 4px; }

    /* Changed from the default. On a row, and on the state options in
       the select, so a change left behind in another state is visible
       from wherever you are. */
    .pvc-dot {
      display: inline-block; width: 5px; height: 5px; margin-left: 6px;
      border-radius: 50%; background: var(--md-sys-color-primary);
      vertical-align: middle;
    }
    .pvc-empty {
      margin: 18px 0 8px; font-size: 12.5px; line-height: 1.6; color: var(--fg-muted);
    }
    .pvc-empty strong { color: var(--fg); font-weight: 650; }

    /* The failure surface. Nothing is marked, because nothing was
       produced — so this is a card that says what happened, not a
       disclosure chip wearing an error colour. */
    .pv-error {
      display: flex; gap: 10px; align-items: flex-start;
      margin-top: 14px; padding: 12px 14px;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-error-container, #fbe9e7);
      color: var(--md-sys-color-on-error-container, #410002);
    }
    .pv-error__ico {
      width: 20px; height: 20px; flex: none; margin-top: 1px;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .pv-error p { margin: 0; }
    .pv-error__why { margin-top: 4px; opacity: 0.82; }

    /* Density is the one control that applies in every state, so it
       has to actually change something in all of them. */
    .pv-card--compact { padding: 14px 16px; }
    .pv-card--compact .pv-card__body,
    .pv-card--compact .pv-card__empty { margin-top: 10px; }
    .pv-card--compact .pv-disclose { margin-top: 10px; }
    .pv-card--compact .md-button { margin-top: 10px; }

    .pvc-input {
      width: 100%; height: 34px; padding: 0 12px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--fg);
      font: inherit; font-size: 12.5px;
    }
    .pvc-input:focus-visible {
      outline: 2px solid color-mix(in oklab, var(--md-sys-color-primary) 55%, transparent);
      outline-offset: 1px; border-color: transparent;
    }

    .pvc-seg { display: flex; gap: 4px; }
    /* A marked segment wraps to two columns. Four options with a
       logo and a name do not fit one row of a 340px panel — the
       names were already wrapping and clipping before the marks
       arrived. Two rows of two gives every option its full name. */
    .pvc-seg--marks { display: grid; grid-template-columns: 1fr 1fr; }
    .pvc-seg--marks .pvc-seg__btn {
      display: flex; align-items: center; gap: 8px;
      justify-content: flex-start; height: 36px; padding: 0 10px;
      text-align: left;
    }
    .pvc-seg__mark {
      flex: none; width: 16px; height: 16px; display: inline-flex;
    }
    /* The marks are the services' own, unaltered — the one place in
       this panel where a non-Material colour is correct, because
       recolouring a logo destroys the only job it has. */
    .pvc-seg__mark svg { width: 100%; height: 100%; display: block; }
    .pvc-seg--marks .pvc-seg__label {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* A label that needs two lines gets them INSIDE the button: the
       height grows with the text rather than the text spilling out
       over the border ("This conversation" did exactly that). */
    .pvc-seg__btn {
      flex: 1 1 0; min-height: 32px; padding: 5px 6px; line-height: 1.25;
      border: 1px solid var(--border); border-radius: 8px;
      background: transparent; cursor: pointer;
      font: inherit; font-size: 12px; color: var(--fg-muted);
      transition: background-color 160ms var(--md-sys-motion-easing-standard),
                  color 160ms var(--md-sys-motion-easing-standard);
    }
    .pvc-seg__btn[aria-pressed="true"] {
      background: var(--md-sys-color-secondary-container);
      border-color: transparent;
      color: var(--md-sys-color-on-secondary-container); font-weight: 600;
    }

    .pvc-switch {
      display: inline-flex; align-items: center;
      border: 0; background: transparent; padding: 0; cursor: pointer;
    }
    .pvc-switch__track {
      width: 40px; height: 24px; border-radius: 999px; padding: 3px;
      background: var(--ink-100, #e6e6e2); display: flex; align-items: center;
      transition: background 200ms var(--md-sys-motion-easing-standard);
    }
    .pvc-switch__knob {
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.3);
      transition: transform 280ms var(--md-sys-motion-easing-emphasized);
    }
    .pvc-switch.is-on .pvc-switch__track { background: var(--md-sys-color-primary); }
    .pvc-switch.is-on .pvc-switch__knob { transform: translateX(16px); }

    .pvc-range {
      width: 100%; height: 20px; -webkit-appearance: none; appearance: none;
      background: transparent; cursor: pointer;
    }
    .pvc-range::-webkit-slider-runnable-track {
      height: 4px; border-radius: 999px; background: var(--ink-100, #e6e6e2);
    }
    .pvc-range::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
      background: var(--md-sys-color-primary);
      border: 2px solid var(--surface);
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }
    .pvc-range::-moz-range-track { height: 4px; border-radius: 999px; background: var(--ink-100, #e6e6e2); }
    .pvc-range::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--surface);
      background: var(--md-sys-color-primary);
    }

    /* Emphasis variants the panel switches between. Each is a real M3
       treatment, not a shade: tonal ground, hairline outline, or type
       alone for surfaces where the marker must not compete. */
    /* While the panel is driving, the stage is repainted on every
       keystroke — so entrance animations are suppressed there. */
    .pv-stage.is-quiet .pv-disclose__chip,
    .pv-stage.is-quiet .pv-consent,
    .pv-stage.is-quiet .md-nudge { animation: none; }

    .pv-disclose__chip { border-radius: var(--chip-radius, 9999px); }
    .pv-disclose__chip--tonal {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-color: transparent;
    }
    .pv-disclose__chip--outlined {
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      border-color: var(--md-sys-color-outline-variant);
    }
    .pv-disclose__chip--plain {
      background: transparent; border-color: transparent;
      color: var(--md-sys-color-on-surface-variant);
      padding-left: 0;
    }
    /* Non-interactive variant: no pointer, no lift, no focus ring. */
    span.pv-disclose__chip { cursor: default; }
    span.pv-disclose__chip:hover { box-shadow: none; transform: none; }

    @media (max-width: 1180px) {
      .pv--tuning .pv-work { grid-template-columns: minmax(0, 1fr); }
      .pv--tuning .pvc { margin-top: 14px; }
    }

    /* ── The toolbar under pressure ────────────────────────
       A 32px control is comfortable to read and too short to hit
       reliably. Rather than growing the chrome, each control casts a
       44px target around itself — the same trick the disclosure
       marker uses, and the reason the bar can stay this compact. */
    .pv-select__btn, .pv-edit, .pv-cmp__btn { position: relative; }
    .pv-select__btn::before, .pv-edit::before, .pv-cmp__btn::before {
      content: ''; position: absolute; left: 0; right: 0;
      top: 50%; height: 44px; transform: translateY(-50%);
    }

    /* Tablet: the state name is the long one, so it gives up its
       padding first. */
    @media (max-width: 1020px) {
      .pv-head__right { gap: 5px; }
      .pv-select__btn { padding: 0 6px 0 10px; }
      .pv-select__v { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
      .pv-edit { padding: 0 10px; }
    }

    /* Narrow: the cluster wraps as a cluster — comparison on its own
       row, state and Customize together beneath it — and Customize
       becomes the icon it already carries. Its accessible name and
       its title are on the button either way, so nothing is lost but
       the word. The changed-state dot moves to the corner, because
       there is no longer a label for it to sit beside. */
    @media (max-width: 720px) {
      /* Grid, not a flex wrap: `flex-basis: 100%` breaks the line but
         also stretches the comparison pill across it. Named areas put
         it on its own row at its own width, and collapse that row to
         nothing while it is hidden. */
      .pv-head__right {
        width: 100%;
        display: grid; justify-content: start; justify-items: start;
        grid-template-columns: auto auto;
        grid-template-areas: "cmp cmp" "state edit";
      }
      .pv-cmp { grid-area: cmp; }
      .pv-select { grid-area: state; }
      .pv-edit { grid-area: edit; }
      .pv-edit__label { display: none; }
      .pv-edit { width: var(--pv-bar-h, 32px); padding: 0; gap: 0; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pv-work, .pvc-switch__track, .pvc-switch__knob, .pvc-seg__btn, .pv-edit { transition: none; }
      .pvc, .pv-select__menu { animation: none; }
      .pv-cmp.is-entering { animation: none; }
    }

    .mp-scene { margin-top: 26px; }
    .mp-scene__t { margin: 0; font-size: 15.5px; font-weight: 640; color: var(--fg); }
    .mp-scene__note {
      margin: 6px 0 14px; font-size: 13.5px; line-height: 1.6;
      color: var(--fg-alt); max-width: 72ch;
    }

    /* ════════════════════════════════════════════════════════════
       THE SIMULATOR — one working surface

       Two columns, not three. The inbox rail says which piece of
       work you are on; everything else — the request, the
       conversation, the generated draft and the send — happens in
       one surface with one composer at the bottom.

       The earlier three-column shape put the ticket and the agent
       side by side, which meant a reader had to watch two places at
       once and the ticket column sat idle for most of the workflow.
       Folding them together costs nothing: the request is still
       real, the send is still real, and the pattern still has
       something to be true about.
       ════════════════════════════════════════════════════════════ */
    .app--wf {
      grid-template-columns: 184px minmax(0, 1fr);
      min-height: 560px;
    }
    .app--wf .app__body { min-height: 0; }

    .wf-tickets {
      margin: 14px 0 0; padding-top: 12px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: grid; gap: 2px;
    }
    .wf-ticket {
      display: grid; gap: 2px; padding: 7px 9px; border-radius: 7px;
      color: var(--app-ink-dim, #5f6368);
    }
    .wf-ticket.is-current {
      background: var(--md-sys-color-surface-container);
      color: var(--app-ink, #202124);
    }
    .wf-ticket__s { font-size: 12.5px; font-weight: 550; }
    .wf-ticket__m { font-size: 11px; opacity: 0.8; }

    /* Who you are working with, in the title bar rather than in a
       column of its own. The role line rides with the name because
       "not a person" is not a thing to find in a settings page. */
    .wf-who {
      display: flex; align-items: center; gap: 8px;
      margin-left: auto; padding-right: 14px;
      border-right: 1px solid var(--md-sys-color-outline-variant);
    }
    .wf-who__n { font-size: 12.5px; font-weight: 620; color: var(--app-ink, #202124); }
    .wf-who__r { font-size: 11px; color: var(--app-ink-dim, #5f6368); }

    .wf-scroll {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 18px 20px;
      display: flex; flex-direction: column; gap: 16px;
      background: var(--md-sys-color-surface-container-lowest);
    }
    /* The request that started the work. It stays at the top of the
       surface for the whole workflow, so nothing the agent says is
       ever floating free of what was asked. */
    .wf-ctx {
      display: flex; gap: 12px; align-items: flex-start;
      padding-bottom: 16px; max-width: 640px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .wf-you { display: flex; justify-content: flex-end; }
    .wf-bubble {
      max-width: 72%; padding: 9px 14px; border-radius: 18px 18px 4px 18px;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-size: 13.5px; line-height: 1.55;
    }
    .wf-text { margin: 6px 0 0; font-size: 14px; line-height: 1.6; color: #444746; }
    .wf-text b { color: var(--app-ink, #202124); font-weight: 620; }
    .wf-empty__t {
      margin: 0 0 12px; font-size: 13px; line-height: 1.55;
      color: var(--app-ink-dim, #5f6368);
    }
    .wf-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .wf-exs { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

    /* ── The composer ─────────────────────────────────────
       One control with two jobs: it is how you ask, and it is
       where the answer arrives when the answer is a reply. */
    .wf-foot {
      padding: 0 20px 18px; display: grid; gap: 10px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding-top: 14px;
      background: var(--md-sys-color-surface-container-lowest);
    }
    .wf-asks { display: flex; gap: 7px; flex-wrap: wrap; }
    .wf-chip {
      border: 1px solid var(--md-sys-color-outline-variant); border-radius: 999px;
      background: var(--md-sys-color-surface-container-lowest);
      padding: 7px 13px; font: inherit; font-size: 12px;
      color: var(--app-ink, #202124); cursor: pointer;
      transition: background 160ms var(--md-sys-motion-easing-standard);
    }
    .wf-chip:hover { background: var(--md-sys-color-surface-container-high); }

    .wf-hand { display: flex; align-items: center; gap: 10px; }
    .wf-hand__count { color: var(--app-ink-dim, #5f6368); }

    .wf-comp {
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 14px; padding: 14px 16px;
      background: var(--md-sys-color-surface-container-lowest);
      transition: border-color 200ms var(--md-sys-motion-easing-standard);
    }
    .wf-comp.is-live { border-color: var(--md-sys-color-primary); }
    .wf-comp--done { background: var(--md-sys-color-surface-container-low); }
    .wf-comp__k {
      margin: 0; display: flex; align-items: center; gap: 8px;
      color: var(--app-ink-dim, #5f6368);
    }
    .wf-comp__v {
      margin: 8px 0 0; font-size: 14px; line-height: 1.6;
      color: #444746; max-width: 64ch;
    }
    .wf-comp__tag { margin-top: 10px; }
    .wf-comp__foot {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px;
    }
    .wf-comp .md-caveat { margin-top: 12px; }

    .wf-ask {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 5px 5px 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-lowest);
      transition: border-color 160ms var(--md-sys-motion-easing-standard);
    }
    .wf-ask:focus-within { border-color: var(--md-sys-color-primary); }
    .wf-ask__input {
      flex: 1 1 auto; min-width: 0; border: 0; background: transparent;
      font: inherit; font-size: 13.5px; color: var(--app-ink, #202124);
      padding: 9px 0;
    }
    .wf-ask__input:focus { outline: none; }
    .wf-ask__input::placeholder { color: var(--app-ink-dim, #9aa0a6); }
    .wf-ask__send {
      flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
      border: 0; cursor: pointer; display: grid; place-items: center;
      background: var(--md-sys-color-primary);
    }
    .wf-ask__send svg { width: 16px; height: 16px; fill: var(--md-sys-color-on-primary); }

    /* A pattern that decides WHICH work you are looking at sits above
       the work, not inside it. */
    .wf-banner { padding-bottom: 4px; }
    .wf-banner .md-nlsearch { max-width: 100%; }
    .wf-banner .md-applied { max-width: 100%; margin-top: 10px; }
    .wf-scroll .md-cta { margin: 0; }
    .wf-scroll .md-proactive { max-width: 100%; }
    .wf-comp .md-roll, .wf-foot .md-roll { margin-top: 0; }

    /* ════════════════════════════════════════════════════════════
       THE SIMULATOR SHELLS

       Four layouts, chosen by what the pattern DOES rather than by
       what it looks like. They share a thin chrome and nothing else:
       a consent decision, a first-run statement, an editor presence
       and a natural-language filter do not occur in the same
       product, and drawing them in the same frame would say they do.

       Rules that hold across all of them:
         · the product is the smallest believable environment, never
           a dashboard — if a rail is here, the workflow needs it;
         · the surface awaiting a human decision takes primacy while
           it waits, and gives it back the moment it resolves;
         · spring for what the reader caused, emphasized for what the
           system did, and every loop stops under reduced motion.
       ════════════════════════════════════════════════════════════ */
    .sim {
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 14px;
      background: var(--md-sys-color-surface-container-lowest);
      overflow: hidden;
      font-family: var(--md-ref-typeface-plain);
      color: var(--app-ink, #202124);
    }

    /* ── Chrome ─────────────────────────────────────────── */
    .sim__bar {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim__brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12.5px; font-weight: 640;
    }
    .sim__brandmark {
      width: 16px; height: 16px; border-radius: 5px;
      background: var(--md-sys-color-primary);
    }
    .sim__title {
      font-size: 12.5px; color: var(--app-ink-dim, #5f6368);
      padding-left: 12px; border-left: 1px solid var(--md-sys-color-outline-variant);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sim__who {
      margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--app-ink-dim, #5f6368); flex: 0 0 auto;
    }
    .sim__pill {
      flex: 0 0 auto; height: 24px; padding: 0 11px; border-radius: 999px;
      display: inline-flex; align-items: center;
      background: var(--md-sys-color-surface-container-high);
      color: var(--app-ink-dim, #5f6368); font-size: 11px;
    }
    .sim__pill:empty { display: none; }
    .sim__body { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }

    /* ── REVIEW & APPROVAL ──────────────────────────────── */
    .sim-ask { display: flex; gap: 10px; align-items: baseline; }
    .sim-ask__who {
      flex: 0 0 auto; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-ask__t { margin: 0; font-size: 15px; line-height: 1.5; }

    /* The agent's own work, itemised. A blocked step has to read as
       blocked, or the permission ask looks like it came from nowhere. */
    .sim-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
    .sim-step { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
    .sim-step__dot {
      flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%;
      background: var(--md-sys-color-outline-variant);
      transition: background 200ms var(--md-sys-motion-easing-standard);
    }
    .sim-step.is-done .sim-step__dot { background: var(--md-sys-color-primary); }
    .sim-step.is-run  .sim-step__dot {
      background: var(--md-sys-color-primary);
      animation: sim-pulse 1.4s var(--mx-motion-effects-easing) infinite;
    }
    .sim-step.is-blocked .sim-step__dot {
      background: transparent;
      box-shadow: inset 0 0 0 2px var(--md-sys-color-primary);
    }
    .sim-step.is-skipped { color: var(--app-ink-dim, #9aa0a6); }
    .sim-step.is-wait    { color: var(--app-ink-dim, #9aa0a6); }
    .sim-step.is-skipped .sim-step__t { text-decoration: line-through; }
    .sim-step__n { margin-left: auto; font-size: 11.5px; color: var(--app-ink-dim, #5f6368); }
    @keyframes sim-pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.5); opacity: .55; }
    }

    /* The decision takes primacy while it waits. The rest of the
       surface recedes rather than the card shouting. */
    .sim--review.is-deciding .sim__ask,
    .sim--review.is-deciding .sim__progress { opacity: .55; }
    .sim--review .sim__ask,
    .sim--review .sim__progress {
      transition: opacity 380ms var(--md-sys-motion-easing-emphasized);
    }
    .sim__focus { }
    .sim__focus .sc-consent { border-color: var(--md-sys-color-primary); }

    .sim-brief {
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px; padding: 16px 18px;
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-brief__head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .sim-brief__t { font-size: 13px; font-weight: 640; }
    .sim-brief__b { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #444746; }
    .sim-brief__gap {
      margin: 12px 0 0; padding-left: 12px; font-size: 12.5px; line-height: 1.55;
      border-left: 2px solid var(--md-sys-color-outline);
      color: var(--app-ink-dim, #5f6368);
    }

    /* ── ONBOARDING / FIRST RUN ─────────────────────────── */
    .sim--first { position: relative; min-height: 420px; display: flex; flex-direction: column; }
    .sim--first .sim__body { flex: 1 1 auto; }
    .sim-hello { text-align: center; padding: 22px 0 8px; }
    /* The mark is a flex container, so text-align does not reach it. */
    .sim-hello > .md-agentav { margin-inline: auto; }
    .sim-hello__t { margin: 12px 0 0; font-size: 16px; font-weight: 640; }
    .sim-hello__d {
      margin: 6px auto 0; max-width: 44ch; font-size: 13px; line-height: 1.55;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-starters {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 20px;
    }
    .sim__thread { display: grid; gap: 14px; }
    .sim-turn { display: flex; gap: 10px; align-items: flex-start; }
    .sim-turn__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sim-turn__n { font-size: 12.5px; font-weight: 640; }
    .sim__foot {
      padding: 12px 16px 16px; display: grid; gap: 10px; justify-items: start;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .sim__foot .wf-ask { width: 100%; margin: 0; }
    .sim__scrim {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding: 20px; background: rgba(28, 27, 31, 0.32); backdrop-filter: blur(1.5px);
    }
    .sim__scrim .md-disclaim { max-width: 440px; margin: 0; }

    /* ── DOCUMENT / EDITOR ──────────────────────────────── */
    .sim__paper {
      padding: 26px 32px 30px; min-height: 320px;
      background: var(--md-sys-color-surface-container-lowest);
    }
    .sim-doc__h { margin: 0; font-size: 21px; font-weight: 660; letter-spacing: -0.01em; }
    .sim-doc__meta {
      margin: 4px 0 20px; font-size: 11.5px; color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-doc__p {
      margin: 0 0 14px; font-size: 14.5px; line-height: 1.7; color: #33353a; max-width: 62ch;
    }
    .sim-doc__p--sel { background: var(--md-sys-color-secondary-container); border-radius: 4px; }
    .sim-doc__ask {
      display: inline-flex; align-items: center; gap: 6px; margin-left: 10px;
      padding: 4px 12px; border: 0; cursor: pointer; font: inherit; font-size: 12.5px;
      border-radius: 999px;
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
      transition: transform var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing);
    }
    .sim-doc__ask:active { transform: scale(0.95); }
    .sim-doc__ask .md-glyph { fill: currentColor; }

    /* Certainty is edge definition. While the agent is writing, the
       block is not boxed — tinted ground, no border. As it settles
       the boundary resolves into a container. */
    .sim-doc__block {
      max-width: 62ch; border-radius: 12px;
      border: 1px solid transparent;
      transition: border-color 380ms var(--md-sys-motion-easing-emphasized),
                  background 380ms var(--md-sys-motion-easing-emphasized),
                  padding 380ms var(--md-sys-motion-easing-emphasized);
    }
    .sim-doc__block.is-live {
      padding: 12px 14px;
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-doc__block.is-settling {
      border-color: transparent;
      background: linear-gradient(180deg, var(--md-sys-color-primary-container), transparent);
    }
    .sim-doc__block .sim-doc__p { margin: 0; }
    .sim-doc__prov { display: block; margin-top: 10px; }
    .sim__paper.is-live { box-shadow: inset 3px 0 0 var(--md-sys-color-primary); }
    .sim__docfoot {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-doc__who {
      display: inline-flex; align-items: center; gap: 8px; margin-right: auto;
      font-size: 12.5px; color: var(--app-ink-dim, #5f6368);
    }

    /* ── SPLIT WORKSPACE ────────────────────────────────── */
    .sim--split { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 440px; }
    .sim__rail {
      padding: 16px 14px;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim__main { display: flex; flex-direction: column; min-width: 0; }
    .sim__query { padding: 16px 18px 0; }
    .sim__query .md-nlsearch { max-width: 100%; }
    .sim__query .md-applied { max-width: 100%; }
    .sim__results { flex: 1 1 auto; padding: 16px 18px 20px; }
    .sim-rail__k {
      margin: 0 0 12px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-rail__row {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-rail__row.is-on { color: var(--app-ink, #202124); }
    .sim-rail__n { display: block; font-size: 12.5px; font-weight: 550; }
    .sim-rail__v { display: block; font-size: 11.5px; opacity: .8; }
    .sim-rail__note {
      margin: 16px 0 0; padding-top: 12px; font-size: 11px; line-height: 1.5;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .sim-row {
      display: flex; align-items: baseline; gap: 12px; padding: 11px 12px;
      border-radius: 8px; background: var(--md-sys-color-surface-container-low);
    }
    .sim-row__n { font-size: 13.5px; font-weight: 600; }
    .sim-row__m { margin-left: auto; font-size: 12px; color: var(--app-ink-dim, #5f6368); }
    .sim-empty {
      margin: 0; padding: 24px 0; text-align: center; font-size: 13px;
      color: var(--app-ink-dim, #9aa0a6);
    }
    .md-fchip--off { background: transparent; color: var(--app-ink-dim, #9aa0a6); }

    @media (max-width: 760px) {
      .sim--split { grid-template-columns: 1fr; }
      .sim__rail { border-right: 0; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
      .sim__paper { padding: 20px 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sim-step__dot, .sim-doc__block, .sim-doc__ask,
      .sim--review .sim__ask, .sim--review .sim__progress { transition: none; animation: none; }
    }

    /* ── Shells added for the remaining sixteen ─────────── */
    .sim__queue {
      padding: 16px 14px; min-width: 0;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim--inbox { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 460px; }
    .sim--inbox .sim__main, .sim--split .sim__main { display: flex; flex-direction: column; }
    /* Content starts at the top. A grid row that stretches to fill
       the panel leaves a card floating in the middle of nowhere. */
    .sim__thread { display: grid; gap: 16px; align-content: start; }
    .sim__thread--pad { padding: 18px 20px; flex: 1 1 auto; }
    .sim-turn { display: flex; gap: 11px; align-items: flex-start; }
    .sim-turn > div { min-width: 0; flex: 1 1 auto; }
    .sim-turn__time { margin-left: auto; font-size: 11px; color: var(--app-ink-dim, #9aa0a6); }
    .sim-foot__note {
      margin: 0; margin-right: auto; font-size: 12px; line-height: 1.5; max-width: 62ch;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim__foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    /* The nudge is anchored ABOVE the control it describes, so it
       takes the whole row and sits first — a tail pointing at the
       gap beside a button is pointing at nothing. */
    .sim__foot .md-nudge { flex: 1 0 100%; order: -1; margin-bottom: 4px; }
    .sim-queue__n { margin: 0 0 4px; font-size: 12.5px; }
    .sim-queue__n--agent { color: var(--md-sys-color-primary); }

    /* OUTPUT — the artifact is the hero, so it gets the room. */
    .sim__result { padding: 24px 26px; }
    .sim-figure {
      padding: 22px 24px; border-radius: 14px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
      max-width: 460px;
    }
    .sim-figure__k {
      margin: 0; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-figure__v {
      margin: 8px 0 0; font-size: 40px; font-weight: 660; letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .sim-figure__d { margin: 8px 0 14px; font-size: 13px; color: var(--app-ink-dim, #5f6368); }

    /* SURFACES — the tabs are three real product surfaces. */
    .sim__tabs {
      display: flex; gap: 4px; padding: 10px 16px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .sim-tab {
      border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 12.5px;
      padding: 8px 12px; border-radius: 8px 8px 0 0; margin-bottom: -1px;
      color: var(--app-ink-dim, #5f6368);
      border-bottom: 2px solid transparent;
    }
    .sim-tab[aria-selected="true"] {
      color: var(--md-sys-color-primary); border-bottom-color: var(--md-sys-color-primary);
      font-weight: 600;
    }
    .sim__surface { padding: 20px; min-height: 280px; }
    .sim-mail {
      border: 1px solid var(--md-sys-color-outline-variant); border-radius: 10px;
      overflow: hidden; max-width: 560px;
    }
    .sim-mail__hd {
      margin: 0; padding: 9px 14px; font-size: 12px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-mail__hd b { color: var(--app-ink, #202124); font-weight: 600; margin-right: 8px; }
    .sim-mail__b { padding: 16px; }

    /* WORKSPACE — a real toolbar, because "reserved" is a claim
       about a whole screen and needs a screen to be false on. */
    .sim__tools {
      position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 16px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-tool {
      border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 13px;
      padding: 6px 10px; border-radius: 8px; color: var(--app-ink, #202124);
    }
    .sim-tool:hover { background: var(--md-sys-color-surface-container-high); }
    .sim-tool__rule {
      width: 1px; height: 18px; background: var(--md-sys-color-outline-variant);
    }
    .sim-tool__spacer { margin-left: auto; }
    .sim-menu { position: absolute; top: 46px; left: 120px; z-index: 5; }
    .sim__canvas { padding: 22px 26px; min-height: 300px; }
    /* ── Autocomplete · simulator ─────────────────────────── */
    .sim-ac-gen { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; color: var(--md-sys-color-on-surface-variant);
      font: 400 12px/16px var(--md-ref-typeface-plain); --aii-size: 16px; }
    .sim-ac-gen .md-aii { color: var(--md-sys-color-primary); }
    /* ── Icons · simulator (Orbit account) ───────────────── */
    .sim-aii { display: grid; gap: 16px; max-width: 560px; --aii-size: 18px; --aii-ink: var(--md-sys-color-primary); }
    .sim-aii .md-aii { color: var(--aii-ink); }
    .sim-aii-act .md-aii, .sim__tools .sim-aii-act .md-aii { color: var(--md-sys-color-primary); }
    .md3-iconbtn.sim-aii-act .md-aii { --aii-size: 24px; width: 24px; height: 24px; }
    .md3-btn.sim-aii-act .md-aii { width: 18px; height: 18px; }
    .md3-btn[aria-disabled="true"] .md-aii, .md3-iconbtn[aria-disabled="true"] .md-aii { color: inherit; }
    .sim-aii-new { position: relative; display: inline-flex; align-items: center; }
    .sim-aii-badge {
      display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; margin-left: -4px;
      border-radius: var(--md-sys-shape-corner-full, 999px);
      background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
      font: 500 11px/16px var(--md-ref-typeface-plain); letter-spacing: .5px;
    }
    .sim-aii-badge .md-aii { width: 14px; height: 14px; color: inherit; }
    .sim-aii-status, .sim-aii-tool {
      display: flex; align-items: center; gap: 8px; margin: 0;
      color: var(--md-sys-color-on-surface-variant); font: 400 14px/20px var(--md-ref-typeface-plain);
      animation: md-aii-in var(--md-sys-motion-duration-medium2, 300ms) var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1)) both;
    }
    .sim-aii-status .md3-btn { margin-left: auto; }
    .sim-aii-out {
      display: grid; gap: 8px; padding: 12px 16px; border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-aii-out .wf-text, .sim-aii-note { margin: 0; }
    .sim-aii-genrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sim-aii-field { display: grid; gap: 8px; }
    .sim-aii-field .md3-field { height: 56px; padding-right: 56px; border-style: solid; font-family: var(--md-ref-typeface-plain); box-sizing: border-box; }
    .sim-aii-trail { position: absolute; right: 8px; top: 8px; }
    .sim-aii-row { display: flex; align-items: center; gap: 8px; min-height: 48px; }
    .sim-aii-row .sim-rec__v { flex: 1 1 auto; }
    .sim-aii-row .sim-rec__k { min-width: 0; }
    .sim-aii-whyw .md3-tip__pop { bottom: auto; top: 100%; margin: 8px 0 0; }
    .sim-aii[data-one="true"] .md-aii, .sim-aii-badge--mark .md-aii { color: var(--md-sys-color-primary); }
    /* Release-note flow: the four stages, in the same four marks. */
    .sim-aii-flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
    .sim-aii-step {
      display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px;
      border-radius: var(--md-sys-shape-corner-small, 8px); border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface-variant); font: 500 11.5px/16px var(--md-ref-typeface-plain); --aii-size: 16px;
    }
    .sim-aii-step { position: relative; }
    .sim-aii-step + .sim-aii-step::before { content: "→"; position: absolute; left: -14px; color: var(--md-sys-color-outline); }
    .sim-aii-step .md-aii { width: 16px; height: 16px; color: var(--md-sys-color-on-surface-variant); }
    .sim-aii-step.is-now { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-color: transparent; }
    .sim-aii-step.is-now .md-aii { color: var(--md-sys-color-primary); }
    .sim-aii-step.is-past { color: var(--md-sys-color-on-surface); }
    .sim-aii-doc { display: grid; gap: 6px; padding: 12px 16px; border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-low); }
    .sim-aii-text { margin: 0; }
    .sim-aii-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .sim-aii-statusin { display: inline-flex; align-items: center; gap: 8px; }
    .sim-aii-activity { display: grid; gap: 4px; }
    .sim-aii-tool {
      display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0 8px; border: 0;
      border-radius: var(--md-sys-shape-corner-small, 8px); background: transparent; cursor: pointer; text-align: left;
      color: var(--md-sys-color-on-surface-variant); font: 400 14px/20px var(--md-ref-typeface-plain); position: relative; overflow: hidden;
    }
    .sim-aii-tool::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; }
    .sim-aii-tool:hover::before { opacity: .08; }
    .sim-aii-tool:focus-visible { outline: 3px solid var(--md-sys-color-secondary); outline-offset: 2px; }
    .sim-aii-act.is-busy, .sim-aii-act.is-busy[aria-disabled="true"] { opacity: 1; cursor: progress; }
    .sim-aii-act.is-busy .md-aii { color: var(--md-sys-color-primary); }
    .sim-aii-tooldetail { padding: 0 8px 0 36px; color: var(--md-sys-color-on-surface-variant); font: 400 12px/16px var(--md-ref-typeface-plain); }
    @media (prefers-reduced-motion: reduce) { .sim-aii-status, .sim-aii-tool { animation: none; } }

    .sim-rec { display: grid; gap: 2px; max-width: 520px; }
    .sim-rec__row {
      display: flex; align-items: center; gap: 12px; padding: 9px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .sim-rec__k { font-size: 12px; color: var(--app-ink-dim, #9aa0a6); min-width: 84px; }
    .sim-rec__v { font-size: 13.5px; }
    .sim-rec__notes { margin-top: 20px; max-width: 520px; }
    /* The record's fields are narrow on purpose: a full-width input
       pushes the glyph to the far edge of the screen, and the whole
       affordance is that it sits beside the thing it fills. */
    .sim__canvas .md-field { max-width: 520px; }
    .sim__canvas .md-field__row { align-items: center; }
    .sim-rec__v { flex: 1 1 auto; }
    .sim-rec__row .md-field-glyph { flex: 0 0 auto; margin-left: 4px; }
    .sim-rec__row .sim-rec__k:last-of-type { min-width: 0; margin-left: auto; }
    .sim-rec__out {
      margin-top: 14px; padding: 14px 16px; max-width: 520px;
      border-radius: 12px; border: 1px solid var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-container-low);
    }

    /* COMPOSER — context strip, stage, then the request itself. */
    .sim__ctx {
      padding: 12px 18px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-ctx__t { margin: 0; font-size: 12.5px; color: var(--app-ink-dim, #5f6368); }

    .sim__stage { padding: 20px; min-height: 220px; }
    .sim--composer .sim__foot { padding: 12px 18px 16px; border-top: 1px solid var(--md-sys-color-outline-variant); }
    .sim--composer .wf-ask, .sim--composer .md-entry { width: 100%; max-width: 100%; margin: 0; }
    .sim__stage .md-cta { margin: 0 auto; }
    .sim-stage__empty {
      margin: 0; font-size: 13px; line-height: 1.6; max-width: 56ch;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-exs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .sim-blank { display: grid; gap: 18px; justify-items: start; }
    .sim-empty-state { text-align: center; padding: 30px 0; }
    .sim-empty-state > .md-agentav { margin-inline: auto; }

    /* The chart exists so the suggestions can be about something.
       It is the smallest thing that makes them specific. */
    .sim-chart { display: flex; align-items: flex-end; gap: 14px; }
    .sim-chart__bars { display: flex; align-items: flex-end; gap: 3px; }
    .sim-bar {
      width: 7px; border-radius: 2px 2px 0 0;
      background: var(--md-sys-color-primary); opacity: .85;
    }
    .sim-bar.is-low { background: var(--md-sys-color-outline); }
    .sim-chart__k { margin: 0; font-size: 12px; color: var(--app-ink-dim, #5f6368); }

    .sim-claim {
      display: flex; align-items: center; gap: 16px; padding: 16px 18px;
      border: 1px solid var(--md-sys-color-outline-variant); border-radius: 12px;
      background: var(--md-sys-color-surface-container-lowest);
    }
    .sim-claim__t { margin: 0; font-size: 14px; font-weight: 600; }
    .sim-claim__m { margin: 3px 0 0; font-size: 12px; color: var(--app-ink-dim, #5f6368); }
    .sim-claim__v { margin: 0 0 0 auto; font-size: 17px; font-weight: 640; }

    .sim-sizes-row {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding-top: 16px; border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .sim-sizes__k { font-size: 11.5px; color: var(--app-ink-dim, #9aa0a6); }

    @media (max-width: 760px) {
      .sim--inbox { grid-template-columns: 1fr; }
      .sim__queue { border-right: 0; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
      .sim__result, .sim__canvas { padding: 18px; }
      .sim-figure__v { font-size: 32px; }
    }

    /* ── MEDIA shell ──────────────────────────────────────
       The artefact is the input, so it gets the room; the reading
       sits beneath it rather than replacing it. */
    .sim__media {
      padding: 20px 22px 0; display: grid; gap: 8px; justify-items: start;
    }
    .sim__media .md-vis__frame { max-width: 420px; width: 100%; }
    .sim__media .md-ink { width: 100%; max-width: 100%; }
    .sim-media__cap {
      margin: 0; font-size: 11.5px; color: var(--app-ink-dim, #9aa0a6);
    }
    .sim__reading { padding: 16px 22px 20px; }
    .sim__reading .md-ink__read { border-top: 0; padding-top: 0; margin-top: 0; }
    .sim--media .sim__docfoot { margin-top: 0; }
    .sim__stage .md-voice, .sim__foot .md-voice { max-width: 100%; }
    .sim__foot .md-voice { flex: 1 0 100%; }
    .sim__stage .md-struct, .sim__stage .md-struct__menu { max-width: 100%; }

    /* ── SESSION shell ────────────────────────────────────
       The capture surface is the only thing in this scenario that
       gets read at a glance, so it takes the room; the transcript
       grows underneath it. */
    .sim__voice { padding: 18px 20px 4px; display: grid; justify-items: center; }
    .sim__voice .md-vsess, .sim__voice .md-voice { width: 100%; max-width: 460px; }
    .sim__transcript {
      padding: 14px 20px 6px; display: grid; gap: 12px; align-content: start;
    }
    .sim--session .sim__foot {
      padding: 14px 20px 16px; display: flex; align-items: center;
      gap: 10px; flex-wrap: wrap;
    }

    /* ── SCREEN shell ─────────────────────────────────────
       For patterns whose subject is whatever is already on
       screen. The product surface gets the room and the agent
       lives on a bar beneath it — because the whole argument is
       that the agent is reading THIS, not a description of it. */
    .sim__screen { padding: 18px 20px 0; }
    .sim__screen .md-sel, .sim__compose .md-sel { max-width: 100%; }
    .sim__compose { padding: 12px 20px 4px; }
    .sim--screen .sim__out {
      margin: 4px 20px 0; padding: 14px 16px;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container);
    }
    .sim--screen .sim__foot {
      padding: 14px 20px 16px; display: flex; align-items: center;
      gap: 10px; flex-wrap: wrap;
    }


    /* ══════════════════════════════════════════════════════════
       THE AGENTIC TOOL SIMULATOR SHELL

       One application frame around every pattern: a quiet left
       navigation, a large workspace, a composer docked at the
       bottom of it, and an atmospheric field behind that composer
       which responds to what the agent is doing.

       THREE LEVELS OF HIERARCHY, and the CSS enforces them rather
       than trusting each pattern to behave:

         1  the pattern          — full contrast, full colour
         2  the agent's context  — the workspace around it
         3  the product shell    — navigation, header, chrome

       The navigation is deliberately the quietest thing on screen.
       It exists to say "this is somewhere real"; the moment it
       competes with the pattern it has failed at its only job.
       ══════════════════════════════════════════════════════════ */
    .ax {
      /* A share of the frame rather than a fixed slab. At the
         width these simulators actually render, 232px was very
         nearly a third of the shell — the navigation is meant to
         be the quiet part. */
      --ax-nav: clamp(176px, 24%, 232px);
      position: relative;
      display: grid; grid-template-columns: var(--ax-nav) 1fr;
      min-height: 640px; overflow: hidden;
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--md-sys-color-surface-container-lowest);
      box-shadow: 0 1px 2px rgba(16, 14, 24, .06), 0 8px 28px -18px rgba(16, 14, 24, .28);
      font-size: 13.5px; color: var(--md-sys-color-on-surface);
    }

    /* ── Level 3 · the shell ──────────────────────────────── */
    .ax__nav {
      display: flex; flex-direction: column; gap: 2px;
      padding: 16px 12px; min-width: 0;
      background: var(--ink-50, #f5f5f3);
      border-right: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
    }
    .ax__brand {
      display: flex; align-items: center; gap: 9px;
      padding: 2px 8px 14px; font-size: 13.5px; font-weight: 650;
      color: var(--md-sys-color-on-surface);
    }
    .ax__brandmark {
      width: 16px; height: 16px; border-radius: 5px; flex: 0 0 auto;
      background: var(--md-sys-color-primary);
    }
    /* The one navigation control that genuinely does something:
       it resets the scenario. Capsule, because a person acts. */
    .ax__new {
      display: flex; align-items: center; gap: 9px; width: 100%;
      margin-bottom: 12px; padding: 9px 14px;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: transform var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing),
                  background 160ms var(--md-sys-motion-easing-standard);
    }
    .ax__new:hover { background: color-mix(in srgb, var(--md-sys-color-primary-container) 80%, var(--md-sys-color-primary)); }
    .ax__new:active { transform: scale(.97); }
    .ax__new svg { width: 15px; height: 15px; flex: 0 0 auto; }

    .ax__navtoggle {
      display: none; align-items: center; gap: 8px;
      padding: 8px 12px; border: 0; cursor: pointer; font: inherit; font-size: 12.5px;
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }
    .ax__group {
      margin: 14px 8px 6px; font-size: 10.5px; font-weight: 650;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
    }
    .ax__item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 7px 12px; border: 0; text-align: left;
      border-radius: var(--md-sys-shape-corner-full);
      background: transparent; color: var(--md-sys-color-on-surface-variant);
      font: inherit; font-size: 13px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background 160ms var(--md-sys-motion-easing-standard),
                  color 160ms var(--md-sys-motion-easing-standard);
    }
    /* The ellipsis above never fired: the label is a child span, so
       the overflow happens on IT, and a flex child will not shrink
       below its content without min-width:0. A long nav label was
       being cut mid-word instead. */
    .ax__item span:not(.ax__dot) {
      min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }
    .ax__item:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent); }
    /* Selection is a tonal capsule and a weight change — clear at a
       glance, and still quieter than anything in the workspace. */
    .ax__item[aria-current="true"] {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface); font-weight: 600;
    }
    .ax__dot {
      width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto;
      background: currentColor; opacity: .38;
    }
    .ax__item[aria-current="true"] .ax__dot { opacity: 1; color: var(--md-sys-color-primary); }
    .ax__spacer { flex: 1 1 auto; min-height: 12px; }
    .ax__foot {
      padding: 10px 12px 2px; font-size: 11px; line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant);
      border-top: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
    }

    /* ── Level 2 · the workspace ──────────────────────────── */
    .ax__work {
      position: relative; display: flex; flex-direction: column; min-width: 0;
    }
    .ax__head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 22px; min-height: 54px; position: relative; z-index: 2;
      border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
    }
    .ax__crumb {
      font-size: 13px; color: var(--md-sys-color-on-surface); font-weight: 600;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ax__crumb span { font-weight: 400; color: var(--md-sys-color-on-surface-variant); }
    .ax__status {
      display: inline-flex; align-items: center; gap: 8px; margin-left: auto;
      flex: 0 0 auto;
      font-size: 12px; color: var(--md-sys-color-on-surface-variant);
    }
    /* Present to a screen reader, absent to the eye: the flex gap
       already separates these two visually. */
    .ax__sep {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
    .ax__pill {
      padding: 4px 11px; border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant); font-size: 11.5px;
    }
    .ax__canvas {
      position: relative; z-index: 1; flex: 1 1 auto; min-height: 0;
      overflow: auto; padding: 20px 22px 8px;
    }
    /* The layouts no longer draw their own frame — the app is the
       frame now — so their outer container flattens in here. */
    .ax__canvas > .sim {
      border: 0; border-radius: 0; background: transparent; box-shadow: none;
      min-height: 0;
    }
    /* Where the PATTERN owns the input surface, that surface is
       what should sit in the dock — so the canvas hands its spare
       height upward and lets the pattern's own composer settle at
       the bottom, in the atmosphere, where the shell's composer
       would otherwise be. */
    .ax[data-shell="composer"] .ax__canvas,
    .ax[data-shell="conversation"] .ax__canvas {
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .ax[data-shell="composer"] .ax__canvas > .sim,
    .ax[data-shell="conversation"] .ax__canvas > .sim { width: 100%; }
    /* The layouts used to draw their own footer rule against their
       own card edge. Inside the app the dock is the edge. */
    .ax__canvas .sim__foot, .ax__canvas .sim__docfoot { border-top: 0; }
    /* The first-run statement is drawn as a scrim over its own
       layout, so that layout has to be as tall as the canvas or
       the statement gets cut off at the height of the two lines
       sitting behind it. */
    .ax[data-shell="onboarding"] .ax__canvas > .sim { min-height: 100%; }

    /* ── The dock: composer + atmosphere ──────────────────── */
    /* The composer is prominent without being the whole width of
       the workspace: capped and centred, it lands at roughly
       two-thirds on a wide simulator and simply fills a narrow one.
       This is on the DOCK rather than the composer so the notes
       and the queued-request line stay aligned with it.

       A PERCENTAGE cap, not a pixel one: the pattern page sizes
       its column to its content, so a pixel max-width here would
       quietly become the width of the whole simulator. */
    /* ── One composer width ───────────────────────────────
       The prompt composer is the same object in every pattern, so
       it is the same size in every pattern. Left to itself it
       shrink-wraps its placeholder, which made it 393px on one
       page and 460px on the next — the reader then reads the
       difference as meaning something, and it means nothing.
       One token, used by the docked composer and the standalone
       one in the Live Preview. */
    :root { --ax-composer-max: 560px; }

    .ax__dock {
      position: relative; z-index: 1; padding: 8px 22px 22px;
      width: 100%; margin: 0 auto;
      /* Still a share of the workspace rather than a fixed slab —
         the dock sits inside a shell with its own navigation —
         but it may not grow past the one standard width. */
      max-width: min(calc(var(--ax-composer-max) + 44px), max(360px, 78%));
      /* The composer's width is set by the workspace, not the
         viewport, so anything inside it that needs to respond to
         ITS width has to ask the dock rather than the window. */
      container-type: inline-size; container-name: dock;
    }

    /* ── Level 0 · the atmosphere ─────────────────────────────
       Three soft fields, blurred past the point of having an edge,
       drifting on three different long cycles so the loop never
       lines up and never reads as a loop. It is behind everything
       and it is never the brightest thing on screen.

       It is also not decoration: `data-phase` on .ax moves it, and
       the phase is the agent's actual state. Idle it sits low and
       wide under the composer; while the agent works it climbs into
       the canvas where the work is appearing; when the agent needs
       a decision it settles and dims so the decision is the
       brightest thing in the frame. */
    .ax__aura {
      position: absolute; left: -6%; right: -6%; bottom: -12%; height: 66%;
      pointer-events: none; z-index: 0;
      transition: height 1600ms var(--md-sys-motion-easing-emphasized),
                  bottom 1600ms var(--md-sys-motion-easing-emphasized);
    }
    .ax__aura i {
      position: absolute; display: block; border-radius: 50%;
      filter: blur(44px); will-change: transform, opacity;
      transition: opacity 1400ms var(--md-sys-motion-easing-standard),
                  transform 1600ms var(--md-sys-motion-easing-emphasized);
    }
    .ax__aura i:nth-child(1) {
      width: 52%; height: 104%; left: 2%; bottom: -24%; opacity: .46;
      background: radial-gradient(circle at 50% 50%,
        color-mix(in oklab, var(--md-sys-color-primary) 46%, transparent) 0%,
        transparent 68%);
      animation: ax-a 23s ease-in-out infinite alternate;
    }
    .ax__aura i:nth-child(2) {
      width: 58%; height: 96%; right: 0%; bottom: -30%; opacity: .40;
      background: radial-gradient(circle at 50% 50%,
        color-mix(in oklab, var(--md-sys-color-tertiary, #7d5260) 40%, transparent) 0%,
        transparent 70%);
      animation: ax-b 19s ease-in-out infinite alternate;
    }
    .ax__aura i:nth-child(3) {
      width: 44%; height: 80%; left: 28%; bottom: -16%; opacity: .30;
      background: radial-gradient(circle at 50% 50%,
        color-mix(in oklab, var(--md-sys-color-secondary, #625b71) 42%, transparent) 0%,
        transparent 66%);
      animation: ax-c 31s ease-in-out infinite alternate;
    }
    /* Drift, not travel: a few per cent in each direction, on three
       coprime-ish durations so the three never return to the same
       relative position within a sitting. */
    @keyframes ax-a {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(7%, -4%, 0) scale(1.07); }
      100% { transform: translate3d(-3%, 3%, 0) scale(.97); }
    }
    @keyframes ax-b {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(-6%, -6%, 0) scale(1.05); }
      100% { transform: translate3d(4%, 2%, 0) scale(.98); }
    }
    @keyframes ax-c {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(3%, -9%, 0) scale(1.1); }
      100% { transform: translate3d(-5%, 4%, 0) scale(1); }
    }

    /* Focus: the fields gather under the composer. */
    .ax[data-phase="focus"] .ax__aura i:nth-child(1) { opacity: .52; transform: translate3d(6%, -2%, 0) scale(1.04); }
    .ax[data-phase="focus"] .ax__aura i:nth-child(2) { opacity: .44; transform: translate3d(-5%, -2%, 0) scale(1.04); }
    .ax[data-phase="focus"] .ax__aura i:nth-child(3) { opacity: .34; }
    .ax[data-phase="focus"] .ax__aura { height: 58%; bottom: -14%; }

    /* Thinking: the same fields, breathing a little faster. */
    .ax[data-phase="thinking"] .ax__aura i { animation-duration: 13s, 13s; }
    .ax[data-phase="thinking"] .ax__aura i:nth-child(1) { animation-duration: 14s; opacity: .5; }
    .ax[data-phase="thinking"] .ax__aura i:nth-child(2) { animation-duration: 12s; opacity: .42; }
    .ax[data-phase="thinking"] .ax__aura i:nth-child(3) { animation-duration: 17s; opacity: .34; }

    /* Working: the atmosphere climbs into the canvas, where the
       work is actually appearing. */
    .ax[data-phase="working"] .ax__aura { height: 88%; bottom: -4%; }
    .ax[data-phase="working"] .ax__aura i:nth-child(1) { opacity: .34; }
    .ax[data-phase="working"] .ax__aura i:nth-child(2) { opacity: .30; }

    /* Blocked: everything settles and dims, because the brightest
       thing in the frame now has to be the decision. */
    .ax[data-phase="blocked"] .ax__aura i { animation-play-state: paused; opacity: .16; }

    /* Complete: relaxes back towards ambient, one step quieter. */
    .ax[data-phase="done"] .ax__aura i:nth-child(1) { opacity: .26; }
    .ax[data-phase="done"] .ax__aura i:nth-child(2) { opacity: .22; }
    .ax[data-phase="done"] .ax__aura i:nth-child(3) { opacity: .18; }

    /* ── The composer ─────────────────────────────────────── */
    /* Standalone in the Live Preview, the composer has no dock to
       size it and the centred stage shrink-wraps whatever is put
       in it. These two rules are what make every pattern's
       composer the same width regardless of its placeholder. */
    /* One prompt width in every Live Preview (user request, 7 Oct): wider than the
       simulators' working composer, the same in every pattern. */
    .pv-stage { --ax-composer-max: 720px; }
    .pv-stage .ax__composer { width: 100%; max-width: var(--ax-composer-max); }
    .pv-stage .pv-ml { width: 100%; display: grid; justify-items: center; }

    .ax__composer {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 7px 8px; min-height: 56px;
      border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 80%, transparent);
      border-radius: 26px;
      background: color-mix(in srgb, var(--md-sys-color-surface-container-lowest) 88%, transparent);
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 2px rgba(16, 14, 24, .04), 0 10px 30px -22px rgba(16, 14, 24, .5);
      transition: border-radius var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing),
                  border-color 200ms var(--md-sys-motion-easing-standard),
                  box-shadow 260ms var(--md-sys-motion-easing-standard),
                  transform var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing);
    }
    /* Focus is a shape change, not a glow: the capsule squares up a
       step, which is the same "this is now a working surface" move
       the rest of the system uses. */
    .ax__composer:focus-within {
      border-radius: 20px;
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 1px 2px rgba(16, 14, 24, .04), 0 14px 34px -20px rgba(16, 14, 24, .55);
    }
    /* Submitted: it compresses slightly and hands attention upward. */
    .ax[data-phase="thinking"] .ax__composer,
    .ax[data-phase="working"] .ax__composer { transform: scale(.985); }
    .ax__composer[data-idle="false"] { opacity: .92; }

    /* The composer's icon buttons are the kit's Small icon button
       (.md-icon-button in material-components.css): + and mic are
       standard, send is filled, the live mic is tonal. This class
       only places them in the composer row; size, colour, state
       layers and the pressed shape all come from the component. */
    .ax__cbtn { flex: 0 0 auto; }
    /* When a request wraps, the controls stay on the bottom line
       where the thumb and the pointer already are, rather than
       floating to the middle of a taller composer. On a single line
       the row is the buttons' height, so nothing changes there. */
    .ax__composer > .ax__cbtn, .ax__composer > .ax__mode { align-self: flex-end; }

    /* ── The composer's INITIAL size (Initial CTA) ─────────────
       Not a second component: the same form, the same controls, in
       the same order. In the empty workspace the field takes its own
       row above the controls — the layout this composer already uses
       on a phone — with more room to write, a larger corner, and the
       field's text one step up the type scale. After the first
       request the attribute goes and it is the working composer.

       Sizes are variables so a host can choose Large or Medium
       without restyling anything. */
    /* THE SAME COMPOSER AS OPEN INPUT (user requests, 1 Oct): one row —
       Add context, the field, voice, send — with the working composer's
       own padding, corner and type. The attribute stays only so the
       Initial CTA's states and its hand-over can find it; it no longer
       changes the look or the structure. Only the growth ceiling is
       its own. */
    .ax__composer[data-size="initial"] .ax__field {
      max-height: calc(1.45em * var(--axi-lines, 8) + 8px);
    }
    /* Voice is a mode of the same composer: it keeps the invitation's
       size rather than collapsing to a strip. */
    .ax__composer[data-size="initial"][data-mode="voice"] {
      align-items: center; align-content: center;
    }
    /* In the empty workspace there is room below and a heading above,
       so the flyouts open downwards rather than over the lead line. */
    .ax__composer[data-size="initial"] .ax__menu {
      bottom: auto; top: calc(100% + 10px);
    }
    /* …except Model Selection and its effort step, which open upward
       everywhere, as in the Model Selection pattern (user request, 7 Oct). */
    .ax__composer[data-size="initial"] .ax__menu--model,
    .ax__composer[data-size="initial"] .ax__menu--effort {
      top: auto; bottom: calc(100% + 10px);
    }

    /* ── Initial CTA · the empty workspace ────────────────────
       The surface the invitation lives on in the Live Preview: an
       agent workspace with nothing in it. It is ONE box across all
       five states, the same height empty and working, so that when
       the composer moves down to its working place it is visibly
       the same object travelling within the same space. Sized by its
       container, not the viewport, so it behaves the same embedded
       in a side panel as it does full width. */
    .md-icta {
      --icta-max: var(--ax-composer-max);
      position: relative; width: 100%; max-width: calc(var(--ax-composer-max) + 48px); margin: 0 auto;
      height: 440px; display: flex; flex-direction: column;
      border-radius: var(--md-sys-shape-corner-extra-large, 28px);
      background: transparent;  /* no tint: the outline alone marks the workspace (user, 30 Sep) */
      border: 0;  /* no stroke container (user, 30 Sep) */
      /* Not clipped: the composer's flyouts have to be able to leave
         the box. The thread scrolls inside its own region instead. */
      container: icta / inline-size;
    }
    .md-icta__center {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 28px 24px;
    }
    .md-icta .ax__composer { width: 100%; max-width: var(--icta-max); }
    .pv-stage .md-icta .ax__composer[data-size="initial"] { max-width: var(--icta-max); }
    /* Level 2: one short line of context. Muted, never a headline. */
    .md-icta__lead {
      margin: 0; max-width: 46ch; text-align: center; text-wrap: balance;
      font-size: 15px; line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* The send key, named once the field has focus. Space is kept
       for it at rest so focusing the field moves nothing. */
    .md-icta__keys {
      margin: -4px 0 0; min-height: 1.4em;
      font-size: 12px; line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant);
