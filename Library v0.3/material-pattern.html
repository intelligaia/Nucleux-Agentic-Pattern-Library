      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 14px;
      background: var(--md-sys-color-surface-container-lowest);
      overflow: hidden;
      font-family: var(--md-ref-typeface-plain);
      color: var(--app-ink, #202124);
    }

    /* ── Chrome ─────────────────────────────────────────── */
    .sim__bar {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim__brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12.5px; font-weight: 640;
    }
    .sim__brandmark {
      width: 16px; height: 16px; border-radius: 5px;
      background: var(--md-sys-color-primary);
    }
    .sim__title {
      font-size: 12.5px; color: var(--app-ink-dim, #5f6368);
      padding-left: 12px; border-left: 1px solid var(--md-sys-color-outline-variant);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sim__who {
      margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--app-ink-dim, #5f6368); flex: 0 0 auto;
    }
    .sim__pill {
      flex: 0 0 auto; height: 24px; padding: 0 11px; border-radius: 999px;
      display: inline-flex; align-items: center;
      background: var(--md-sys-color-surface-container-high);
      color: var(--app-ink-dim, #5f6368); font-size: 11px;
    }
    .sim__pill:empty { display: none; }
    .sim__body { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }

    /* ── REVIEW & APPROVAL ──────────────────────────────── */
    .sim-ask { display: flex; gap: 10px; align-items: baseline; }
    .sim-ask__who {
      flex: 0 0 auto; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-ask__t { margin: 0; font-size: 15px; line-height: 1.5; }

    /* The agent's own work, itemised. A blocked step has to read as
       blocked, or the permission ask looks like it came from nowhere. */
    .sim-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
    .sim-step { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
    .sim-step__dot {
      flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%;
      background: var(--md-sys-color-outline-variant);
      transition: background 200ms var(--md-sys-motion-easing-standard);
    }
    .sim-step.is-done .sim-step__dot { background: var(--md-sys-color-primary); }
    .sim-step.is-run  .sim-step__dot {
      background: var(--md-sys-color-primary);
      animation: sim-pulse 1.4s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    .sim-step.is-blocked .sim-step__dot {
      background: transparent;
      box-shadow: inset 0 0 0 2px var(--md-sys-color-primary);
    }
    .sim-step.is-skipped { color: var(--app-ink-dim, #9aa0a6); }
    .sim-step.is-wait    { color: var(--app-ink-dim, #9aa0a6); }
    .sim-step.is-skipped .sim-step__t { text-decoration: line-through; }
    .sim-step__n { margin-left: auto; font-size: 11.5px; color: var(--app-ink-dim, #5f6368); }
    @keyframes sim-pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.5); opacity: .55; }
    }

    /* The decision takes primacy while it waits. The rest of the
       surface recedes rather than the card shouting. */
    .sim--review.is-deciding .sim__ask,
    .sim--review.is-deciding .sim__progress { opacity: .55; }
    .sim--review .sim__ask,
    .sim--review .sim__progress {
      transition: opacity 380ms var(--md-sys-motion-easing-emphasized);
    }
    .sim__focus { }
    .sim__focus .sc-consent { border-color: var(--md-sys-color-primary); }

    .sim-brief {
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px; padding: 16px 18px;
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-brief__head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .sim-brief__t { font-size: 13px; font-weight: 640; }
    .sim-brief__b { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #444746; }
    .sim-brief__gap {
      margin: 12px 0 0; padding-left: 12px; font-size: 12.5px; line-height: 1.55;
      border-left: 2px solid var(--md-sys-color-outline);
      color: var(--app-ink-dim, #5f6368);
    }

    /* ── ONBOARDING / FIRST RUN ─────────────────────────── */
    .sim--first { position: relative; min-height: 420px; display: flex; flex-direction: column; }
    .sim--first .sim__body { flex: 1 1 auto; }
    .sim-hello { text-align: center; padding: 22px 0 8px; }
    /* The mark is a flex container, so text-align does not reach it. */
    .sim-hello > .md-agentav { margin-inline: auto; }
    .sim-hello__t { margin: 12px 0 0; font-size: 16px; font-weight: 640; }
    .sim-hello__d {
      margin: 6px auto 0; max-width: 44ch; font-size: 13px; line-height: 1.55;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-starters {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 20px;
    }
    .sim__thread { display: grid; gap: 14px; }
    .sim-turn { display: flex; gap: 10px; align-items: flex-start; }
    .sim-turn__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sim-turn__n { font-size: 12.5px; font-weight: 640; }
    .sim__foot {
      padding: 12px 16px 16px; display: grid; gap: 10px; justify-items: start;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .sim__foot .wf-ask { width: 100%; margin: 0; }
    .sim__scrim {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding: 20px; background: rgba(28, 27, 31, 0.32); backdrop-filter: blur(1.5px);
    }
    .sim__scrim .md-disclaim { max-width: 440px; margin: 0; }

    /* ── DOCUMENT / EDITOR ──────────────────────────────── */
    .sim__paper {
      padding: 26px 32px 30px; min-height: 320px;
      background: var(--md-sys-color-surface-container-lowest);
    }
    .sim-doc__h { margin: 0; font-size: 21px; font-weight: 660; letter-spacing: -0.01em; }
    .sim-doc__meta {
      margin: 4px 0 20px; font-size: 11.5px; color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-doc__p {
      margin: 0 0 14px; font-size: 14.5px; line-height: 1.7; color: #33353a; max-width: 62ch;
    }
    .sim-doc__p--sel { background: var(--md-sys-color-secondary-container); border-radius: 4px; }
    .sim-doc__ask {
      display: inline-flex; align-items: center; gap: 6px; margin-left: 10px;
      padding: 4px 12px; border: 0; cursor: pointer; font: inherit; font-size: 12.5px;
      border-radius: 999px;
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
      transition: transform 180ms cubic-bezier(.34, 1.56, .64, 1);
    }
    .sim-doc__ask:active { transform: scale(0.95); }
    .sim-doc__ask .md-glyph { fill: currentColor; }

    /* Certainty is edge definition. While the agent is writing, the
       block is not boxed — tinted ground, no border. As it settles
       the boundary resolves into a container. */
    .sim-doc__block {
      max-width: 62ch; border-radius: 12px;
      border: 1px solid transparent;
      transition: border-color 380ms var(--md-sys-motion-easing-emphasized),
                  background 380ms var(--md-sys-motion-easing-emphasized),
                  padding 380ms var(--md-sys-motion-easing-emphasized);
    }
    .sim-doc__block.is-live {
      padding: 12px 14px;
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-doc__block.is-settling {
      border-color: transparent;
      background: linear-gradient(180deg, var(--md-sys-color-primary-container), transparent);
    }
    .sim-doc__block .sim-doc__p { margin: 0; }
    .sim-doc__prov { display: block; margin-top: 10px; }
    .sim__paper.is-live { box-shadow: inset 3px 0 0 var(--md-sys-color-primary); }
    .sim__docfoot {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-doc__who {
      display: inline-flex; align-items: center; gap: 8px; margin-right: auto;
      font-size: 12.5px; color: var(--app-ink-dim, #5f6368);
    }

    /* ── SPLIT WORKSPACE ────────────────────────────────── */
    .sim--split { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 440px; }
    .sim__rail {
      padding: 16px 14px;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim__main { display: flex; flex-direction: column; min-width: 0; }
    .sim__query { padding: 16px 18px 0; }
    .sim__query .md-nlsearch { max-width: 100%; }
    .sim__query .md-applied { max-width: 100%; }
    .sim__results { flex: 1 1 auto; padding: 16px 18px 20px; }
    .sim-rail__k {
      margin: 0 0 12px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-rail__row {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-rail__row.is-on { color: var(--app-ink, #202124); }
    .sim-rail__n { display: block; font-size: 12.5px; font-weight: 550; }
    .sim-rail__v { display: block; font-size: 11.5px; opacity: .8; }
    .sim-rail__note {
      margin: 16px 0 0; padding-top: 12px; font-size: 11px; line-height: 1.5;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .sim-row {
      display: flex; align-items: baseline; gap: 12px; padding: 11px 12px;
      border-radius: 8px; background: var(--md-sys-color-surface-container-low);
    }
    .sim-row__n { font-size: 13.5px; font-weight: 600; }
    .sim-row__m { margin-left: auto; font-size: 12px; color: var(--app-ink-dim, #5f6368); }
    .sim-empty {
      margin: 0; padding: 24px 0; text-align: center; font-size: 13px;
      color: var(--app-ink-dim, #9aa0a6);
    }
    .md-fchip--off { background: transparent; color: var(--app-ink-dim, #9aa0a6); }

    @media (max-width: 760px) {
      .sim--split { grid-template-columns: 1fr; }
      .sim__rail { border-right: 0; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
      .sim__paper { padding: 20px 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sim-step__dot, .sim-doc__block, .sim-doc__ask,
      .sim--review .sim__ask, .sim--review .sim__progress { transition: none; animation: none; }
    }

    /* ── Shells added for the remaining sixteen ─────────── */
    .sim__queue {
      padding: 16px 14px; min-width: 0;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim--inbox { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 460px; }
    .sim--inbox .sim__main, .sim--split .sim__main { display: flex; flex-direction: column; }
    /* Content starts at the top. A grid row that stretches to fill
       the panel leaves a card floating in the middle of nowhere. */
    .sim__thread { display: grid; gap: 16px; align-content: start; }
    .sim__thread--pad { padding: 18px 20px; flex: 1 1 auto; }
    .sim-turn { display: flex; gap: 11px; align-items: flex-start; }
    .sim-turn > div { min-width: 0; flex: 1 1 auto; }
    .sim-turn__time { margin-left: auto; font-size: 11px; color: var(--app-ink-dim, #9aa0a6); }
    .sim-foot__note {
      margin: 0; margin-right: auto; font-size: 12px; line-height: 1.5; max-width: 62ch;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim__foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    /* The nudge is anchored ABOVE the control it describes, so it
       takes the whole row and sits first — a tail pointing at the
       gap beside a button is pointing at nothing. */
    .sim__foot .md-nudge { flex: 1 0 100%; order: -1; margin-bottom: 4px; }
    .sim-queue__n { margin: 0 0 4px; font-size: 12.5px; }
    .sim-queue__n--agent { color: var(--md-sys-color-primary); }

    /* OUTPUT — the artifact is the hero, so it gets the room. */
    .sim__result { padding: 24px 26px; }
    .sim-figure {
      padding: 22px 24px; border-radius: 14px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
      max-width: 460px;
    }
    .sim-figure__k {
      margin: 0; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--app-ink-dim, #9aa0a6);
    }
    .sim-figure__v {
      margin: 8px 0 0; font-size: 40px; font-weight: 660; letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .sim-figure__d { margin: 8px 0 14px; font-size: 13px; color: var(--app-ink-dim, #5f6368); }

    /* SURFACES — the tabs are three real product surfaces. */
    .sim__tabs {
      display: flex; gap: 4px; padding: 10px 16px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .sim-tab {
      border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 12.5px;
      padding: 8px 12px; border-radius: 8px 8px 0 0; margin-bottom: -1px;
      color: var(--app-ink-dim, #5f6368);
      border-bottom: 2px solid transparent;
    }
    .sim-tab[aria-selected="true"] {
      color: var(--md-sys-color-primary); border-bottom-color: var(--md-sys-color-primary);
      font-weight: 600;
    }
    .sim__surface { padding: 20px; min-height: 280px; }
    .sim-mail {
      border: 1px solid var(--md-sys-color-outline-variant); border-radius: 10px;
      overflow: hidden; max-width: 560px;
    }
    .sim-mail__hd {
      margin: 0; padding: 9px 14px; font-size: 12px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-mail__hd b { color: var(--app-ink, #202124); font-weight: 600; margin-right: 8px; }
    .sim-mail__b { padding: 16px; }

    /* WORKSPACE — a real toolbar, because "reserved" is a claim
       about a whole screen and needs a screen to be false on. */
    .sim__tools {
      position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 16px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-tool {
      border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 13px;
      padding: 6px 10px; border-radius: 8px; color: var(--app-ink, #202124);
    }
    .sim-tool:hover { background: var(--md-sys-color-surface-container-high); }
    .sim-tool__rule {
      width: 1px; height: 18px; background: var(--md-sys-color-outline-variant);
    }
    .sim-tool__spacer { margin-left: auto; }
    .sim-menu { position: absolute; top: 46px; left: 120px; z-index: 5; }
    .sim__canvas { padding: 22px 26px; min-height: 300px; }
    .sim-rec { display: grid; gap: 2px; max-width: 520px; }
    .sim-rec__row {
      display: flex; align-items: center; gap: 12px; padding: 9px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .sim-rec__k { font-size: 12px; color: var(--app-ink-dim, #9aa0a6); min-width: 84px; }
    .sim-rec__v { font-size: 13.5px; }
    .sim-rec__notes { margin-top: 20px; max-width: 520px; }
    /* The record's fields are narrow on purpose: a full-width input
       pushes the glyph to the far edge of the screen, and the whole
       affordance is that it sits beside the thing it fills. */
    .sim__canvas .md-field { max-width: 520px; }
    .sim__canvas .md-field__row { align-items: center; }
    .sim-rec__v { flex: 1 1 auto; }
    .sim-rec__row .md-field-glyph { flex: 0 0 auto; margin-left: 4px; }
    .sim-rec__row .sim-rec__k:last-of-type { min-width: 0; margin-left: auto; }
    .sim-rec__out {
      margin-top: 14px; padding: 14px 16px; max-width: 520px;
      border-radius: 12px; border: 1px solid var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-container-low);
    }

    /* COMPOSER — context strip, stage, then the request itself. */
    .sim__ctx {
      padding: 12px 18px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .sim-ctx__t { margin: 0; font-size: 12.5px; color: var(--app-ink-dim, #5f6368); }

    .sim__stage { padding: 20px; min-height: 220px; }
    .sim--composer .sim__foot { padding: 12px 18px 16px; border-top: 1px solid var(--md-sys-color-outline-variant); }
    .sim--composer .wf-ask, .sim--composer .md-entry { width: 100%; max-width: 100%; margin: 0; }
    .sim__stage .md-cta { margin: 0 auto; }
    .sim-stage__empty {
      margin: 0; font-size: 13px; line-height: 1.6; max-width: 56ch;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-exs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .sim-blank { display: grid; gap: 18px; justify-items: start; }
    .sim-empty-state { text-align: center; padding: 30px 0; }
    .sim-empty-state > .md-agentav { margin-inline: auto; }

    /* The chart exists so the suggestions can be about something.
       It is the smallest thing that makes them specific. */
    .sim-chart { display: flex; align-items: flex-end; gap: 14px; }
    .sim-chart__bars { display: flex; align-items: flex-end; gap: 3px; }
    .sim-bar {
      width: 7px; border-radius: 2px 2px 0 0;
      background: var(--md-sys-color-primary); opacity: .85;
    }
    .sim-bar.is-low { background: var(--md-sys-color-outline); }
    .sim-chart__k { margin: 0; font-size: 12px; color: var(--app-ink-dim, #5f6368); }

    .sim-claim {
      display: flex; align-items: center; gap: 16px; padding: 16px 18px;
      border: 1px solid var(--md-sys-color-outline-variant); border-radius: 12px;
      background: var(--md-sys-color-surface-container-lowest);
    }
    .sim-claim__t { margin: 0; font-size: 14px; font-weight: 600; }
    .sim-claim__m { margin: 3px 0 0; font-size: 12px; color: var(--app-ink-dim, #5f6368); }
    .sim-claim__v { margin: 0 0 0 auto; font-size: 17px; font-weight: 640; }

    .sim-sizes-row {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding-top: 16px; border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .sim-sizes__k { font-size: 11.5px; color: var(--app-ink-dim, #9aa0a6); }

    @media (max-width: 760px) {
      .sim--inbox { grid-template-columns: 1fr; }
      .sim__queue { border-right: 0; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
      .sim__result, .sim__canvas { padding: 18px; }
      .sim-figure__v { font-size: 32px; }
    }

    /* ── MEDIA shell ──────────────────────────────────────
       The artefact is the input, so it gets the room; the reading
       sits beneath it rather than replacing it. */
    .sim__media {
      padding: 20px 22px 0; display: grid; gap: 8px; justify-items: start;
    }
    .sim__media .md-vis__frame { max-width: 420px; width: 100%; }
    .sim__media .md-ink { width: 100%; max-width: 100%; }
    .sim-media__cap {
      margin: 0; font-size: 11.5px; color: var(--app-ink-dim, #9aa0a6);
    }
    .sim__reading { padding: 16px 22px 20px; }
    .sim__reading .md-ink__read { border-top: 0; padding-top: 0; margin-top: 0; }
    .sim--media .sim__docfoot { margin-top: 0; }
    .sim__stage .md-voice, .sim__foot .md-voice { max-width: 100%; }
    .sim__foot .md-voice { flex: 1 0 100%; }
    .sim__stage .md-struct, .sim__stage .md-struct__menu { max-width: 100%; }

    /* ── SESSION shell ────────────────────────────────────
       The capture surface is the only thing in this scenario that
       gets read at a glance, so it takes the room; the transcript
       grows underneath it. */
    .sim__voice { padding: 18px 20px 4px; display: grid; justify-items: center; }
    .sim__voice .md-vsess, .sim__voice .md-voice { width: 100%; max-width: 460px; }
    .sim__transcript {
      padding: 14px 20px 6px; display: grid; gap: 12px; align-content: start;
    }
    .sim--session .sim__foot {
      padding: 14px 20px 16px; display: flex; align-items: center;
      gap: 10px; flex-wrap: wrap;
    }

    /* ── SCREEN shell ─────────────────────────────────────
       For patterns whose subject is whatever is already on
       screen. The product surface gets the room and the agent
       lives on a bar beneath it — because the whole argument is
       that the agent is reading THIS, not a description of it. */
    .sim__screen { padding: 18px 20px 0; }
    .sim__screen .md-sel, .sim__compose .md-sel { max-width: 100%; }
    .sim__compose { padding: 12px 20px 4px; }
    .sim--screen .sim__out {
      margin: 4px 20px 0; padding: 14px 16px;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container);
    }
    .sim--screen .sim__foot {
      padding: 14px 20px 16px; display: flex; align-items: center;
      gap: 10px; flex-wrap: wrap;
    }


    /* ══════════════════════════════════════════════════════════
       THE AGENTIC TOOL SIMULATOR SHELL

       One application frame around every pattern: a quiet left
       navigation, a large workspace, a composer docked at the
       bottom of it, and an atmospheric field behind that composer
       which responds to what the agent is doing.

       THREE LEVELS OF HIERARCHY, and the CSS enforces them rather
       than trusting each pattern to behave:

         1  the pattern          — full contrast, full colour
         2  the agent's context  — the workspace around it
         3  the product shell    — navigation, header, chrome

       The navigation is deliberately the quietest thing on screen.
       It exists to say "this is somewhere real"; the moment it
       competes with the pattern it has failed at its only job.
       ══════════════════════════════════════════════════════════ */
    .ax {
      /* A share of the frame rather than a fixed slab. At the
         width these simulators actually render, 232px was very
         nearly a third of the shell — the navigation is meant to
         be the quiet part. */
      --ax-nav: clamp(176px, 24%, 232px);
      position: relative;
      display: grid; grid-template-columns: var(--ax-nav) 1fr;
      min-height: 640px; overflow: hidden;
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--md-sys-color-surface-container-lowest);
      box-shadow: 0 1px 2px rgba(16, 14, 24, .06), 0 8px 28px -18px rgba(16, 14, 24, .28);
      font-size: 13.5px; color: var(--md-sys-color-on-surface);
    }

    /* ── Level 3 · the shell ──────────────────────────────── */
    .ax__nav {
      display: flex; flex-direction: column; gap: 2px;
      padding: 16px 12px; min-width: 0;
      background: var(--ink-50, #f5f5f3);
      border-right: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
    }
    .ax__brand {
      display: flex; align-items: center; gap: 9px;
      padding: 2px 8px 14px; font-size: 13.5px; font-weight: 650;
      color: var(--md-sys-color-on-surface);
    }
    .ax__brandmark {
      width: 16px; height: 16px; border-radius: 5px; flex: 0 0 auto;
      background: var(--md-sys-color-primary);
    }
    /* The one navigation control that genuinely does something:
       it resets the scenario. Capsule, because a person acts. */
    .ax__new {
      display: flex; align-items: center; gap: 9px; width: 100%;
      margin-bottom: 12px; padding: 9px 14px;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: transform 200ms cubic-bezier(.34, 1.56, .64, 1),
                  background 160ms var(--md-sys-motion-easing-standard);
    }
    .ax__new:hover { background: color-mix(in srgb, var(--md-sys-color-primary-container) 80%, var(--md-sys-color-primary)); }
    .ax__new:active { transform: scale(.97); }
    .ax__new svg { width: 15px; height: 15px; flex: 0 0 auto; }

    .ax__navtoggle {
      display: none; align-items: center; gap: 8px;
      padding: 8px 12px; border: 0; cursor: pointer; font: inherit; font-size: 12.5px;
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }
    .ax__group {
      margin: 14px 8px 6px; font-size: 10.5px; font-weight: 650;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
    }
    .ax__item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 7px 12px; border: 0; text-align: left;
      border-radius: var(--md-sys-shape-corner-full);
      background: transparent; color: var(--md-sys-color-on-surface-variant);
      font: inherit; font-size: 13px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background 160ms var(--md-sys-motion-easing-standard),
                  color 160ms var(--md-sys-motion-easing-standard);
    }
    /* The ellipsis above never fired: the label is a child span, so
       the overflow happens on IT, and a flex child will not shrink
       below its content without min-width:0. A long nav label was
       being cut mid-word instead. */
    .ax__item span:not(.ax__dot) {
      min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }
    .ax__item:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent); }
    /* Selection is a tonal capsule and a weight change — clear at a
       glance, and still quieter than anything in the workspace. */
    .ax__item[aria-current="true"] {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface); font-weight: 600;
    }
    .ax__dot {
      width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto;
      background: currentColor; opacity: .38;
    }
    .ax__item[aria-current="true"] .ax__dot { opacity: 1; color: var(--md-sys-color-primary); }
    .ax__spacer { flex: 1 1 auto; min-height: 12px; }
    .ax__foot {
      padding: 10px 12px 2px; font-size: 11px; line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant);
      border-top: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
    }

    /* ── Level 2 · the workspace ──────────────────────────── */
    .ax__work {
      position: relative; display: flex; flex-direction: column; min-width: 0;
    }
    .ax__head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 22px; min-height: 54px; position: relative; z-index: 2;
      border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
    }
    .ax__crumb {
      font-size: 13px; color: var(--md-sys-color-on-surface); font-weight: 600;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ax__crumb span { font-weight: 400; color: var(--md-sys-color-on-surface-variant); }
    .ax__status {
      display: inline-flex; align-items: center; gap: 8px; margin-left: auto;
      flex: 0 0 auto;
      font-size: 12px; color: var(--md-sys-color-on-surface-variant);
    }
    /* Present to a screen reader, absent to the eye: the flex gap
       already separates these two visually. */
    .ax__sep {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
    .ax__pill {
      padding: 4px 11px; border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant); font-size: 11.5px;
    }
    .ax__canvas {
      position: relative; z-index: 1; flex: 1 1 auto; min-height: 0;
      overflow: auto; padding: 20px 22px 8px;
    }
    /* The layouts no longer draw their own frame — the app is the
       frame now — so their outer container flattens in here. */
    .ax__canvas > .sim {
      border: 0; border-radius: 0; background: transparent; box-shadow: none;
      min-height: 0;
    }
    /* Where the PATTERN owns the input surface, that surface is
       what should sit in the dock — so the canvas hands its spare
       height upward and lets the pattern's own composer settle at
       the bottom, in the atmosphere, where the shell's composer
       would otherwise be. */
    .ax[data-shell="composer"] .ax__canvas,
    .ax[data-shell="conversation"] .ax__canvas {
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .ax[data-shell="composer"] .ax__canvas > .sim,
    .ax[data-shell="conversation"] .ax__canvas > .sim { width: 100%; }
    /* The layouts used to draw their own footer rule against their
       own card edge. Inside the app the dock is the edge. */
    .ax__canvas .sim__foot, .ax__canvas .sim__docfoot { border-top: 0; }
    /* The first-run statement is drawn as a scrim over its own
       layout, so that layout has to be as tall as the canvas or
       the statement gets cut off at the height of the two lines
       sitting behind it. */
    .ax[data-shell="onboarding"] .ax__canvas > .sim { min-height: 100%; }

    /* ── The dock: composer + atmosphere ──────────────────── */
    /* The composer is prominent without being the whole width of
       the workspace: capped and centred, it lands at roughly
       two-thirds on a wide simulator and simply fills a narrow one.
       This is on the DOCK rather than the composer so the notes
       and the queued-request line stay aligned with it.

       A PERCENTAGE cap, not a pixel one: the pattern page sizes
       its column to its content, so a pixel max-width here would
       quietly become the width of the whole simulator. */
    .ax__dock {
      position: relative; z-index: 1; padding: 8px 22px 22px;
      width: 100%; max-width: max(320px, 72%); margin: 0 auto;
      /* The composer's width is set by the workspace, not the
         viewport, so anything inside it that needs to respond to
         ITS width has to ask the dock rather than the window. */
      container-type: inline-size; container-name: dock;
    }

    /* ── Level 0 · the atmosphere ─────────────────────────────
       Three soft fields, blurred past the point of having an edge,
       drifting on three different long cycles so the loop never
       lines up and never reads as a loop. It is behind everything
       and it is never the brightest thing on screen.

       It is also not decoration: `data-phase` on .ax moves it, and
       the phase is the agent's actual state. Idle it sits low and
       wide under the composer; while the agent works it climbs into
       the canvas where the work is appearing; when the agent needs
       a decision it settles and dims so the decision is the
       brightest thing in the frame. */
    .ax__aura {
      position: absolute; left: -6%; right: -6%; bottom: -12%; height: 66%;
      pointer-events: none; z-index: 0;
      transition: height 1600ms var(--md-sys-motion-easing-emphasized),
                  bottom 1600ms var(--md-sys-motion-easing-emphasized);
    }
    .ax__aura i {
      position: absolute; display: block; border-radius: 50%;
      filter: blur(44px); will-change: transform, opacity;
      transition: opacity 1400ms var(--md-sys-motion-easing-standard),
                  transform 1600ms var(--md-sys-motion-easing-emphasized);
    }
    .ax__aura i:nth-child(1) {
      width: 52%; height: 104%; left: 2%; bottom: -24%; opacity: .46;
      background: radial-gradient(circle at 50% 50%,
        color-mix(in oklab, var(--md-sys-color-primary) 46%, transparent) 0%,
        transparent 68%);
      animation: ax-a 23s ease-in-out infinite alternate;
    }
    .ax__aura i:nth-child(2) {
      width: 58%; height: 96%; right: 0%; bottom: -30%; opacity: .40;
      background: radial-gradient(circle at 50% 50%,
        color-mix(in oklab, var(--md-sys-color-tertiary, #7d5260) 40%, transparent) 0%,
        transparent 70%);
      animation: ax-b 19s ease-in-out infinite alternate;
    }
    .ax__aura i:nth-child(3) {
      width: 44%; height: 80%; left: 28%; bottom: -16%; opacity: .30;
      background: radial-gradient(circle at 50% 50%,
        color-mix(in oklab, var(--md-sys-color-secondary, #625b71) 42%, transparent) 0%,
        transparent 66%);
      animation: ax-c 31s ease-in-out infinite alternate;
    }
    /* Drift, not travel: a few per cent in each direction, on three
       coprime-ish durations so the three never return to the same
       relative position within a sitting. */
    @keyframes ax-a {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(7%, -4%, 0) scale(1.07); }
      100% { transform: translate3d(-3%, 3%, 0) scale(.97); }
    }
    @keyframes ax-b {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(-6%, -6%, 0) scale(1.05); }
      100% { transform: translate3d(4%, 2%, 0) scale(.98); }
    }
    @keyframes ax-c {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(3%, -9%, 0) scale(1.1); }
      100% { transform: translate3d(-5%, 4%, 0) scale(1); }
    }

    /* Focus: the fields gather under the composer. */
    .ax[data-phase="focus"] .ax__aura i:nth-child(1) { opacity: .52; transform: translate3d(6%, -2%, 0) scale(1.04); }
    .ax[data-phase="focus"] .ax__aura i:nth-child(2) { opacity: .44; transform: translate3d(-5%, -2%, 0) scale(1.04); }
    .ax[data-phase="focus"] .ax__aura i:nth-child(3) { opacity: .34; }
    .ax[data-phase="focus"] .ax__aura { height: 58%; bottom: -14%; }

    /* Thinking: the same fields, breathing a little faster. */
    .ax[data-phase="thinking"] .ax__aura i { animation-duration: 13s, 13s; }
    .ax[data-phase="thinking"] .ax__aura i:nth-child(1) { animation-duration: 14s; opacity: .5; }
    .ax[data-phase="thinking"] .ax__aura i:nth-child(2) { animation-duration: 12s; opacity: .42; }
    .ax[data-phase="thinking"] .ax__aura i:nth-child(3) { animation-duration: 17s; opacity: .34; }

    /* Working: the atmosphere climbs into the canvas, where the
       work is actually appearing. */
    .ax[data-phase="working"] .ax__aura { height: 88%; bottom: -4%; }
    .ax[data-phase="working"] .ax__aura i:nth-child(1) { opacity: .34; }
    .ax[data-phase="working"] .ax__aura i:nth-child(2) { opacity: .30; }

    /* Blocked: everything settles and dims, because the brightest
       thing in the frame now has to be the decision. */
    .ax[data-phase="blocked"] .ax__aura i { animation-play-state: paused; opacity: .16; }

    /* Complete: relaxes back towards ambient, one step quieter. */
    .ax[data-phase="done"] .ax__aura i:nth-child(1) { opacity: .26; }
    .ax[data-phase="done"] .ax__aura i:nth-child(2) { opacity: .22; }
    .ax[data-phase="done"] .ax__aura i:nth-child(3) { opacity: .18; }

    /* ── The composer ─────────────────────────────────────── */
    .ax__composer {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 9px 10px 9px 12px; min-height: 56px;
      border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 80%, transparent);
      border-radius: 26px;
      background: color-mix(in srgb, var(--md-sys-color-surface-container-lowest) 88%, transparent);
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 2px rgba(16, 14, 24, .04), 0 10px 30px -22px rgba(16, 14, 24, .5);
      transition: border-radius 320ms cubic-bezier(.34, 1.56, .64, 1),
                  border-color 200ms var(--md-sys-motion-easing-standard),
                  box-shadow 260ms var(--md-sys-motion-easing-standard),
                  transform 320ms cubic-bezier(.34, 1.56, .64, 1);
    }
    /* Focus is a shape change, not a glow: the capsule squares up a
       step, which is the same "this is now a working surface" move
       the rest of the system uses. */
    .ax__composer:focus-within {
      border-radius: 20px;
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 1px 2px rgba(16, 14, 24, .04), 0 14px 34px -20px rgba(16, 14, 24, .55);
    }
    /* Submitted: it compresses slightly and hands attention upward. */
    .ax[data-phase="thinking"] .ax__composer,
    .ax[data-phase="working"] .ax__composer { transform: scale(.985); }
    .ax__composer[data-idle="false"] { opacity: .92; }

    .ax__cbtn {
      width: 34px; height: 34px; flex: 0 0 auto; padding: 0;
      display: grid; place-items: center; cursor: pointer;
      border: 0; border-radius: 50%;
      background: transparent; color: var(--md-sys-color-on-surface-variant);
      transition: background 160ms var(--md-sys-motion-easing-standard),
                  color 160ms var(--md-sys-motion-easing-standard),
                  transform 200ms cubic-bezier(.34, 1.56, .64, 1);
    }
    .ax__cbtn:hover:not(:disabled) {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }
    .ax__cbtn:active:not(:disabled) { transform: scale(.92); }
    .ax__cbtn:disabled { opacity: .4; cursor: default; }
    .ax__cbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor;
      stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .ax__cbtn--send {
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    }
    .ax__cbtn--send:hover:not(:disabled) {
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
      filter: brightness(1.08);
    }
    .ax__cbtn--send:disabled { background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant); }
    /* Provenance on a turn: which context the answer actually
       read. Quiet, because it is a footnote to the answer rather
       than a second answer. */
    .sim-src {
      margin: 6px 0 0; font-size: 11.5px; line-height: 1.4;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-src b { font-weight: 500; color: var(--md-sys-color-on-surface); }

    /* The sentence a remove control owes the person. Sits under
       the composer, where the standing caveat sits, because it is
       the same kind of statement: a fact about what this surface
       can and cannot do. */
    .ax__cnote--life { max-width: 62ch; }

    /* ── The composer, carrying context ────────────────────
       Attachments take their own row above the input, inside the
       same form. That placement is the claim: these files belong
       to this message, and the composer grows by exactly the room
       they need. */
    .ax__atts {
      flex: 1 0 100%; order: -1;
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 1px 2px 6px;
      /* A composer that grows without bound is a panel. Past about
         three rows the list scrolls instead, so attaching a tenth
         file cannot push the input off the screen. */
      max-height: 132px; overflow-y: auto; overscroll-behavior: contain;
    }
    .md-att {
      display: inline-flex; align-items: center; gap: 8px;
      max-width: 100%; min-width: 0; padding: 4px 4px 4px 7px;
      position: relative; overflow: hidden;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-lowest, #fff);
      /* Spring, because a file JOINING the message is a
         user-initiated arrival and should feel like one. */
      animation: att-in 320ms cubic-bezier(.34, 1.56, .64, 1) both;
    }
    @keyframes att-in {
      from { transform: scale(.9) translateY(4px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    .md-att__ico {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 24px; height: 24px; border-radius: 7px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-att__ico svg { width: 15px; height: 15px; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    /* Images get a real thumbnail because it identifies the file
       faster than its name. Documents deliberately do not: an
       invented page preview is a claim about unread content. */
    .md-att__thumb {
      flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px;
      background-size: cover; background-position: center;
      box-shadow: inset 0 0 0 1px rgba(16, 14, 24, .1);
    }
    .md-att__txt { min-width: 0; display: grid; gap: 1px; }
    /* The name may be truncated — a filename is recognisable from
       its head. The STATE may not: it is the sentence that decides
       what the person does next, so the meta line is given room
       for it and only the trailing detail is allowed to clip. */
    .md-att__name {
      font-size: 12px; line-height: 1.25; color: var(--md-sys-color-on-surface);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26ch;
    }
    .md-att__meta {
      font-size: 10.5px; line-height: 1.25; color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34ch;
    }
    .md-att__state { flex: 0 0 auto; }
    .md-att__state { color: var(--md-sys-color-on-surface-variant); }
    /* A separator that exists in the TEXT stream, not only in the
       gap — read aloud, "Ready" and "PDF" were arriving as one word. */
    .md-att__sep { }
    .md-att__btn {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%;
      cursor: pointer; background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      transition: background 160ms var(--md-sys-motion-easing-standard),
                  color 160ms var(--md-sys-motion-easing-standard);
    }
    .md-att__btn:hover {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }
    .md-att__btn:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    .md-att__btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
      stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* Material linear progress, hairline, along the bottom edge of
       the object it belongs to — so it reads as that file's
       progress and not as the composer's. */
    .md-att__bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
      background: var(--md-sys-color-surface-container-high);
    }
    .md-att__bar i {
      display: block; height: 100%; background: var(--md-sys-color-primary);
      transition: width 220ms var(--md-sys-motion-easing-standard);
    }
    /* No number to show, so it does not invent one. */
    .md-att__bar--wait {
      width: 38%; animation: att-wait 1.5s var(--md-sys-motion-easing-standard) infinite;
    }
    @keyframes att-wait {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    .md-att__live {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    /* State. Never colour alone — the word is already in the meta
       line above; this is the reinforcement, not the message. */
    .md-att[data-state="ready"] .md-att__state { color: var(--md-sys-color-primary); }
    .md-att[data-state="toobig"],
    .md-att[data-state="unsupported"],
    .md-att[data-state="failed"] {
      border-color: color-mix(in srgb, var(--md-sys-color-error) 55%, transparent);
      background: color-mix(in srgb, var(--md-sys-color-error-container) 26%, transparent);
    }
    .md-att[data-state="toobig"] .md-att__state,
    .md-att[data-state="unsupported"] .md-att__state,
    .md-att[data-state="failed"] .md-att__state { color: var(--md-sys-color-error); }
    .md-att[data-state="partial"] .md-att__state { color: var(--md-sys-color-on-surface); }
    .md-att[data-state="uploading"],
    .md-att[data-state="processing"],
    .md-att[data-state="queued"] { color: var(--md-sys-color-on-surface-variant); }

    @media (prefers-reduced-motion: reduce) {
      .md-att { animation: none; }
      .md-att__bar i { transition: none; }
      /* A travelling bar with nowhere to travel: it becomes a
         static half-filled track, and the word carries the state. */
      .md-att__bar--wait { animation: none; width: 50%; }
    }

    /* ── Connector ─────────────────────────────────────────
       One external service, in two places: a settings list, and
       inside a conversation where the agent has just found a wall.
       Same component either way — only the sentence above it
       changes, because the reason it is on screen changes. */
    .md-conn {
      display: grid; gap: 10px;
      padding: 14px; max-width: 420px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-lowest, #fff);
      animation: att-in 340ms cubic-bezier(.34, 1.56, .64, 1) both;
    }
    /* In a conversation it is an agent turn, so it sits in the
       agent's tonal surface rather than on a card of its own. */
    .md-conn--inline {
      background: color-mix(in srgb, var(--md-sys-color-primary) 5%, #fff);
      border-color: color-mix(in srgb, var(--md-sys-color-primary) 22%, transparent);
    }
    .md-conn__because {
      margin: 0; font-size: 13.5px; line-height: 1.55;
      color: var(--md-sys-color-on-surface);
    }
    .md-conn__head { display: flex; align-items: center; gap: 10px; }
    .md-conn__mark {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 34px; height: 34px; border-radius: 10px;
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-conn__id { min-width: 0; display: grid; gap: 1px; }
    .md-conn__name {
      font-size: 13.5px; font-weight: 600; color: var(--md-sys-color-on-surface);
    }
    .md-conn__meta {
      font-size: 11.5px; line-height: 1.35;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* A live connection gets a dot, but only ALONGSIDE the word —
       a green dot on its own is nothing to anyone who cannot see
       it, and ambiguous to everyone else. */
    .md-conn__dot {
      margin-left: auto; flex: 0 0 auto;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--md-sys-color-primary);
    }
    /* A separator that has to be SEEN, not only read: these sit in
       running inline text where no flex gap exists to stand in for
       them. The visually-hidden ax__sep is for the other case. */
    .md-conn__dash { opacity: .75; }
    .md-conn__blurb {
      margin: 0; font-size: 12.5px; line-height: 1.5;
      color: var(--app-ink-dim, #5f6368);
    }

    /* The scope list: what the agent will be able to do, in the
       PRODUCT's words, before any handoff. */
    .md-conn__scope {
      margin: 0; padding: 0; list-style: none; display: grid; gap: 6px;
      padding: 10px 12px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
    }
    .md-conn__s {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 12px; line-height: 1.45;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-conn__s b { font-weight: 600; color: var(--md-sys-color-on-surface); }
    .md-conn__sic { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 2px; }
    .md-conn__sic svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    /* Already granted versus still being asked for. A person
       re-reading a connection they set up months ago needs to see
       which is which. */
    .md-conn__s[data-has="true"] .md-conn__sic { color: var(--md-sys-color-primary); }
    .md-conn__s[data-has="false"] .md-conn__sic { opacity: .45; }

    .md-conn__wait {
      font-size: 12px; color: var(--md-sys-color-on-surface-variant);
    }
    .md-conn__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .md-conn__fine {
      flex: 1 1 100%; font-size: 11px; line-height: 1.45;
      color: var(--app-ink-dim, #5f6368);
    }

    /* State. The word is already in the meta line; this is
       reinforcement and nothing is carried by colour alone. */
    .md-conn[data-state="connected"] .md-conn__state,
    .md-conn[data-state="limited"] .md-conn__state { color: var(--md-sys-color-primary); }
    .md-conn[data-state="stale"] .md-conn__state,
    .md-conn[data-state="error"] .md-conn__state { color: var(--md-sys-color-error); }
    .md-conn[data-state="error"] { border-color:
      color-mix(in srgb, var(--md-sys-color-error) 45%, transparent); }
    .md-conn[data-state="blocked"] { opacity: .92; }
    .md-conn[data-state="blocked"] .md-conn__state {
      color: var(--md-sys-color-on-surface-variant); }

    @media (prefers-reduced-motion: reduce) { .md-conn { animation: none; } }

    /* A tool call, in the transcript. The protocol asks for
       "clear visual indicators when tools are invoked", and a
       call nobody can see afterwards is a call nobody can audit. */
    .sim-call {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
      padding: 7px 11px; margin-left: 34px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      border-left: 2px solid var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-container-low);
      font-size: 11.5px; color: var(--md-sys-color-on-surface-variant);
    }
    .sim-call code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px; color: var(--md-sys-color-on-surface);
    }
    .sim-call__k { font-weight: 600; color: var(--md-sys-color-primary); }
    .sim-call__a { opacity: .85; }
    .sim-call__r {
      margin-left: auto; padding-left: 10px;
      color: var(--md-sys-color-on-surface);
    }
    /* A refusal is part of the record too. */
    .sim-call.is-denied {
      border-left-color: var(--md-sys-color-error);
      background: color-mix(in srgb, var(--md-sys-color-error-container) 22%, transparent);
    }
    .sim-call.is-denied .sim-call__k { color: var(--md-sys-color-error); }

    /* ── MCP server ────────────────────────────────────────
       A connector card would do for the identity and the status.
       What it would NOT do is carry the four things that make an
       MCP server a different kind of object: a discovery step, a
       per-tool switch, an approval gate on destructive calls, and
       a sentence saying who wrote the descriptions. */
    .md-mcp {
      display: grid; gap: 12px; padding: 14px; max-width: 460px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-lowest, #fff);
      animation: att-in 340ms cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .md-mcp__head { display: flex; align-items: center; gap: 10px; }
    .md-mcp__mark {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 34px; height: 34px; border-radius: 10px;
      font-size: 9.5px; font-weight: 700; letter-spacing: .04em;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__id { min-width: 0; display: grid; gap: 1px; }
    .md-mcp__name { font-size: 13.5px; font-weight: 600;
      color: var(--md-sys-color-on-surface); }
    .md-mcp__meta {
      font-size: 11.5px; line-height: 1.35;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .md-mcp__dash { opacity: .75; }
    .md-mcp__dot { margin-left: auto; flex: 0 0 auto;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--md-sys-color-primary); }

    .md-mcp__field { display: grid; gap: 5px; }
    .md-mcp__flab { font-size: 11.5px; color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__input {
      width: 100%; padding: 9px 12px; font: inherit; font-size: 12.5px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
    }
    .md-mcp__input:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 1px;
    }

    /* Validation is three named steps rather than a spinner,
       because when it fails the person needs to know WHICH of the
       three failed — reaching it and understanding it are
       different problems with different fixes. */
    .md-mcp__steps {
      margin: 0; padding: 10px 12px; list-style: none; display: grid; gap: 7px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
      font-size: 12px; color: var(--md-sys-color-on-surface-variant);
      counter-reset: mcpstep;
    }
    .md-mcp__steps li { display: flex; align-items: center; gap: 8px; }
    .md-mcp__steps li::before {
      content: ''; flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;
      background: var(--md-sys-color-outline-variant);
    }
    .md-mcp__steps li[data-done="true"] { color: var(--md-sys-color-on-surface); }
    .md-mcp__steps li[data-done="true"]::before { background: var(--md-sys-color-primary); }

    .md-mcp__why {
      margin: 0; font-size: 12.5px; line-height: 1.5;
      color: var(--app-ink-dim, #5f6368);
    }

    /* The counts. Zero is shown rather than hidden: "0 resources"
       is information, an absent row is a question. */
    .md-mcp__counts { display: flex; flex-wrap: wrap; gap: 6px; }
    .md-mcp__count {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 11px 6px 8px;
      border-radius: var(--md-sys-shape-corner-full, 999px);
      background: var(--md-sys-color-surface-container-low);
      font-size: 11.5px; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__count b { font-size: 13px; font-weight: 600;
      color: var(--md-sys-color-on-surface); }
    .md-mcp__cico { width: 14px; height: 14px; opacity: .7; }
    .md-mcp__cico svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* The discovered surface, grouped so that reading down the
       list is reading UP a risk ladder. */
    .md-mcp__disc { display: grid; gap: 12px; }
    .md-mcp__band { display: grid; gap: 7px; }
    .md-mcp__bt {
      margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px;
      font-size: 11.5px; font-weight: 600; color: var(--md-sys-color-on-surface);
    }
    .md-mcp__bn { font-weight: 400; font-size: 11px;
      color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__tools { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    .md-mcp__tool {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 10px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
      transition: opacity 180ms var(--md-sys-motion-easing-standard);
    }
    /* Disabled reads as disabled, and the switch still says so. */
    .md-mcp__tool[data-on="false"] { opacity: .55; }
    .md-mcp__tt { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
    .md-mcp__tn { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .md-mcp__tn code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px; color: var(--md-sys-color-on-surface);
    }
    .md-mcp__td { font-size: 11.5px; line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant); }
    /* Destructive tools carry the gate as a LABEL, not as a
       colour: "asks every time" is a promise about behaviour and
       it has to survive being read aloud. */
    .md-mcp__gate {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 1px 7px 1px 5px; border-radius: 999px;
      font-size: 10px; letter-spacing: .01em;
      background: color-mix(in srgb, var(--md-sys-color-error-container) 60%, transparent);
      color: var(--md-sys-color-on-error-container);
    }
    .md-mcp__gate svg { width: 11px; height: 11px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .md-mcp__band[data-risk="destroy"] .md-mcp__tool {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 22%, transparent);
    }

    /* The sentence the protocol forces this component to carry. */
    .md-mcp__trust {
      margin: 0; display: flex; gap: 8px; align-items: flex-start;
      padding: 9px 11px; border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-high);
      font-size: 11px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__askico { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 1px; }
    .md-mcp__askico svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
      stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* The approval gate, at CALL time, showing the arguments. An
       approval that hides what is being sent approves nothing in
       particular. */
    .md-mcp__ask {
      display: grid; gap: 8px; padding: 12px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      border: 1px solid color-mix(in srgb, var(--md-sys-color-error) 42%, transparent);
      background: color-mix(in srgb, var(--md-sys-color-error-container) 26%, transparent);
    }
    .md-mcp__askt {
      margin: 0; display: flex; gap: 8px; align-items: flex-start;
      font-size: 12.5px; line-height: 1.45; color: var(--md-sys-color-on-surface);
    }
    .md-mcp__askt code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    }
    .md-mcp__askd { margin: 0; font-size: 11.5px; line-height: 1.45;
      color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__args {
      margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px;
      padding: 8px 10px; border-radius: 10px;
      background: var(--md-sys-color-surface-container-lowest, #fff);
      font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .md-mcp__args dt { color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__args dd { margin: 0; color: var(--md-sys-color-on-surface);
      word-break: break-word; }
    .md-mcp__askf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .md-mcp__askn { flex: 1 1 100%; font-size: 10.5px;
      color: var(--app-ink-dim, #5f6368); }

    .md-mcp__foot { display: flex; flex-wrap: wrap; gap: 8px; }
    .md-mcp[data-state="ready"] .md-mcp__state,
    .md-mcp[data-state="partial"] .md-mcp__state { color: var(--md-sys-color-primary); }
    .md-mcp[data-state="unreachable"] .md-mcp__state,
    .md-mcp[data-state="expired"] .md-mcp__state { color: var(--md-sys-color-error); }
    .md-mcp[data-state="unreachable"] { border-color:
      color-mix(in srgb, var(--md-sys-color-error) 45%, transparent); }
    .md-mcp[data-state="stale"] .md-mcp__state { color: var(--md-sys-color-on-surface); }
    .md-mcp[data-state="approval"] .md-mcp__state { color: var(--md-sys-color-error); }

    @media (prefers-reduced-motion: reduce) {
      .md-mcp { animation: none; }
      .md-mcp__tool { transition: none; }
    }

    /* ── Knowledge base ────────────────────────────────────
       Persistent curated sources. The visual argument against
       reading this as a folder of attachments is the CHECKBOX:
       it is the first thing in every row, it is not a delete, and
       it is the only control here that changes an answer. */
    .md-kb {
      display: grid; gap: 12px; padding: 14px; max-width: 460px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-lowest, #fff);
      animation: att-in 340ms cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .md-kb__head { display: flex; align-items: center; gap: 10px; }
    .md-kb__mark {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 34px; height: 34px; border-radius: 11px;
      font-size: 14px; font-weight: 600;
      /* Primary tone, unlike a connector's neutral mark: knowledge
         is the agent's own standing material rather than somebody
         else's system. */
      background: color-mix(in srgb, var(--md-sys-color-primary) 14%, transparent);
      color: var(--md-sys-color-primary);
    }
    .md-kb__id { min-width: 0; display: grid; gap: 1px; }
    .md-kb__name { font-size: 13.5px; font-weight: 600;
      color: var(--md-sys-color-on-surface); }
    .md-kb__meta {
      font-size: 11.5px; line-height: 1.35;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .md-kb__dash { opacity: .75; }
    .md-kb__empty, .md-kb__note {
      margin: 0; font-size: 11.5px; line-height: 1.5;
      color: var(--app-ink-dim, #5f6368);
    }

    .md-kb__srcs { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px;
      max-height: 232px; overflow-y: auto; overscroll-behavior: contain; }
    .md-kb__src {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 9px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
      transition: opacity 180ms var(--md-sys-motion-easing-standard);
    }
    /* Excluded, not deleted. It stays in the list at reduced
       emphasis, because the whole point is that the act is
       reversible and visibly so. */
    .md-kb__src[data-on="false"] { opacity: .5; }

    .md-kb__box {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 19px; height: 19px; padding: 0; cursor: pointer;
      border: 1.6px solid var(--md-sys-color-outline);
      border-radius: 6px; background: transparent; color: transparent;
      transition: background 160ms var(--md-sys-motion-easing-standard),
                  border-color 160ms var(--md-sys-motion-easing-standard);
    }
    .md-kb__box svg { width: 13px; height: 13px; fill: none; stroke: currentColor;
      stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .md-kb__box.is-on {
      background: var(--md-sys-color-primary);
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }
    .md-kb__box:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    /* A source that cannot be read has no checkbox to tick — the
       space is held so the rows still line up. */
    .md-kb__box--void { border-style: dashed; opacity: .4; cursor: default; }

    .md-kb__sico { flex: 0 0 auto; width: 16px; height: 16px;
      color: var(--md-sys-color-on-surface-variant); }
    .md-kb__sico svg { width: 16px; height: 16px; fill: none; stroke: currentColor;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .md-kb__st { flex: 1 1 auto; min-width: 0; display: grid; gap: 1px; }
    .md-kb__sn {
      font-size: 12px; line-height: 1.3; color: var(--md-sys-color-on-surface);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .md-kb__sm {
      font-size: 10.5px; line-height: 1.3; color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .md-kb__src[data-state="ready"] .md-kb__ss { color: var(--md-sys-color-primary); }
    .md-kb__src[data-state="stale"] .md-kb__ss { color: var(--md-sys-color-on-surface); }
    .md-kb__src[data-state="failed"] .md-kb__ss,
    .md-kb__src[data-state="denied"] .md-kb__ss { color: var(--md-sys-color-error); }
    .md-kb__src[data-state="failed"], .md-kb__src[data-state="denied"] {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 24%, transparent);
    }
    /* Still being read: a small determinate-free pulse, because
       there is no honest percentage for reading a document. */
    .md-kb__wait {
      flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;
      background: var(--md-sys-color-primary);
      animation: kb-pulse 1.4s ease-in-out infinite;
    }
    @keyframes kb-pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

    /* Row actions never wrap: a two-line "Read it again" pushes
       the row taller than its neighbours and the list stops
       scanning as a list. */
    .md-kb__src .md-button { flex: 0 0 auto; white-space: nowrap; }
    .md-kb__foot { display: flex; flex-wrap: wrap; gap: 8px; }

    /* Provenance, under an answer. Quiet, because it is a footnote
       to the answer rather than a second answer. */
    .md-kb__cite {
      display: grid; gap: 5px; margin-top: 8px;
      padding: 9px 11px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
    }
    .md-kb__ct { margin: 0; font-size: 11px; font-weight: 600;
      color: var(--md-sys-color-on-surface-variant); }
    .md-kb__clist { margin: 0; padding: 0; list-style: none;
      display: flex; flex-wrap: wrap; gap: 5px; }
    .md-kb__cbtn {
      padding: 3px 9px; border: 0; cursor: pointer; font: inherit; font-size: 11px;
      border-radius: var(--md-sys-shape-corner-full, 999px);
      background: color-mix(in srgb, var(--md-sys-color-primary) 11%, transparent);
      color: var(--md-sys-color-primary);
    }
    .md-kb__cbtn:hover { filter: brightness(.96); }
    .md-kb__cbtn:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    /* What it could NOT read. A citation list that omits this is
       telling you where the answer came from while hiding where
       it was not allowed to look. */
    .md-kb__cleft { margin: 0; font-size: 10.5px; line-height: 1.45;
      color: var(--app-ink-dim, #5f6368); }

    @media (prefers-reduced-motion: reduce) {
      .md-kb { animation: none; }
      .md-kb__src, .md-kb__box { transition: none; }
      .md-kb__wait { animation: none; opacity: .7; }
    }

    /* ── Model selection ───────────────────────────────────
       The composer's own mode chip, carrying two values: a
       capability tier and a reasoning depth, set separately.
       Same size, same shape, same slot — only the content is
       different, because there is no second control. */
    .ax__mode--model { gap: 4px; padding-right: 8px; font-size: 11.5px; }
    /* Two values is right when there is room for two values. Below
       that the effort drops off the chip and stays in the menu,
       rather than squeezing the field it shares a row with down to
       a clipped word. */
    @container dock (max-width: 430px) {
      .ax__mode__e { display: none; }
    }
    .ax__mode__ico { width: 13px; height: 13px; flex: 0 0 auto; opacity: .8; }
    .ax__mode__ico svg { width: 13px; height: 13px; fill: none; stroke: currentColor;
      stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .ax__mode__m { font-weight: 500; color: var(--md-sys-color-on-surface); }
    .ax__mode__e { opacity: .8; }
    .ax__mode__c { width: 13px; height: 13px; flex: 0 0 auto; opacity: .6; }
    .ax__mode__c svg { width: 13px; height: 13px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .ax__menu--model { min-width: 300px; max-width: 340px; padding: 8px; }
    .md-ml__h {
      margin: 6px 6px 4px; font-size: 10.5px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* An option, not a row of a spec sheet: what it is FOR, then
       one line of consequence. Context windows and parameter
       counts belong in developer documentation, where somebody is
       comparing on purpose rather than choosing mid-thought. */
    .md-ml__opt, .md-ml__row {
      display: flex; align-items: flex-start; gap: 8px; width: 100%;
      padding: 8px 9px; border: 0; cursor: pointer; text-align: left;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: transparent; font: inherit;
      color: var(--md-sys-color-on-surface);
      transition: background 140ms var(--md-sys-motion-easing-standard);
    }
    .md-ml__opt:hover, .md-ml__row:hover {
      background: var(--md-sys-color-surface-container-high);
    }
    .md-ml__opt:focus-visible, .md-ml__row:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px;
    }
    .md-ml__opt[aria-checked="true"], .md-ml__row[aria-checked="true"] {
      background: color-mix(in srgb, var(--md-sys-color-primary) 9%, transparent);
    }
    /* Disabled, not hidden, ONLY where the row still says
       something useful — a capped model has to be able to tell
       you what you get instead. Restriction by an organisation is
       absence, and has no row at all. */
    .md-ml__opt:disabled { cursor: default; opacity: .62; }
    .md-ml__opt:disabled:hover { background: transparent; }
    .md-ml__tick {
      flex: 0 0 auto; width: 15px; height: 15px; margin-top: 2px;
      color: var(--md-sys-color-primary);
    }
    .md-ml__tick svg { width: 15px; height: 15px; fill: none; stroke: currentColor;
      stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .md-ml__t { min-width: 0; display: grid; gap: 1px; }
    .md-ml__n {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      font-size: 12.5px; font-weight: 600;
    }
    .md-ml__f { font-size: 11.5px; line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant); }
    .md-ml__w { font-size: 11px; line-height: 1.4;
      color: var(--app-ink-dim, #5f6368); }
    .md-ml__tag {
      padding: 1px 7px; border-radius: 999px;
      font-size: 9.5px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
      background: color-mix(in srgb, var(--md-sys-color-primary) 13%, transparent);
      color: var(--md-sys-color-primary);
    }
    .md-ml__tag--auto {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .md-ml__tag--warn {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 65%, transparent);
      color: var(--md-sys-color-on-error-container);
    }
    .md-ml__row { font-size: 11.5px; line-height: 1.4; align-items: center; }
    .md-ml__row b { font-weight: 600; }
    .md-ml__dash { opacity: .7; }
    .md-ml__sub {
      margin-top: 4px; padding-top: 4px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .md-ml__note {
      margin: 6px 7px 2px; font-size: 10.5px; line-height: 1.45;
      color: var(--app-ink-dim, #5f6368);
    }
    /* The sentence exactly one shipping product answers. */
    .md-ml__note--when {
      margin-top: 8px; padding-top: 7px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }

    /* Attribution on a past answer. Ahead of current practice and
       marked as such in the documentation — but silent
       substitution is already shipping, which is what makes the
       absence worth designing against. */
    .md-ml__credit {
      display: inline-block; padding: 1px 8px; border-radius: 999px;
      font-size: 10.5px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-ml__credit.is-sub {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 45%, transparent);
      color: var(--md-sys-color-on-error-container);
    }

    /* A single answer, shown in the preview so attribution has
       something to be attached to. */
    .pv-mlturn { display: grid; gap: 5px; justify-items: start;
      width: 100%; max-width: 460px; margin: 0 auto 18px; }
    .pv-mlq { margin: 0; font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); }
    .pv-mla { margin: 0; font-size: 13.5px; line-height: 1.5;
      color: var(--md-sys-color-on-surface); }

    /* ── Standing context ──────────────────────────────────
       What the agent can reach for the whole conversation, as
       opposed to the attachments row above the input. The visual
       difference is deliberate and load-bearing: attachments are
       OUTLINED CARDS carrying a cross, standing context is a
       TONAL CHIP carrying a chevron. One is a thing you took out
       of your machine; the other is a door you left open. */
    .ax__scopes {
      flex: 1 0 100%; order: -2;
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 1px 2px 6px;
    }
    .md-scope {
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 100%; min-width: 0; padding: 4px 8px 4px 5px;
      border: 0; border-radius: var(--md-sys-shape-corner-full, 999px);
      cursor: pointer; font: inherit; font-size: 11.5px; line-height: 1.3;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      transition: filter 160ms var(--md-sys-motion-easing-standard),
                  transform 220ms cubic-bezier(.34, 1.56, .64, 1);
      animation: att-in 320ms cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .md-scope:hover { filter: brightness(.97); }
    .md-scope:active { transform: scale(.97); }
    .md-scope:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    .md-scope__mark {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 19px; height: 19px; border-radius: 6px;
      font-size: 9px; font-weight: 600; letter-spacing: .01em;
      text-transform: uppercase;
      background: var(--md-sys-color-surface-container-lowest, #fff);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-scope__t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .md-scope__d { opacity: .82; white-space: nowrap; }
    .md-scope__chev {
      width: 13px; height: 13px; flex: 0 0 auto; opacity: .6;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    /* A door that has swung shut. Never colour alone — the detail
       line carries the word, and the chip only reinforces it. */
    .md-scope[data-state="stale"] {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-scope[data-state="error"] {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 70%, transparent);
      color: var(--md-sys-color-on-error-container);
    }
    /* Knowledge reads as the agent's own standing material, so it
       takes the primary tone rather than the secondary one. */
    .md-scope[data-kind="knowledge"] {
      background: color-mix(in srgb, var(--md-sys-color-primary) 13%, transparent);
      color: var(--md-sys-color-primary);
    }
    @media (prefers-reduced-motion: reduce) {
      .md-scope { animation: none; transition: none; }
      .md-scope:active { transform: none; }
    }

    /* ── The composer, in voice mode ───────────────────────
       The SAME element. Same width, same place, same radius
       system, same 34px controls. What changes is the middle:
       the text field gives way to a small activity indicator and
       one line of status, and the container grows by about a line
       of text. It is a mode, not a second component, and the
       measure of that is how little moves. */
    .ax__composer[data-mode="voice"] {
      /* Roughly 15% taller. Enough to hold a status line and a
         line of transcript; not enough to read as a new surface. */
      min-height: 64px;
      /* Text mode wraps because chips accumulate on it. Voice mode
         has a fixed set of parts and must never become two rows —
         a control that drops to a second line has changed the
         height of the bar by more than the mode change did. */
      flex-wrap: nowrap;
      /* Material shape, one step more expressive while the
         microphone is open, and back again afterwards. */
      border-radius: 22px;
      border-color: color-mix(in srgb, var(--md-sys-color-primary) 55%, transparent);
    }
    .ax__composer[data-mode="voice"][data-voice="error"] {
      border-color: color-mix(in srgb, var(--md-sys-color-error) 55%, transparent);
    }
    .ax__composer[data-mode="voice"][data-voice="muted"] {
      border-color: color-mix(in srgb, var(--md-sys-color-outline-variant) 90%, transparent);
    }
    /* The microphone, on. A filled-tonal icon button — the same
       Material treatment the mode chip uses when it is pressed,
       so "this control is active" looks the same everywhere. */
    .ax__cbtn--mic.is-on {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .ax__voice {
      flex: 1 1 0; min-width: 0;
      display: flex; align-items: center; gap: 12px;
      padding-left: 2px;
    }
    .ax__vtext { min-width: 0; display: grid; gap: 1px; }
    .ax__vstatus {
      font-size: 13px; line-height: 1.35;
      color: var(--md-sys-color-on-surface);
    }
    /* One line, clipped. A spoken sentence does not need a panel
       of its own to prove it was heard, and a transcript that
       grows the composer as you speak is a composer that moves
       under your hand. */
    .ax__vline {
      font-size: 12px; line-height: 1.35;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ax__composer[data-voice="error"] .ax__vstatus { color: var(--md-sys-color-error); }

    @media (max-width: 560px) {
      /* The bar takes the width it is given; the indicator does
         not grow to fill it. */
      .ax__voice { gap: 9px; }
      .ax__vline { font-size: 11.5px; }
    }

    /* A SMALL flex-basis, deliberately. Flexbox decides where to
       wrap from the hypothetical size, not the shrunk one, so a
       180px basis here pushed the send button onto a second row
       the moment the dock got narrower than the controls plus that
       number — the field itself would have shrunk quite happily.
       min-width:0 lets it take whatever is actually left. */
    .ax__field {
      flex: 1 1 60px; min-width: 0; border: 0; outline: none; background: transparent;
      font: inherit; font-size: 14.5px; color: var(--md-sys-color-on-surface);
    }
    .ax__field::placeholder { color: var(--md-sys-color-on-surface-variant); }
