  <style>
    /* ════════════════════════════════════════════════════════════
       MATERIAL 3.0 — COMPONENT PAGE

       Two layers live here and they are deliberately separated:

         .mp-*  page chrome (header, example frames, code toggle)
         .m3-*  the components themselves

       Only the .m3-* layer is what a reader is copying. It is
       written against the expressive tokens below rather than
       inline styles, so the snippet in the code panel stays
       readable instead of being a wall of style="".

       Page-scoped rather than in styles.css for the same reason as
       the overview page: styles.css is shared with the ShadCN set,
       and the whole premise is that the two sets look different.
       ════════════════════════════════════════════════════════════ */
    /* What is left of the expressive palette on this page: it now
       feeds only .mp-tab, the library's own Preview/Code toggle. No
       component uses it — those are all on --md-sys-* tokens. */
    .detail {
      --mx-p-20: oklch(0.34 0.14 293);
      --mx-p-40: oklch(0.50 0.20 293);
      --mx-p-60: oklch(0.62 0.23 293);
      --mx-p-90: oklch(0.90 0.05 293);
      --mx-p-95: oklch(0.96 0.02 293);
      --mx-s-20: oklch(0.36 0.14 15);
      --mx-s-40: oklch(0.48 0.19 15);
      --mx-s-60: oklch(0.62 0.21 15);
      --mx-s-95: oklch(0.96 0.02 15);
      --mx-t-20: oklch(0.38 0.09 66);
      --mx-t-60: oklch(0.66 0.15 66);
      --mx-t-90: oklch(0.90 0.06 66);
      --mx-t-95: oklch(0.96 0.03 66);

      --mx-capsule: 9999px;
      --mx-lg: 28px;
      --mx-md: 18px;
      --mx-dur: 380ms;
    }

    /* ── Example frame ────────────────────────────────────── */
    .mp-ex { margin-top: 26px; }

    /* The frame is now just a wrapper: the panel is the stage
       itself, so the code pane can carry its own dark ground
       without a second border around both. */
    .mp-frame { position: relative; }

    /* The fallback specimen stage, for a pattern with no playground
       of its own. Same ground and same borderless treatment as
       .pv-frame above, so the two never appear side by side looking
       like different kinds of surface. */
    .mp-stage {
      background: var(--ink-50, #f5f5f3);
      border: 0;
      border-radius: var(--md-sys-shape-corner-large);
      padding: 56px 40px;
      display: grid; place-items: center;
      min-height: 280px;
    }
    /* `display: grid` outranks the UA sheet's [hidden] { display: none },
       so toggling to Code left the preview mounted underneath it. Same
       trap as the composer's mic and send buttons — restate it at
       author level. */
    .mp-stage[hidden] { display: none; }

    /* ── Preview / Code — M3 segmented button ─────────────────
       Container on surface-container-high, the selected segment on
       surface-container-lowest lifted by elevation-1. That inversion
       is how M3 marks selection on a segmented button: the chosen
       segment comes forward, the rest stay flat. */
    .mp-seg {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 3px; margin-bottom: 12px;
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-surface-container-high);
    }
    .mp-seg__btn {
      position: relative;
      display: inline-flex; align-items: center; gap: 7px;
      height: 34px; padding: 0 16px;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      font-family: var(--md-ref-typeface-plain);
      font-size: var(--md-sys-typescale-label-large-size);
      line-height: var(--md-sys-typescale-label-large-line);
      font-weight: var(--md-sys-typescale-label-large-weight);
      letter-spacing: var(--md-sys-typescale-label-large-tracking);
      cursor: pointer;
      transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                  color var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .mp-seg__btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .mp-seg__btn:hover { color: var(--md-sys-color-on-surface); }
    .mp-seg__btn[aria-selected="true"] {
      background: var(--md-sys-color-surface-container-lowest);
      color: var(--md-sys-color-on-surface);
      box-shadow: var(--md-sys-elevation-1);
    }
    .mp-seg__btn:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }

    .mp-code {
      position: relative;
      margin: 0; padding: 20px 22px;
      border-radius: var(--md-sys-shape-corner-large);
      overflow-x: auto;
      background: #17161c;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px; line-height: 1.7;
      color: #d7d5e4;
      white-space: pre;
      tab-size: 2;
    }
    .mp-code .t { color: #a78bfa; }   /* tag        */
    .mp-code .a { color: #7dd3c8; }   /* attribute  */
    .mp-code .v { color: #fbbf77; }   /* value      */
    .mp-code .c { color: #6b6880; }   /* comment    */
    .mp-copy {
      position: absolute; top: 12px; right: 12px;
      padding: 5px 11px; border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
      font-family: var(--md-ref-typeface-plain);
      font-size: var(--md-sys-typescale-label-medium-size);
      color: #d7d5e4; cursor: pointer;
    }
    .mp-copy:hover { background: rgba(255,255,255,0.13); }

    /* ── Installation ─────────────────────────────────────────
       Tabs are underlined rather than filled: they select which of
       four equivalent commands you are reading, and a filled pill
       here would read as the page's primary action. */
    .mp-inst {
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-lowest);
      overflow: hidden;
    }
    .mp-inst__bar {
      display: flex; align-items: stretch; gap: 4px;
      padding: 0 12px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: color-mix(in srgb, var(--md-sys-color-surface-container) 45%, transparent);
    }
    .mp-inst__tab {
      position: relative;
      padding: 12px 10px 11px;
      border: 0; background: transparent; cursor: pointer;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .mp-inst__tab:hover { color: var(--md-sys-color-on-surface); }
    .mp-inst__tab[aria-selected="true"] {
      color: var(--md-sys-color-on-surface); font-weight: 600;
    }
    .mp-inst__tab[aria-selected="true"]::after {
      content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px;
      height: 2px; background: var(--md-sys-color-on-surface);
      border-radius: 2px 2px 0 0;
    }
    .mp-inst__copy {
      margin-left: auto; align-self: center;
      width: 32px; height: 32px; display: grid; place-items: center;
      border: 0; border-radius: var(--md-sys-shape-corner-small);
      background: transparent; color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
    }
    .mp-inst__copy svg { width: 17px; height: 17px; }
    .mp-inst__copy:hover { background: var(--md-sys-color-surface-container-high);
                           color: var(--md-sys-color-on-surface); }
    .mp-inst__copy.is-done { color: var(--md-sys-color-primary); }
    .mp-inst__cmd {
      margin: 0; padding: 18px 22px; overflow-x: auto;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13.5px; line-height: 1.6; white-space: pre;
    }
    .mp-inst__cmd .c-run { color: #2563eb; }
    .mp-inst__cmd .c-arg { color: #15803d; }

    /* ── Usage ────────────────────────────────────────────────
       The line numbers are their own column, not text inside the
       <pre>: numbers inside the code get selected and copied along
       with it, which makes the snippet unusable on paste. */
    .mp-usage {
      position: relative;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-lowest);
      overflow: hidden;
    }
    /* A copy control, not a language badge. The badge named a fact the
       reader could already see and did nothing; this is the one thing
       anyone actually wants from a usage block. M3 icon button — 32dp,
       corner-full, on-surface-variant, with a real state layer. */
    .mp-usage__copy {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; padding: 0;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: transparent; color: var(--md-sys-color-on-surface-variant);
      display: grid; place-items: center; cursor: pointer;
      transition: background-color var(--md-sys-motion-duration-short4)
                  var(--md-sys-motion-easing-standard);
    }
    .mp-usage__copy svg {
      grid-area: 1 / 1;
      width: 16px; height: 16px;
      fill: none; stroke: currentColor; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .mp-usage__copy:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface)
        calc(var(--md-sys-state-hover-opacity) * 100%), transparent);
    }
    /* Confirmation swaps the glyph for a tick in CSS rather than by
       rewriting the button — the control keeps its accessible name and
       there is no innerHTML to lose. */
    .mp-usage__copy .mp-usage__tick { display: none; }
    .mp-usage__copy.is-done { color: var(--md-sys-color-primary); }
    .mp-usage__copy.is-done .mp-usage__tick { display: block; }
    .mp-usage__copy.is-done .mp-usage__pages { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .mp-usage__copy { transition: none; }
    }
    .mp-usage__body { display: flex; }
    .mp-usage__nums {
      flex: 0 0 auto;
      display: flex; flex-direction: column;
      padding: 20px 0 20px 18px;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; line-height: 24px;
      color: var(--md-sys-color-outline);
      text-align: right; user-select: none;
      min-width: 34px;
    }
    .mp-usage__code {
      flex: 1 1 auto; min-width: 0;
      margin: 0; padding: 20px 22px 20px 16px;
      overflow-x: auto;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; line-height: 24px;
      color: var(--md-sys-color-on-surface);
      white-space: pre;
    }
    .mp-usage__code .t { color: #15803d; }
    .mp-usage__code .a { color: #1d4ed8; }
    .mp-usage__code .v { color: #b91c1c; }
    .mp-usage__code .c { color: var(--md-sys-color-outline); }

    /* ── Foot: composed of / related ──────────────────────── */
    /* The breadcrumb, hero, section blocks, chips, related cards and
       prev/next are NOT restyled here: they use .bread / .detail__hero /
       .section-block / .composed / .related / .detail__nav straight out of
       styles.css, the same rules the ShadCN detail page uses. Only the
       preview frame below is this page's own. */

    /* ════════════════════════════════════════════════════════════
       .m3-*  — THE COMPONENTS
       This is the layer the code panel shows. Everything below is
       real CSS a reader can lift, not preview scaffolding.
       ════════════════════════════════════════════════════════════ */
    /* The bespoke disclosure classes (.m3-msg, .m3-panel, .m3-strip,
       .m3-avatar, .m3-badge, .m3-facts) were removed when Disclosure
       moved onto Material components: they were Nucleux-toned shapes
       with no counterpart in the kit. Consent and Caveat still use the
       .m3-* rules below and are next to move. */

    .m3-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 40px; padding: 0 20px;
      border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid transparent;
      font: inherit; font-size: 13.5px; font-weight: 620;
      cursor: pointer;
      transition: transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                  background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .m3-btn:active { transform: scale(0.97); }
    .m3-btn--primary { background: var(--md-sys-color-primary); color: #fff; }
    .m3-btn--primary:hover { background: var(--md-sys-color-on-primary-container); }
    /* The "a human must press this" control. It used a Nucleux rose,
       which read as pink beside Material components; on this page it
       takes M3 primary and earns its weight from size and position
       instead of from a colour outside the scheme. */
    .m3-btn--human {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }
    .m3-btn--human:hover { background: var(--md-sys-color-on-primary-container); }
    .m3-btn--quiet { background: var(--ink-50); color: var(--fg-alt); }
    .m3-btn--ghost {
      background: transparent; color: var(--fg-alt); border-color: var(--border);
    }
    .m3-btn--ghost:hover { border-color: var(--fg-muted); color: var(--fg); }
    .m3-btn--sm { height: 34px; padding: 0 16px; font-size: 12.5px; }
    .m3-btn--tiny {
      height: 28px; padding: 0 12px; font-size: 11.5px;
      background: transparent; color: var(--fg-alt); border-color: var(--border);
    }
    .m3-btn--tiny:hover { color: var(--fg); border-color: var(--fg-muted); }


    /* ════════════════════════════════════════════════════════════
       APP CHROME — the "In context" scenes

       A component shown alone on a swatch tells you what it looks
       like. It does not tell you whether you would notice it. These
       scenes put the same component inside a plausible product —
       a rail, a header, a thread, real neighbouring content — so
       the question the page answers is "would this be seen", not
       "is this pretty".

       The chrome is deliberately generic and mid-grey: it is set
       dressing, and if it competes with the component it is wrong.
       ════════════════════════════════════════════════════════════ */
    .app {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-lowest);
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr);
      min-height: 360px;
      font-family: var(--md-ref-typeface-plain);
    }
    .app--wide { grid-template-columns: 1fr; }

    /* ── Rail ─────────────────────────────────────────────── */
    .app__rail {
      background: var(--app-rail, #f6f6f7);
      border-right: 1px solid var(--md-sys-color-outline-variant);
      padding: 14px 12px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .app__brand {
      display: flex; align-items: center; gap: 9px;
      padding: 4px 8px 14px;
      font-size: 13px; font-weight: 600; color: var(--app-ink, #202124);
    }
    .app__brand-mark {
      width: 20px; height: 20px; border-radius: 6px;
      background: var(--md-sys-color-primary);
    }
    .app__nav {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 9px; border-radius: 7px;
      font-size: 12.5px; color: var(--app-ink-dim, #5f6368);
    }
    .app__nav.is-current {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-weight: 500;
    }
    .app__nav-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; opacity: 0.5; flex: 0 0 auto;
    }
    .app__rail-foot { margin-top: auto; }

    /* ── Body ─────────────────────────────────────────────── */
    .app__body { display: flex; flex-direction: column; min-width: 0; }
    .app__bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-lowest);
    }
    .app__title { font-size: 13.5px; font-weight: 600; color: var(--app-ink, #202124); }
    .app__bar-spacer { margin-left: auto; }
    .app__pill {
      height: 26px; padding: 0 12px; border-radius: 999px;
      display: inline-flex; align-items: center;
      background: var(--app-rail, #f6f6f7);
      color: var(--app-ink-dim, #5f6368);
      font-size: 11.5px;
    }
    .app__canvas {
      flex: 1 1 auto; padding: 20px 18px;
      display: flex; flex-direction: column; gap: 16px;
      background: var(--md-sys-color-surface-container-lowest);
    }
    /* A human turn, so the reader can see the generated one against
       something that is NOT generated — which is the entire point of
       disclosure and cannot be judged from a lone specimen. */
    .app__human {
      display: flex; gap: 12px; align-items: flex-start;
      max-width: 560px;
    }
    .app__human-av {
      flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center;
      background: #dfe1e5; color: #3c4043;
      font-size: 15px; font-weight: 500;
    }
    .app__human-name { font-size: 16px; color: var(--app-ink, #202124); }
    .app__human-text {
      margin: 4px 0 0; font-size: 14px; line-height: 20px; color: #444746;
    }
    .app__hint {
      margin: 0; font-size: 11.5px; color: var(--app-ink-dim, #5f6368);
      display: flex; align-items: center; gap: 7px;
    }
    .app__hint::before {
      content: ""; width: 14px; height: 1px; background: currentColor; opacity: 0.5;
    }
    .app__composer {
      margin-top: auto;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 999px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--app-rail, #f6f6f7);
      color: var(--app-ink-dim, #5f6368);
      font-size: 13px;
    }
    .app__composer-send {
      margin-left: auto; width: 30px; height: 30px; border-radius: 50%;
      background: var(--md-sys-color-primary);
      display: grid; place-items: center;
    }
    .app__composer-send svg { width: 15px; height: 15px; fill: var(--md-sys-color-on-primary); }

    /* ════════════════════════════════════════════════════════════
       LIVE SCENE — the controls and the states

       The control bar sits OUTSIDE the product frame because it is
       the reader's, not the product's; confusing the two would make
       the scene lie about what ships. Everything inside the frame is
       the component's own markup and its own states.
       ════════════════════════════════════════════════════════════ */
    .sc-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 12px;
    }

    /* A reader-facing switch, deliberately NOT the M3 switch used
       inside the scenes: the product's controls and the page's
       controls must not be mistakable for each other. */
    .sc-switch {
      display: inline-flex; align-items: center; gap: 9px;
      height: 32px; padding: 0 12px 0 8px;
      border: 1px solid var(--border); border-radius: 999px;
      background: transparent; cursor: pointer;
      font-family: inherit; font-size: 12.5px; color: var(--fg-alt);
    }
    .sc-switch:hover { border-color: var(--fg-muted); color: var(--fg); }
    .sc-switch__track {
      width: 30px; height: 18px; border-radius: 999px; padding: 2px;
      background: var(--ink-100, #e6e6e2); display: flex; align-items: center;
      transition: background var(--md-sys-motion-duration-short4)
                  var(--md-sys-motion-easing-standard);
    }
    .sc-switch__knob {
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.28);
      transition: transform var(--md-sys-motion-duration-medium2)
                  var(--md-sys-motion-easing-emphasized);
    }
    .sc-switch.is-on .sc-switch__track { background: var(--md-sys-color-primary); }
    .sc-switch.is-on .sc-switch__knob { transform: translateX(12px); }

    .sc-seg {
      display: inline-flex; padding: 3px; gap: 2px;
      border: 1px solid var(--border); border-radius: 999px;
    }
    .sc-seg__btn {
      height: 26px; padding: 0 14px; border: 0; border-radius: 999px;
      background: transparent; cursor: pointer;
      font-family: inherit; font-size: 12.5px; color: var(--fg-muted);
    }
    .sc-seg__btn[aria-selected="true"] {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container); font-weight: 550;
    }

    /* ── Inside the frame ─────────────────────────────────── */
    .sc-turn { display: flex; gap: 12px; align-items: flex-start; max-width: 620px; }
    .sc-turn__body { min-width: 0; flex: 1 1 auto; }
    .sc-turn__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sc-turn__name { font-size: 15px; color: var(--app-ink, #202124); }
    .sc-turn__time { font-size: 11.5px; color: var(--app-ink-dim, #5f6368); margin-left: auto; }
    .sc-text {
      margin: 6px 0 0; font-size: 14px; line-height: 21px; color: #444746;
      max-width: 56ch;
    }
    .sc-text b { color: var(--app-ink, #202124); font-weight: 600; }
    .sc-muted { color: var(--app-ink-dim, #9aa0a6); }

    /* The caret is the only thing that says text is still arriving;
       it is removed the instant the stream ends rather than left
       blinking on finished content. */
    .sc-caret {
      display: inline-block; width: 2px; height: 15px; margin-left: 2px;
      vertical-align: -2px; background: var(--md-sys-color-primary);
      animation: sc-blink 900ms steps(2, start) infinite;
    }
    @keyframes sc-blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

    .sc-working { display: flex; align-items: center; gap: 7px; margin-top: 10px; }
    .sc-working__t { font-size: 12.5px; color: var(--app-ink-dim, #5f6368); }
    .sc-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--md-sys-color-primary); opacity: 0.5;
      animation: sc-pulse 1200ms var(--md-sys-motion-easing-standard) infinite;
    }
    .sc-dot:nth-child(2) { animation-delay: 160ms; }
    .sc-dot:nth-child(3) { animation-delay: 320ms; }
    @keyframes sc-pulse {
      0%, 100% { opacity: 0.35; transform: translateY(0); }
      50%      { opacity: 1;    transform: translateY(-2px); }
    }

    .sc-consent {
      margin-top: 12px; max-width: 470px; padding: 16px 18px 14px;
      border-radius: var(--md-sys-shape-corner-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-lowest);
    }
    .sc-consent__t { margin: 0; font-size: 14px; font-weight: 620; color: var(--app-ink, #202124); }
    .sc-consent .m3-scopes { margin-top: 8px; }
    .sc-consent__foot { display: flex; gap: 8px; flex-wrap: wrap; }

    .sc-handoff {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container);
      font-size: 12.5px; color: var(--app-ink-dim, #5f6368);
    }
    .sc-handoff b { color: var(--app-ink, #202124); }

    .sc-sizes { display: flex; align-items: center; gap: 20px; margin-top: 4px; }
    .sc-size { display: grid; justify-items: center; gap: 6px; }
    .sc-size__l { font-size: 11px; color: var(--app-ink-dim, #5f6368); }

    .sc-log { display: grid; gap: 4px; }
    .sc-log__row {
      display: flex; gap: 12px; align-items: center;
      padding: 10px 12px; border-radius: var(--md-sys-shape-corner-medium);
    }
    .sc-log__row:nth-child(odd) { background: var(--md-sys-color-surface-container-low); }
    .sc-log__what { margin: 0; font-size: 13.5px; color: var(--app-ink, #202124); }
    .sc-log__who { margin: 2px 0 0; font-size: 11.5px; color: var(--app-ink-dim, #5f6368); }

    .sc-notif {
      max-width: 420px; padding: 14px 16px;
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: var(--md-sys-elevation-2);
    }
    .sc-notif__head { display: flex; align-items: center; gap: 10px; }
    .sc-notif__n { margin: 0; font-size: 13.5px; font-weight: 620; color: var(--app-ink, #202124); }
    .sc-notif__r { margin: 1px 0 0; font-size: 11.5px; color: var(--app-ink-dim, #5f6368); }

    .sc-toolbar {
      position: relative;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .sc-icon {
      width: 32px; height: 32px; border: 0; border-radius: 50%;
      background: transparent; color: var(--app-ink-dim, #5f6368);
      display: grid; place-items: center; cursor: pointer;
    }
    .sc-icon svg { width: 18px; height: 18px; }
    .sc-icon:hover { background: rgba(0,0,0,0.06); }
    .sc-menu { position: absolute; top: 40px; left: 0; z-index: 5; }
    .sc-menu .md-menu__item {
      width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left;
    }
    .sc-menu .md-menu__item:hover { background: rgba(0,0,0,0.05); }
    .sc-field { margin-top: 14px; max-width: 520px; }

    /* The audit outlines every reserved glyph on screen at once. It
       is a reviewer's tool, not a product state — which is exactly
       why it belongs in the page's controls and not the app's. */
    .sc-audit .sc-glyph,
    .sc-audit .md-menu__item--ai svg,
    .sc-audit .md-assist-chip__icon,
    .sc-audit .md-agentav svg {
      outline: 2px solid var(--md-sys-color-error);
      outline-offset: 3px; border-radius: 2px;
    }

    .sc-doc {
      border-radius: var(--md-sys-shape-corner-large);
      border: 2px solid transparent;
      padding: 16px 18px;
      background: var(--md-sys-color-surface-container-lowest);
      transition: border-color var(--md-sys-motion-duration-medium2)
                  var(--md-sys-motion-easing-emphasized);
    }
    .sc-doc.is-live { border-color: var(--md-sys-color-primary); }
    .sc-doc__head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .sc-doc__label {
      font-size: 12.5px; font-weight: 600; color: var(--md-sys-color-primary);
    }
    .sc-doc__stop { margin-left: auto; display: flex; gap: 6px; align-items: center; }
    .sc-doc__p { margin: 0; font-size: 17px; font-weight: 640; color: var(--app-ink, #202124); }
    .sc-doc__body { margin: 6px 0 0; font-size: 13px; color: var(--app-ink-dim, #5f6368); }
    .sc-bubble__tag { display: block; margin-top: 10px; }

    /* Greyscale is the accessibility proof, so it has to cover the
       WHOLE frame — a filter on the component alone would leave the
       surrounding colour doing work the reader could not see. */
    .sc-grey { filter: grayscale(1); }

    @media (prefers-reduced-motion: reduce) {
      .sc-caret, .sc-dot { animation: none; }
      .sc-switch__track, .sc-switch__knob, .sc-doc { transition: none; }
    }

    /* ── Consent scenes ───────────────────────────────────── */
    .sc-consent__k {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .sc-consent__k + .sc-consent__t { margin-top: 10px; }
    .sc-consent__sub {
      margin: 5px 0 0; font-size: 12.5px; line-height: 1.5;
      color: var(--app-ink-dim, #5f6368);
    }

    /* The just-in-time ask: a smaller shape than the first dialog on
       purpose. A second full-size dialog for one permission reads as
       the same request repeated, which is how people learn to click
       Allow without reading it. */
    .sc-jit {
      margin-top: 12px; max-width: 460px; padding: 15px 17px 13px;
      border-radius: 6px var(--md-sys-shape-corner-large) var(--md-sys-shape-corner-large)
                     var(--md-sys-shape-corner-large);
      background: color-mix(in oklab, var(--md-sys-color-secondary-container) 60%, #fff);
      border: 1px solid color-mix(in oklab, var(--md-sys-color-primary) 20%, transparent);
    }
    .sc-jit__row { display: flex; gap: 10px; align-items: flex-start; }
    .sc-jit__dot {
      flex: 0 0 auto; margin-top: 6px; width: 8px; height: 8px; border-radius: 50%;
      background: var(--md-sys-color-primary);
    }
    .sc-jit__text { margin: 0; font-size: 13.5px; line-height: 1.55; color: #444746; }
    .sc-jit__text b { color: var(--app-ink, #202124); font-weight: 620; }
    .sc-jit__foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 13px; }

    /* ── The standing permissions surface ─────────────────── */
    .sc-perms { max-width: 620px; }
    .sc-perms__head {
      display: flex; align-items: flex-start; gap: 16px;
      padding-bottom: 12px; border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .sc-perms__t { margin: 0; font-size: 15px; font-weight: 640; color: var(--app-ink, #202124); }
    .sc-perms__s { margin: 3px 0 0; font-size: 12px; color: var(--app-ink-dim, #5f6368); }
    .sc-perms__head .md-button { margin-left: auto; flex: 0 0 auto; }

    .sc-srcs { list-style: none; margin: 0; padding: 0; }
    .sc-src {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .sc-src:last-child { border-bottom: 0; }
    .sc-src__mark {
      flex: 0 0 auto; width: 34px; height: 34px;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-primary-container);
      transition: background var(--md-sys-motion-duration-medium2)
                  var(--md-sys-motion-easing-standard);
    }
    /* Off is a real, visible state, not just an unticked switch: the
       row loses its colour and says what it can no longer see. */
    .sc-src.is-off .sc-src__mark { background: var(--md-sys-color-surface-container-high); }
    .sc-src.is-off .sc-src__n,
    .sc-src.is-off .sc-src__d { color: var(--app-ink-dim, #9aa0a6); }
    .sc-src__text { min-width: 0; flex: 1 1 auto; }
    .sc-src__n { margin: 0; font-size: 13.5px; font-weight: 620; color: var(--app-ink, #202124); }
    .sc-src__d { margin: 2px 0 0; font-size: 12.5px; color: #444746; }
    .sc-src__u { margin: 4px 0 0; font-size: 11.5px; color: var(--app-ink-dim, #5f6368); }

    .sc-note {
      margin: 14px 0 0; padding: 11px 14px;
      border-left: 3px solid var(--md-sys-color-primary);
      border-radius: var(--md-sys-shape-corner-extra-small);
      background: var(--md-sys-color-surface-container);
      font-size: 12.5px; line-height: 1.55; color: #444746;
    }

    /* A modal has to be modal, so the scrim covers the product frame
       and nothing behind it is reachable while the question stands. */
    .sc-scrim {
      position: absolute; inset: 0; z-index: 30;
      display: grid; place-items: center; padding: 20px;
      background: color-mix(in srgb, var(--md-sys-color-scrim) 34%, transparent);
      animation: sc-fade 160ms var(--md-sys-motion-easing-standard);
    }
    .sc-scrim .md-dialog { max-width: 380px; }
    @keyframes sc-fade { from { opacity: 0 } to { opacity: 1 } }

    /* Anything that ARRIVES rises into place — an ask that appears
       instantly reads as having always been there, which is exactly
       the wrong impression for a permission request. */
    .sc-rise { animation: sc-rise 260ms var(--md-sys-motion-easing-emphasized) both; }
    @keyframes sc-rise {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sc-rise, .sc-scrim { animation: none; }
      .sc-src__mark { transition: none; }
    }

    /* ════════════════════════════════════════════════════════════
       LIVE PREVIEW PLAYGROUND

       A workbench, not a swatch. The reader drives the pattern
       through its own states, the code follows whatever is on
       screen, and the read-out underneath says what caused the
       state they are looking at.

       Motion follows the neural expressive rule that a change of
       state is one surface TRANSFORMING, not one element being
       replaced by another: the disclosure panel grows out of its
       own chip on a 0fr→1fr grid row, with M3's emphasized easing
       and a small settle, rather than fading in beside it.
       ════════════════════════════════════════════════════════════ */
    /* The description is a standing subtitle, not a lede: one line of
       what the pattern is and what it buys, at a size that keeps the
       first interactive thing on the page above the fold. 20px was
       sized for a two-sentence hero this page no longer has. */
    .detail__oneline {
      font-size: 16px; line-height: 1.6; max-width: 66ch;
    }

    /* ── Material Symbols ──────────────────────────────────────
       The icons are the kit's own paths, which are FILLED shapes
       on a 960 grid rather than the 24x24 strokes this stylesheet
       used to draw. Roughly twenty rules across this file still
       say `fill: none; stroke: currentColor` at each icon's own
       site, and rewriting all of them would be twenty chances to
       miss one.

       So the fill rule is stated once, at a specificity that wins
       (.mi.mi beats any `.thing svg`), and deliberately does NOT
       set a size — every contextual rule below still decides how
       big its own icon is, which is the part that was correct
       already. */
    .mi { width: 1em; height: 1em; flex: 0 0 auto; }
    .mi.mi { fill: currentColor; stroke: none; }

    /* ── The status block on an unbuilt pattern ────────────────
       What is left of the classification strip. The strip itself
       was removed from every pattern page; these rules survive
       because the page for a pattern that is IN the map but not
       built still uses them to say what it is, where it sits and
       what its status is. That page is also where an old merged
       bookmark lands, so it has to be more than a stub. */
    .mp-class {
      margin-top: 22px; padding-top: 18px; max-width: 74ch;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: grid; gap: 12px;
    }
    .mp-class__row {
      display: grid; grid-template-columns: 96px minmax(0, 1fr);
      gap: 14px; align-items: baseline;
    }
    .mp-class__k {
      color: var(--md-sys-color-on-surface-variant);
      text-transform: uppercase; letter-spacing: .07em;
    }
    .mp-class__v { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .mp-class__what { flex: 1 0 100%; margin: 2px 0 0; }

    /* Status, with its word doing the carrying and colour only
       making it faster to find. */
    .mp-mat {
      display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 11px;
      border-radius: var(--mx-shape-chip);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }
    .mp-mat[data-level="established"] {
      background: var(--mx-color-success-bg); color: var(--mx-color-on-success);
    }
    .mp-mat[data-level="specialized"] {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .mp-mat[data-level="experimental"] {
      background: var(--mx-color-agent-blocked-bg); color: var(--mx-color-on-agent-blocked);
    }
    /* The Labs marker on that page. */
    .mp-inst__badge {
      flex: 0 0 auto;
      padding: 3px 9px; border-radius: var(--mx-shape-chip);
      background: var(--mx-color-agent-blocked);
      color: var(--md-sys-color-on-primary);
      font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    }

    /* The row nobody reads unless it is impossible to miss. */
    .qa-row--not .qa-row__k { color: var(--mx-color-on-agent-blocked); }
    .qa-row--not .qa-row__k em { font-style: normal; text-decoration: underline; }

    @media (max-width: 640px) {
      .mp-class__row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    }

    .pv-head {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    /* Head: the view toggle on the left, and on the right the two
       things that change what you are looking at — which state, and
       the options behind it. Both are single controls at a fixed
       size, so the row does not reflow as a pattern's state count
       changes from three to six. */
    /* One toolbar, not three controls that happen to be adjacent.
       Every control in it is --pv-bar-h tall and separated by one
       small gap, so the cluster reads as a single group. */
    .pv-head__right {
      --pv-bar-h: 32px;
      display: flex; align-items: center; gap: 6px; margin-left: auto;
      flex-wrap: wrap; justify-content: flex-end;
    }

    .pv-select { position: relative; }
    .pv-select__btn {
      display: inline-flex; align-items: center; gap: 4px;
      height: var(--pv-bar-h); padding: 0 8px 0 12px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); cursor: pointer;
      font-family: inherit; font-size: 12.5px; color: var(--fg);
      transition: border-color 160ms var(--md-sys-motion-easing-standard);
    }
    .pv-select__btn:hover { border-color: var(--fg-muted); }
    /* The trigger is inline-flex and sized by its content, so it
       grows with the state name rather than breaking it over two
       lines inside the bar's height. The word "State" has gone: the
       chevron says it is a menu, the read-out below the frame names
       the state again, and the button tells a screen reader what it
       is through aria-label rather than through 40px of chrome. */
    .pv-select__btn { white-space: nowrap; }
    .pv-select__v { font-weight: 600; }
    .pv-select__k { color: var(--fg-muted, #6b6b66); margin-right: 6px; font-weight: 400; }
    .pv-select__chev {
      width: 14px; height: 14px; color: var(--fg-muted);
      transition: transform 200ms var(--md-sys-motion-easing-emphasized);
    }
    .pv-select__btn[aria-expanded="true"] .pv-select__chev { transform: rotate(180deg); }

    /* Sized to its longest state name rather than to a guess: the
       menu is anchored to its right edge, so it grows leftwards
       into free space instead of wrapping a label onto a second
       line inside a fixed 36px row. The floor keeps the short
       names from making a cramped little menu, and the ceiling
       keeps a long one from running off a narrow window. */
    .pv-select__menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
      width: max-content;
      min-width: 210px; max-width: min(340px, calc(100vw - 32px));
      padding: 6px;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-low);
      box-shadow: var(--md-sys-elevation-2);
      animation: pv-menu-in 180ms var(--md-sys-motion-easing-emphasized) both;
    }
    @keyframes pv-menu-in {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }
    .pv-select__opt {
      display: flex; align-items: center; gap: 10px; width: 100%;
      height: 36px; padding: 0 10px; text-align: left;
      white-space: nowrap;
      border: 0; border-radius: var(--md-sys-shape-corner-small);
      background: transparent; cursor: pointer;
      font-family: inherit; font-size: 13px; color: var(--md-sys-color-on-surface);
    }
    .pv-select__opt:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface)
        calc(var(--md-sys-state-hover-opacity) * 100%), transparent);
    }
    .pv-select__opt[aria-selected="true"] { font-weight: 620; }
    /* The label is the only part allowed to give way, and only
       once the menu has already grown to its ceiling — so a state
       name longer than any of today's ends in an ellipsis instead
       of being silently cut off by the menu's edge. The tick and
       the customised dot hold their size either way. */
    .pv-select__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .pv-select__opt .pvc-dot { flex: 0 0 auto; }
    /* A tick, and a slot for it that is always there — so choosing an
       option does not shift the labels of the ones around it. */
    .pv-select__tick {
      width: 16px; height: 16px; flex: 0 0 auto;
      color: var(--md-sys-color-primary);
    }
    .pv-select__tick svg { width: 16px; height: 16px; display: block; }

    /* ── The preview ground ───────────────────────────────
       One neutral grey panel with no outline around it. Three
       decisions, and they depend on each other:

       NEUTRAL, not a Material surface token. M3's surface-container
       ramp is lavender-tinted (#F7F2FA, #F3EDF7) — the same hue as
       primary-container, which is what half these patterns use for
       their own surfaces. A tinted ground made the specimen's tone
       impossible to judge against it, which is the reason the old
       radial wash had to go too.

       GREY, not white. With the outline removed, the ground is the
       only thing that says where the frame is, so it has to sit a
       step off the page (#fbfbfa) rather than level with it.

       ONE SURFACE. The stage and the code pane both inherit it, so
       the frame reads as a single panel instead of a box holding
       two boxes. */
    /* WHITE (user request, 5 Oct): the Live Preview ground is now
       surface-container-lowest (#fff), with no stroke (user request). */
    .pv-frame {
      --pv-ground: var(--md-sys-color-surface-container-lowest, #fff);
      border: 0;
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--pv-ground);
      overflow: hidden;
    }
    .pv-stage {
      min-height: 300px; padding: 40px 32px;
      display: grid; place-items: center;
      background: transparent;
    }
    /* display:grid outranks the UA sheet's [hidden] rule, so the
       author-level restatement is not optional. */
    .pv-stage[hidden] { display: none; }
    /* place-items:center shrink-wraps a block child, which made the
       composer a different width in every state and turned a
       state-comparison gallery into a size-comparison one. The
       stage gives it one measure; the component decides the rest. */
    .pv-stage > .ax__composer { width: 100%; max-width: 460px; }
    /* A composer menu opens UPWARD, which is right in a product
       where the composer sits at the bottom of a workspace. In a
       centred preview stage that runs off the top, so the stage
       makes room and hangs the composer at the bottom instead.
       The component is not changed: its placement was correct. */
    .pv-stage:has(.ax__menu--model) {
      align-items: end; padding-top: 460px;
    }
    /* Same reason, less of it: the effort popover is four lines
       tall, not a list. */
    .pv-stage:has(.ax__menu--effort) {
      align-items: end; padding-top: 210px;
    }
    /* Initial CTA already carries its own lead and breathing room above
       the composer, so it needs far less added room for the flyouts
       (user request, 7 Oct). */
    .pv-stage:has(.md-icta .ax__menu--model) { padding-top: 240px; }
    .pv-stage:has(.md-icta .ax__menu--effort) { padding-top: 0; }
    .pv-code {
      position: relative; margin: 0; padding: 22px 24px;
      /* Matches .pv-stage's min-height so the frame is the same size
         whichever segment is showing — a pattern whose code is a
         single short line no longer collapses to a sliver next to
         one whose preview needs the full stage. */
      min-height: 300px; max-height: 460px; overflow: auto;
      background: transparent;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px; line-height: 22px; color: var(--md-sys-color-on-surface);
      white-space: pre-wrap; word-break: break-word;
    }
    .pv-code .t { color: #15803d; }
    .pv-code .a { color: #1d4ed8; }
    .pv-code .v { color: #b91c1c; }
    .pv-copy {
      position: absolute; top: 12px; right: 14px;
      width: 32px; height: 32px; padding: 0; border: 0;
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
      display: grid; place-items: center; cursor: pointer;
    }
    .pv-copy svg { width: 15px; height: 15px; }
    .pv-copy:hover { color: var(--md-sys-color-on-surface); }
    .pv-copy.is-done { color: var(--md-sys-color-primary); }

    /* Rules BETWEEN the rows only. The outer two drew a box around
       four lines of text that needed no box — and the top one sat a
       few pixels under the frame's own edge, reading as a seam. */
    .pv-doc-rows { margin: 20px 0 0; padding: 0; }
    .pv-row {
      display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 20px;
      padding: 11px 0; border-bottom: 1px solid var(--border);
    }
    .pv-row:last-child { border-bottom: 0; }
    .pv-row__k {
      margin: 0; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--fg-muted);
    }
    .pv-row__v { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--fg-alt); }
    .pv-live {
      margin: 10px 0 0; min-height: 16px;
      font-size: 12px; color: var(--fg-muted);
    }

    /* ── Specimens used by the playground ─────────────────── */
    /* ── The shape scale ─────────────────────────────────────
       One vocabulary, two roles, resolved here rather than in script,
       and shared by every pattern that offers a shape control.

       A CONTAINER takes the next token down from the one named, capped
       at extra-large: a fully rounded chip is correct Material, a
       pill-shaped content surface is not. A MARKER takes the token
       itself. That is the whole reason the value travels as a token
       name and not as a number — the number differs by role.

         token          surface        marker
         full           28px           9999px
         extra-large    16px             28px
         large          12px             16px
         medium          8px             12px
         small           4px              8px

       Patterns opt in by putting data-shape on their own surface, so
       the list below is explicit rather than a blanket attribute
       selector that would also catch the markers. */
    .pv-card[data-shape="full"],
    .pv-consent[data-shape="full"],
    .m3-granted[data-shape="full"],
    .md-nudge[data-shape="full"],
    .pv-composer[data-shape="full"],
    .md-tpl[data-shape="full"]        { border-radius: var(--md-sys-shape-corner-extra-large); }

    .pv-card[data-shape="extra-large"],
    .pv-consent[data-shape="extra-large"],
    .m3-granted[data-shape="extra-large"],
    .md-nudge[data-shape="extra-large"],
    .pv-composer[data-shape="extra-large"],
    .md-tpl[data-shape="extra-large"] { border-radius: var(--md-sys-shape-corner-large); }

    .pv-card[data-shape="large"],
    .pv-consent[data-shape="large"],
    .m3-granted[data-shape="large"],
    .md-nudge[data-shape="large"],
    .pv-composer[data-shape="large"],
    .md-tpl[data-shape="large"]       { border-radius: var(--md-sys-shape-corner-medium); }

    .pv-card[data-shape="medium"],
    .pv-consent[data-shape="medium"],
    .m3-granted[data-shape="medium"],
    .md-nudge[data-shape="medium"],
    .pv-composer[data-shape="medium"],
    .md-tpl[data-shape="medium"]      { border-radius: var(--md-sys-shape-corner-small); }

    .pv-card[data-shape="small"],
    .pv-consent[data-shape="small"],
    .m3-granted[data-shape="small"],
    .md-nudge[data-shape="small"],
    .pv-composer[data-shape="small"],
    .md-tpl[data-shape="small"]       { border-radius: var(--md-sys-shape-corner-extra-small); }

    .pv-disclose[data-shape="full"]        { --chip-radius: var(--md-sys-shape-corner-full); }
    .pv-disclose[data-shape="extra-large"] { --chip-radius: var(--md-sys-shape-corner-extra-large); }
    .pv-disclose[data-shape="large"]       { --chip-radius: var(--md-sys-shape-corner-large); }
    .pv-disclose[data-shape="small"]       { --chip-radius: var(--md-sys-shape-corner-small); }


    /* Flat, like every other specimen in the library. The elevation-1
       token is two black shadows — correct on a white product surface,
       but over the tinted preview ground it reads as a grey smudge
       under the card rather than as height. The outline carries the
       edge instead, which is what the other patterns' surfaces do, so
       the whole set looks like one system. */
    .pv-card {
      width: min(460px, 100%); padding: 22px 24px;
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .pv-card--quiet { box-shadow: none; background: var(--md-sys-color-surface-container-low); }
    .pv-card__title { margin: 0; color: var(--md-sys-color-on-surface); }
    .pv-card__meta { margin: 3px 0 0; color: var(--md-sys-color-on-surface-variant); }
    .pv-card__empty { margin: 16px 0 14px; color: var(--md-sys-color-on-surface-variant); }
    .pv-card__body { margin: 16px 0 0; color: var(--md-sys-color-on-surface); }
    .pv-card .md-button { margin-top: 14px; }

    .pv-status { display: flex; align-items: center; gap: 10px; margin-top: 18px;
                 color: var(--md-sys-color-on-surface-variant); }
    /* A ring, not a bar: the agent is working on this card, and the
       indicator says so by living on it. */
    .pv-status__ring {
      width: 16px; height: 16px; flex: 0 0 auto; border-radius: 50%;
      border: 2px solid color-mix(in oklab, var(--md-sys-color-primary) 26%, transparent);
      border-top-color: var(--md-sys-color-primary);
      animation: pv-spin 780ms linear infinite;
    }
    @keyframes pv-spin { to { transform: rotate(360deg); } }
    .pv-skeleton { display: grid; gap: 9px; margin-top: 16px; }
    .pv-skeleton span {
      height: 10px; border-radius: 999px;
      background: linear-gradient(90deg,
        var(--md-sys-color-surface-container) 0%,
        var(--md-sys-color-surface-container-high) 40%,
        var(--md-sys-color-surface-container) 80%);
      background-size: 220% 100%;
      animation: pv-shimmer 1500ms ease-in-out infinite;
    }
    .pv-skeleton span:nth-child(2) { width: 88%; animation-delay: 120ms; }
    .pv-skeleton span:nth-child(3) { width: 62%; animation-delay: 240ms; }
    @keyframes pv-shimmer {
      from { background-position: 120% 0; } to { background-position: -60% 0; }
    }

    /* ── The disclosure surface: chip → panel, one element ── */
    .pv-disclose {
      margin-top: 18px;
      border-radius: var(--md-sys-shape-corner-medium);
      border: 1px solid transparent;
      background: transparent;
      transition:
        background-color 320ms var(--md-sys-motion-easing-emphasized),
        border-color 320ms var(--md-sys-motion-easing-emphasized),
        border-radius 320ms var(--md-sys-motion-easing-emphasized);
    }
    /* The panel takes the chip's corner too, so the marker is one
       shape rather than a round chip inside a differently-rounded
       box. Capped at the extra-large token: a fully-rounded chip is
       correct, a pill-shaped PANEL is not a Material shape, and
       `min()` lets the cap live in CSS instead of being computed in
       two places. */
    .pv-disclose[data-open="true"] {
      background: var(--md-sys-color-surface-container);
      border-color: var(--md-sys-color-outline-variant);
      border-radius: min(var(--chip-radius, 9999px),
                         var(--md-sys-shape-corner-extra-large));
    }
    /* 32px tall, per the Material chip spec. It was 30 — close
       enough to look right and wrong enough that a reader measuring
       against the kit would find it off by two with no way to tell
       whether that was a decision or a slip. */
    .pv-disclose__chip {
      position: relative;
      display: inline-flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 12px;
      border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-family: inherit; cursor: pointer;
      /* The chip arrives with the content rather than blinking into
         existence: a short rise with a touch of overshoot, once. */
      animation: pv-chip-in 380ms var(--md-sys-motion-easing-emphasized) both;
      transition: box-shadow 200ms var(--md-sys-motion-easing-standard),
                  transform 200ms var(--md-sys-motion-easing-standard);
    }
    /* The touch target, which the visual chip does not provide on its
       own: 32px drawn, 48px reachable — Material's target size, and
       the one the Quality read-out claims. It extends symmetrically
       and invisibly, so nothing moves and no layout gains a gap.

       Only on the BUTTON. The static note is not a control, and
       giving unpressable text a 48px hit area would make the surface
       lie about what can be pressed. */
    button.pv-disclose__chip::before {
      content: ''; position: absolute; left: 0; right: 0;
      top: 50%; transform: translateY(-50%);
      height: 48px;
    }
    /* Open, the panel's own content begins directly beneath the chip,
       and a target hanging 8px into it would swallow the first thing
       a reader reaches for. Collapsed back to the chip while open —
       the control is under the pointer either way. */
    .pv-disclose[data-open="true"] button.pv-disclose__chip::before { height: 100%; }
    .pv-disclose__chip:hover { box-shadow: var(--md-sys-elevation-1); transform: translateY(-1px); }
    .pv-disclose__chip:active { transform: translateY(0) scale(0.985); }
    .pv-disclose__chip:focus-visible {
      outline: 3px solid color-mix(in oklab, var(--md-sys-color-primary) 55%, transparent);
      outline-offset: 2px;
    }
    @keyframes pv-chip-in {
      0%   { opacity: 0; transform: translateY(6px) scale(0.94); }
      70%  { opacity: 1; transform: translateY(0) scale(1.015); }
      100% { opacity: 1; transform: none; }
    }
    .pv-disclose__ico { width: 14px; height: 14px; fill: currentColor; }
    .pv-disclose__chev {
      width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      transition: transform 320ms var(--md-sys-motion-easing-emphasized);
    }
    .pv-disclose[data-open="true"] .pv-disclose__chip { margin: 10px 0 0 10px; }
    .pv-disclose[data-open="true"] .pv-disclose__chev { transform: rotate(180deg); }

    /* 0fr → 1fr is what makes this a genuine container transform:
       the panel takes exactly the height of its content, animated,
       with no magic max-height number to get wrong. */
    .pv-disclose__detail {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows 380ms var(--md-sys-motion-easing-emphasized);
    }
    .pv-disclose[data-open="true"] .pv-disclose__detail { grid-template-rows: 1fr; }
    .pv-disclose__inner {
      overflow: hidden;
      opacity: 0;
      transition: opacity 220ms var(--md-sys-motion-easing-standard) 60ms;
    }
    .pv-disclose[data-open="true"] .pv-disclose__inner { opacity: 1; }
    .pv-disclose__inner > * { margin: 0; }
    .pv-disclose__inner {
      padding: 0 14px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .pv-disclose[data-open="true"] .pv-disclose__inner { padding: 12px 14px 14px; }

    .pv-sources { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 7px; }
    .pv-sources li { display: flex; gap: 10px; align-items: baseline; }
    .pv-sources__k {
      flex: 0 0 auto; min-width: 52px;
      color: var(--md-sys-color-primary); font-weight: 600;
    }

    /* ── Other playground specimens ───────────────────────── */
    .pv-consent {
      width: min(470px, 100%); padding: 22px 24px 18px;
      border-radius: var(--md-sys-shape-corner-extra-large);
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: var(--md-sys-elevation-2);
      animation: pv-rise 320ms var(--md-sys-motion-easing-emphasized) both;
    }
    @keyframes pv-rise {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }
    .pv-consent__k {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
    }
    .pv-consent__t { margin: 12px 0 0; color: var(--md-sys-color-on-surface); }
    .pv-consent__s { margin: 5px 0 0; color: var(--md-sys-color-on-surface-variant); }
    .pv-consent__foot { display: flex; gap: 8px; margin-top: 18px; }

    .pv-namecard { width: min(440px, 100%); }
    .pv-namecard__detail {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows 380ms var(--md-sys-motion-easing-emphasized);
    }
    .pv-namecard[data-open="true"] .pv-namecard__detail { grid-template-rows: 1fr; }
    .pv-namecard__inner {
      overflow: hidden; opacity: 0;
      transition: opacity 200ms var(--md-sys-motion-easing-standard) 60ms;
    }
    .pv-namecard[data-open="true"] .pv-namecard__inner { opacity: 1; }

    /* The composer specimen used by several playgrounds. */
    .pv-composer {
      width: min(520px, 100%); padding: 16px 18px;
      border-radius: var(--md-sys-shape-corner-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-lowest);
    }
    .pv-composer__label { margin: 0; color: var(--md-sys-color-on-surface-variant); }
    .pv-composer__value { margin: 6px 0 0; color: var(--md-sys-color-on-surface); }
    .pv-composer__foot {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .pv-composer__foot .md-button--filled { margin-left: auto; }
    .pv-muted { color: var(--md-sys-color-on-surface-variant); }
    /* A resting caret: the request is the user's now, and editable. */
    .pv-caretbar {
      display: inline-block; width: 2px; height: 16px; margin-left: 2px;
      vertical-align: -3px; background: var(--md-sys-color-primary);
      animation: sc-blink 1000ms steps(2, start) infinite;
    }
    @media (prefers-reduced-motion: reduce) { .pv-caretbar { animation: none; } }

    .pv-iconstate { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    /* Container off: the glyph alone, at the size it would sit at
       inside the tile, so the comparison is like for like. */
    .pv-iconstate__bare {
      width: 24px; height: 24px; margin: 8px;
      fill: var(--md-sys-color-primary);
    }

    .pv-doc {
      width: min(480px, 100%); padding: 18px 20px;
      border-radius: var(--md-sys-shape-corner-large);
      border: 2px solid transparent;
      background: var(--md-sys-color-surface-container-lowest);
      transition: border-color 320ms var(--md-sys-motion-easing-emphasized);
    }
    /* The accent is whichever role the product reserved. Three
       options, all Material roles — there is no fourth that is a
       colour value. */
    .pv-doc.is-live { border-color: var(--md-sys-color-primary); }
    .pv-doc.is-live[data-accent="secondary"] { border-color: var(--md-sys-color-secondary); }
    .pv-doc.is-live[data-accent="tertiary"]  { border-color: var(--md-sys-color-tertiary); }
    /* The second reserved role: the agent is asking, not working. */
    .pv-doc.is-live[data-accent="warning"] { border-color: var(--mx-color-blocked, #9A4505); }
    .pv-doc[data-accent="warning"] .md-presence__dot { background: var(--mx-color-blocked, #9A4505); }
    .pv-doc[data-accent="warning"] .md-presence__label { color: var(--mx-color-blocked, #9A4505); }
    .pv-doc[data-accent="secondary"] .md-presence__dot { background: var(--md-sys-color-secondary); }
    .pv-doc[data-accent="tertiary"]  .md-presence__dot { background: var(--md-sys-color-tertiary); }
    .pv-doc[data-accent="secondary"] .md-presence__label { color: var(--md-sys-color-secondary); }
    .pv-doc[data-accent="tertiary"]  .md-presence__label { color: var(--md-sys-color-tertiary); }
    .md-assist-chip--neutral {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }
    .pv-doc__head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .pv-doc__tag { display: block; margin-top: 9px; }

    /* ── Composed from ────────────────────────────────────── */
    .cf {
      display: grid; gap: 2px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      margin-bottom: 18px;
    }
    .cf__item {
      padding: 14px 16px;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-low);
      transition: background-color 200ms var(--md-sys-motion-easing-standard);
    }
    .cf__item:hover { background: var(--md-sys-color-surface-container); }
    .cf__name {
      display: block; font-size: 13.5px; font-weight: 640; color: var(--fg);
    }
    .cf__role {
      display: block; margin-top: 5px;
      font-size: 12.5px; line-height: 1.55; color: var(--fg-alt);
    }
    .mp-sub {
      margin: 26px 0 12px; font-size: 14px; font-weight: 650; color: var(--fg);
    }
    .mp-sub--flush { margin-top: 0; }
    .section-block--plain { border-top: 1px solid var(--border); padding-top: 26px; }

    /* ── Reference ──────────────────────────────────────────
       Three shapes only — keyed pairs, an ordered sequence, a flat
       list — so two pattern pages can be read across rather than
       each inventing its own documentation layout. */
    .ref-note {
      margin: -6px 0 12px; font-size: 13.5px; line-height: 1.6; color: var(--fg-alt);
    }
    .ref-prose { margin: 0; font-size: 15px; line-height: 1.65; color: var(--fg-alt); }
    .ref-pairs .qa-row__k a { color: inherit; text-decoration: underline; }
    .ref-pairs .qa-row__k a:hover { color: var(--md-sys-color-primary, #6750a4); }
    .ref-steps, .ref-rules {
      margin: 0; padding: 0 0 0 22px;
      display: flex; flex-direction: column; gap: 9px;
      font-size: 15px; line-height: 1.6; color: var(--fg-alt);
    }
    .ref-steps li::marker { color: var(--fg); font-weight: 650; font-size: 13px; }
    .ref-rules { list-style: none; padding-left: 0; }
    .ref-rules li { position: relative; padding-left: 20px; }
    .ref-rules li::before {
      content: ''; position: absolute; left: 4px; top: 10px;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--md-sys-color-outline, #79747e);
    }
    .ref-rules--dont li::before {
      content: '\00d7'; left: 2px; top: -1px; width: auto; height: auto;
      border-radius: 0; background: none; font-size: 16px; font-weight: 700;
      color: var(--md-sys-color-error, #b3261e);
    }
    .ref-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .ref-tag {
      display: inline-flex; align-items: center; padding: 6px 12px;
      border: 1px solid var(--border); border-radius: 999px;
      font-size: 13px; color: var(--fg-alt); background: var(--surface);
    }
    .ref-tag--link { text-decoration: none; }
    .ref-tag--link:hover {
      border-color: var(--md-sys-color-primary, #6750a4);
      color: var(--md-sys-color-primary, #6750a4);
    }

    @media (prefers-reduced-motion: reduce) {
      .pv-select__chev, .pv-disclose, .pv-disclose__chip, .pv-disclose__chev,
      .pv-disclose__detail, .pv-disclose__inner, .pv-namecard__detail,
      .pv-namecard__inner, .pv-doc, .cf__item { transition: none; }
      .pv-status__ring, .pv-skeleton span { animation: none; }
      .pv-disclose__chip, .pv-consent { animation: none; }
    }

    /* One focus treatment for every control the reader can reach in a
       playground or a scene. Expressiveness never justifies an
       invisible focus ring. */
    .pv .md-button:focus-visible,
    .pv .md-icon-button:focus-visible,
    .pv .md-sp__item:focus-visible,
    .pv-select__btn:focus-visible,
    .pv-select__opt:focus-visible,
    .pv-edit:focus-visible,
    .pv-copy:focus-visible,
    .sc-switch:focus-visible,
    .sc-seg__btn:focus-visible,
    .mp-scene .md-button:focus-visible,
    .mp-scene .m3-toggle:focus-visible,
    .mp-scene .m3-chip__x:focus-visible {
      outline: 3px solid color-mix(in oklab, var(--md-sys-color-primary) 55%, transparent);
      outline-offset: 2px;
    }

    /* ── Capability Discovery scenes ──────────────────────── */
    .sc-lede { margin: 0 0 4px; color: var(--app-ink-dim, #5f6368); max-width: 56ch; }

    /* The composer a pattern hands its output to. Every one of these
       four scenes ends here on purpose: an example, a template or a
       nudge that does not end in the user's own editable request has
       stopped one step short of being useful. */
    .sc-compose {
      max-width: 560px; padding: 14px 16px;
      border-radius: var(--md-sys-shape-corner-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-lowest);
    }
    .sc-compose__k { margin: 0; color: var(--app-ink-dim, #5f6368); }
    .sc-compose__v {
      margin: 6px 0 0; font-size: 15px; line-height: 22px;
      color: var(--app-ink, #202124);
    }
    .sc-compose__foot {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .sc-compose__foot .md-button--filled { margin-left: auto; }

    .sc-replybox {
      position: relative; max-width: 560px; margin-top: 4px;
      padding: 14px 16px;
      border-radius: var(--md-sys-shape-corner-large);
      border: 1px dashed var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-lowest);
    }
    .sc-replybox__t { display: block; color: var(--app-ink-dim, #5f6368); }
    .sc-replybox__row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    .sc-replybox__count { color: var(--app-ink-dim, #5f6368); }
    /* The nudge sits inside the box it is about, under the control,
       with its tail pointing back up at it. Floating it absolutely
       looked right until the frame clipped it — and a hint that can
       be cut off by its own container is not anchored to anything. */
    .sc-nudgewrap { margin-top: 18px; }

    /* ════════════════════════════════════════════════════════════
       CUSTOMIZE PANEL

       Sits beside the preview rather than over it: the whole point
       is watching the specimen change as a control moves, and a
       panel that covers the thing it edits defeats that. It opens
       by growing a grid column, so the frame narrows instead of
       being overlapped.
       ════════════════════════════════════════════════════════════ */
    .pv-edit {
      display: inline-flex; align-items: center; gap: 6px;
      /* Room for the corner dot, reserved whether or not it is there. */
      padding-right: 12px;
      position: relative;
      height: var(--pv-bar-h, 32px); padding: 0 12px;
      border: 1px solid var(--border); border-radius: 999px;
      background: transparent; cursor: pointer;
      font-family: inherit; font-size: 12.5px; color: var(--fg-alt);
      transition: background-color 180ms var(--md-sys-motion-easing-standard),
                  border-color 180ms var(--md-sys-motion-easing-standard),
                  color 180ms var(--md-sys-motion-easing-standard);
    }
    .pv-edit__ico { width: 15px; height: 15px; }
    .pv-edit:hover { color: var(--fg); border-color: var(--fg-muted); }
    .pv-edit.is-on {
      background: var(--md-sys-color-secondary-container);
      border-color: transparent;
      color: var(--md-sys-color-on-secondary-container);
    }
    /* A dot, not a count: it says "this is no longer the default",
       which is the only thing a reader needs to know from here.
       It rides the corner rather than the text, so the button is the
       same width before and after the first change — inline, it grew
       the button by 12px and shoved the whole toolbar sideways at the
       exact moment the comparison control was arriving. */
    .pv-edit__dot {
      position: absolute; top: 2px; right: 6px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--md-sys-color-primary);
      outline: 2px solid var(--surface);
    }

    .pv-work {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 0fr;
      gap: 0;
      align-items: start;
      transition: grid-template-columns 380ms var(--md-sys-motion-easing-emphasized),
                  gap 380ms var(--md-sys-motion-easing-emphasized);
    }
    .pv--tuning .pv-work {
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 14px;
    }

    /* Capped so a long option list scrolls inside the panel instead
       of stretching the row far past the specimen it is editing.

       The panel itself does NOT scroll: it is a column with a fixed
       head and a body that owns the scroll. That way the head — title,
       state, Reset, close — is always reachable, and the one element
       holding a scroll offset is the one the reconciler never
       replaces. */
    .pvc {
      /* Enough that a state's whole configuration lands in one
         view. Past that it scrolls, and the head and foot stay. */
      max-height: 700px;
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--md-sys-color-surface-container-lowest);
      animation: pvc-in 300ms var(--md-sys-motion-easing-emphasized) both;
    }
    @keyframes pvc-in {
      from { opacity: 0; transform: translateX(10px); }
      to   { opacity: 1; transform: none; }
    }
    .pvc__head {
      flex: none; position: relative; z-index: 2;
      display: grid; gap: 6px;
      padding: 10px 10px 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--md-sys-color-surface-container-lowest);
    }
    .pvc__bar { display: flex; align-items: center; gap: 8px; }
    .pvc__bar--sub { min-height: 26px; }
    .pvc__acts { margin-left: auto; display: flex; align-items: center; gap: 2px; }
    .pvc__heading { margin-right: auto; display: grid; gap: 2px; }
    .pvc__title { font-size: 13px; font-weight: 650; color: var(--fg); margin-right: auto; }
    /* ── Badge, not button ──────────────────────────────────
       The secondary-container fill is this panel's SELECTED
       state: it is what Compact wears once it is chosen, what
       Customize wears while it is open, and what Copy wears for
       the second after it fires. A status badge in the same fill
       claims to be one of those — it looks pressable, and the eye
       cannot sort three purple pills into "you chose this" and
       "we are telling you this".

       Three fills, three jobs, and no overlap between them:

         tonal purple   a state a control is in     (selected)
         neutral grey   a fact the panel reports    (tag)
         none + border  pressable, not chosen       (options,
                        copy buttons)

       Neutral grey is free to mean "tag" precisely because no
       control in this panel is ever filled with it, so the
       treatment cannot be misread as a control at rest.

       The ink is on-surface throughout — one tag treatment, read
       the same way wherever it appears. Change is not signalled
       here: the primary rule down the left edge of a modified row
       carries that, and saying it twice made the tag compete with
       the control it was describing.

       The count is absent at zero — "0 changes" labels a state
       that needs no label. */
    .pvc__count {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      background: var(--md-sys-color-surface-container-highest);
      border: 0;
      color: var(--md-sys-color-on-surface);
    }
    .pvc__step {
      width: 28px; height: 28px; border: 0; border-radius: 6px;
      background: transparent; color: var(--fg-muted); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    /* Sized as an icon, not as text: the glyph is centred on the
       button rather than sitting on a text baseline. */
    .pvc__step .mi { width: 17px; height: 17px; }
    .pvc__step:hover:not(:disabled) { background: var(--ink-50); color: var(--fg); }
    .pvc__step:disabled { opacity: 0.32; cursor: default; }

    /* Sections. Four names, always in the same order, so a reader
       learns where to look once rather than per pattern.

       The rule between them is the section boundary, and it needs
       air on BOTH sides to read as one: a hairline tight under the
       last control of one section and far from the next heading
       belongs to the control, not to the break. Equal padding top
       and bottom makes the separator sit in the middle of its own
       gap, which is what makes the sections scan as sections. */
    .pvc-sec { padding: 16px 0; border-bottom: 1px solid var(--border); }
    .pvc-sec:first-child { padding-top: 10px; }
    .pvc-sec:last-child { border-bottom: 0; padding-bottom: 6px; }
    .pvc-sec__head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .pvc-sec__label {
      margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--fg-muted);
    }
    /* Consent: density, and the badge that separates a write ask
       from a read one. "Send email on your behalf" is not the same
       kind of request as "read this file", and a row that looks
       identical to its neighbour says it is. */
    .pv-consent.is-compact { padding: 14px 16px; }
    .pv-consent.is-compact .m3-scopes { margin-top: 10px; }
    .pv-consent.is-compact .pv-consent__foot { margin-top: 12px; }
    /* Default is 22px/24px. The quiet variant shares the base, so one
       rule covers both — the plain card carried no compact rule at
       all, which is why Density was inert in Nudges' Accepted. */
    .pv-card.is-compact { padding: 14px 16px; }
    .pv-card.is-compact .pv-card__body { margin-top: 11px; }
    .pv-card.is-compact .md-button { margin-top: 10px; }
    .m3-granted.is-compact { padding: 12px 14px; }
    .pv-consent__dur {
      margin: 10px 0 0; color: var(--md-sys-color-on-surface-variant);
    }
    .m3-scope__w {
      display: inline-block; margin-left: 6px; padding: 0 6px;
      border-radius: 999px; vertical-align: 1px;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    }

    /* Caveat: a boxed caveat can now carry a verification line, a
       source line and a dismiss — so it is a block, not a paragraph. */
    .md-caveat--boxed { display: flex; align-items: flex-start; gap: 8px; }
    .md-caveat__line { margin: 0; }
    .md-caveat__src, .md-caveat__verify {
      margin: 4px 0 0; opacity: 0.85;
    }
    .md-caveat__x {
      margin-left: auto; flex: none; width: 22px; height: 22px;
      border: 0; border-radius: 50%; background: transparent;
      color: inherit; opacity: 0.6; cursor: pointer; font-size: 15px; line-height: 1;
    }
    .md-caveat__x:hover { opacity: 1; background: var(--ink-50); }
    .m3-answer.is-compact { padding: 14px 16px; }
    .m3-answer.is-compact .md-caveat--boxed { margin-top: 10px; padding: 8px 10px; }
    .md-composer.is-compact { padding: 10px 12px; }
    .md-caveat-action.is-compact { padding: 12px; }

    /* Name: layout and density. Stacked puts the mark above the
       name, for narrow columns and for cards that sit in a grid. */
    .md-idcard[data-layout="stacked"] .md-idcard__head {
      flex-direction: column; align-items: flex-start; gap: 10px;
    }
    .md-idcard.is-compact { padding: 14px 16px; }
    .md-idcard.is-compact .md-idcard__foot { margin-top: 10px; }

    /* Iconography: the reserved mark at two sizes. Small is the
       list and menu placement; medium leads a primary action. */
    .pv-iconstate.is-medium .md-icontile__box { width: 48px; height: 48px; }
    .pv-iconstate.is-medium .md-icontile__box .mi,
    .pv-iconstate.is-medium .pv-iconstate__bare { width: 26px; height: 26px; }
    .sc-audit.is-medium .md-icontile__box { width: 48px; height: 48px; }
    .sc-audit.is-medium .sc-glyph { width: 26px; height: 26px; }

    /* Avatar: surface, shape, status and the working treatment.
       The human avatar in the handover state is a NEUTRAL CIRCLE —
       which is why an agent drawn neutral-and-circular with no
       disclosure trips the quality check. */
    .md-agentav { position: relative; }
    .md-agentav--neutral {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-agentav--tonal {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .md-agentav--rounded { border-radius: var(--md-sys-shape-corner-medium, 12px); }
    .md-agentav__dot {
      position: absolute; right: -1px; bottom: -1px;
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--surface);
    }
    .md-agentav__dot--ready { background: var(--mx-color-success, #086C36); }
    .md-agentav__dot--work  { background: var(--md-sys-color-primary); }
    .md-agentav__dot--off   { background: var(--md-sys-color-outline); }
    /* Three treatments for the same wait. A ring that travels, a
       breath, or nothing but the line of text beside it. */
    .md-agentav--work-ring::after {
      content: ''; position: absolute; inset: -3px; border-radius: inherit;
      border: 2px solid var(--md-sys-color-primary); border-top-color: transparent;
      animation: mdav-spin 900ms linear infinite;
    }
    .md-agentav--work-pulse { animation: mdav-pulse 1400ms ease-in-out infinite; }
    .md-agentav--work-minimal { opacity: 0.75; }
    @keyframes mdav-spin { to { transform: rotate(360deg); } }
    @keyframes mdav-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      .md-agentav--work-ring::after { animation: none; }
      .md-agentav--work-pulse { animation: none; }
    }

    /* Agent Limits: the standing line stops being a control when
       the limits are no longer reopenable — and it should stop
       looking like one too. */
    .md-disclaim-line--static { cursor: default; text-decoration: none; opacity: 0.75; }
    .md-disclaim-line--static:hover { background: transparent; }

    /* Templates: a locked assembly loses its caret, because the
       caret is the promise that this is still yours to change. */
    .pv-composer__value.is-locked { opacity: 0.7; }
