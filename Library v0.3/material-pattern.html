    .md-hw__acts { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 4px; }
    .md-hw__err { flex: 1 1 100%; display: flex; align-items: center; gap: 8px; margin: 0; color: var(--md-sys-color-error); font: 500 13px/18px var(--md-ref-typeface-plain); }
    .md-hw__err .mi { width: 18px; height: 18px; fill: currentColor; }
    .ax__hwink { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 2px 0 10px; border-radius: 8px;

      .ax__vline { font-size: 11.5px; }
    }

    /* A SMALL flex-basis, deliberately. Flexbox decides where to
       wrap from the hypothetical size, not the shrunk one, so a
       180px basis here pushed the send button onto a second row
       the moment the dock got narrower than the controls plus that
       number — the field itself would have shrunk quite happily.
       min-width:0 lets it take whatever is actually left. */
    .ax__field {
      flex: 1 1 60px; min-width: 0; border: 0; outline: none; background: transparent;
      font: inherit; font-size: 14.5px; color: var(--md-sys-color-on-surface);
      /* A textarea, sized by its content rather than by the row it
         sits in. `field-sizing` does this natively where it is
         supported; the height is also set in script so the result
         is the same everywhere. */
      resize: none; overflow-y: auto; line-height: 1.45;
      padding: 0; margin: 0; max-height: 72px;
      field-sizing: content;
      scrollbar-width: thin;
    }
    /* A textarea wraps its placeholder; an <input> never did. So a
       composer whose prompt is a few words longer than the dock
       started life two rows tall and empty. The placeholder is
       held to one line and truncated; the FIELD still grows, which
       is the part that was wanted. */
    .ax__field::placeholder {
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ax__field:disabled { color: var(--md-sys-color-on-surface-variant); }
    .ax__mode {
      display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
      padding: 6px 12px; cursor: pointer; font: inherit; font-size: 12.5px;
      border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 90%, transparent);
      border-radius: var(--md-sys-shape-corner-full);
      background: transparent; color: var(--md-sys-color-on-surface-variant);
      transition: background 160ms var(--md-sys-motion-easing-standard);
    }
    .ax__mode:hover { background: var(--md-sys-color-surface-container-high); }
    .ax__mode[aria-pressed="true"] {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container); border-color: transparent;
    }
    /* The + menu and the mode menu share one surface. */
    .ax__menu {
      position: absolute; bottom: calc(100% + 10px); z-index: 6;
      min-width: 208px; padding: 6px;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-lowest);
      box-shadow: 0 2px 6px rgba(16, 14, 24, .08), 0 18px 44px -22px rgba(16, 14, 24, .6);
      animation: ax-menu 200ms var(--md-sys-motion-easing-emphasized) both;
    }
    /* ── The effort slider ─────────────────────────────────
       Effort is ORDINAL, and a column of radios says nothing
       about that ordering. A track with named ends says it in
       the shape of the control: you can see that moving right
       costs time before you read a word. Built on M3 slider
       geometry — thick track, pill handle — not on the palette
       it was borrowed from. */
    .ax__menu--effort {
      right: 52px; left: auto;
      width: 252px; padding: 12px 14px 12px;
    }
    /* The effort screen is a breadcrumb and the slider, nothing
       else (user wireframe). The breadcrumb is the kit's Small text
       button with a leading back chevron: the model in on-surface,
       the effort value beside it in primary, so it reads as where
       you are and what that model is carrying. It sits flush with
       the panel's left edge, the chevron standing in for padding. */
    .md-mle__crumb {
      margin: 0 0 8px -8px; padding: 0 12px 0 8px; gap: 4px;
    }
    .md-mle__crumb-ico { display: inline-grid; place-items: center; width: 20px; height: 20px;
      color: var(--md-sys-color-on-surface); }
    .md-mle__crumb-m { color: var(--md-sys-color-on-surface); margin-left: 2px; }
    .md-mle__crumb-v { color: var(--md-sys-color-primary); font-weight: 400; margin-left: 4px; }
    /* M3 Expressive slider, small: a 24px track split in two by
       a 4px handle standing in a 6px gap. Outer corners are the
       small size's 8px radius, inner corners — where each half
       meets the gap — are tight. The handle is 36px rather than
       the kit's 44px, by request: 6px proud of the track each side
       reads as a marker rather than a post. The container itself paints nothing;
       the two halves do. */
    .md-mle__track {
      position: relative; height: 24px; margin: 6px 0;
      cursor: pointer; touch-action: none; user-select: none;
      border-radius: 8px;
    }
    .md-mle__track:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 8px;
    }
    /* The active track stops short of the handle. That gap is M3
       Expressive's own slider anatomy, and it is what keeps the
       handle from disappearing into the fill — a primary handle
       on a primary track would otherwise vanish. */
    .md-mle__fill, .md-mle__rest {
      position: absolute; top: 0; bottom: 0;
      transition: width var(--md-sys-motion-duration-short4, 220ms)
                  var(--md-sys-motion-easing-emphasized),
                  left var(--md-sys-motion-duration-short4, 220ms)
                  var(--md-sys-motion-easing-emphasized),
                  background-color 260ms var(--md-sys-motion-easing-standard);
    }
    /* Below the top step the fill is a lighter tone — primary
       let down into primary-container — so Max, the one with a
       real cost attached, is the step that lands at full
       strength. The handle stays full primary on every step: it
       is the marker, and the gap keeps it clear of the fill. */
    .md-mle__fill {
      left: 0; width: var(--mle-fill);
      border-radius: 8px 2px 2px 8px;
      background: color-mix(in srgb, var(--md-sys-color-primary) 55%,
                            var(--md-sys-color-primary-container));
    }
    .md-mle__rest {
      left: var(--mle-rest); right: 0;
      border-radius: 2px 8px 8px 2px;
      background: var(--md-sys-color-secondary-container);
    }
    /* The notches are pressable but silent: the slider above
       already carries the value, and a slider that is also six
       buttons is two controls wearing one coat. */
    .md-mle__dot {
      position: absolute; top: 50%; width: 16px; height: 16px;
      margin: -8px 0 0 -8px; padding: 0; border: 0; border-radius: 50%;
      background: transparent; cursor: pointer;
    }
    .md-mle__dot::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;
      background: var(--md-sys-color-on-secondary-container);
    }
    .md-mle__dot.is-on::after { background: var(--md-sys-color-secondary-container); }
    .md-mle__dot.is-at::after { display: none; }
    .md-mle__thumb {
      position: absolute; top: -6px; left: var(--mle-x);
      width: 2px; height: 36px; margin-left: -1px; border-radius: 1px;
      background: var(--md-sys-color-primary);
      transition: left var(--md-sys-motion-duration-short4, 220ms)
                  var(--md-sys-motion-easing-emphasized),
                  width 120ms var(--md-sys-motion-easing-standard),
                  margin-left 120ms var(--md-sys-motion-easing-standard);
    }
    /* The handle rests thin (2px) and thickens to 4px when a
       pointer is over the slider or it has keyboard focus — the
       cue that it can be taken. While pressed it drops back to the
       thin resting width, so the value under it stays visible
       during a drag. The tracks do not move: the 6px gap is sized
       for the thick handle, so at rest there is 7px either side.
       Hover is gated to real hover devices, so a tap does not
       leave the handle stuck thick on touch screens. */
    @media (hover: hover) {
      .md-mle__track:hover .md-mle__thumb { width: 4px; margin-left: -2px; border-radius: 2px; }
    }
    .md-mle__track:focus-visible .md-mle__thumb { width: 4px; margin-left: -2px; border-radius: 2px; }
    /* .is-pressed, not only :active: a press that moves the handle
       repaints the slider, and the new node is never :active. The
       component carries the press across the repaint. */
    .md-mle__track:active .md-mle__thumb,
    .md-mle__track.is-pressed .md-mle__thumb { width: 2px; margin-left: -1px; border-radius: 1px; }

    /* The sparks rise OUT of the track, so the canvas reaches
       above it. It sits under the handle and the notches — the
       control stays legible, the motion happens behind it — and
       it never takes a pointer event, because the whole strip is
       still the slider. */
    .md-mle__sparks {
      position: absolute; left: 0; right: 0; bottom: 0; top: -20px;
      width: 100%; height: calc(100% + 20px);
      pointer-events: none; z-index: 0;
    }
    .md-mle__dot, .md-mle__thumb { z-index: 1; }

    /* At the top notch light moves through the fill. Two soft
       bands of light purple drift along it at different speeds
       and in opposite directions, so the glow swells and thins
       instead of repeating in lockstep. There are no edges: each
       band is a gradient that starts and ends fully transparent,
       so it melts into the primary fill rather than sitting on
       it. Like the sparks, it exists only at Max — the motion
       marks the most expensive setting rather than decorating
       every setting. The bands sway back and forth on an eased
       alternate rather than looping, so there is no seam to jump. */
    /* Max is the brightest step: full primary, against the
       lighter tone every other step uses, with the glow and the
       sparks moving over it. The glow is kept faint enough that
       its average never falls back to the lighter steps' tone —
       the most expensive setting must never look like the least. */
    .md-mle[data-top="true"] .md-mle__fill {
      overflow: hidden;
      background: var(--md-sys-color-primary);
    }
    .md-mle[data-top="true"] .md-mle__fill::before,
    .md-mle[data-top="true"] .md-mle__fill::after {
      --mle-glow: color-mix(in srgb, var(--md-sys-color-primary) 40%,
                            var(--md-sys-color-primary-container));
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(90deg,
        transparent 0%, var(--mle-glow) 22%, transparent 50%,
        var(--mle-glow) 72%, transparent 100%);
      background-size: 200% 100%;
      background-repeat: repeat-x;
      animation: mle-wave 7s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .md-mle[data-top="true"] .md-mle__fill::before { opacity: .34; }
    .md-mle[data-top="true"] .md-mle__fill::after {
      opacity: .15; background-size: 320% 100%;
      animation-duration: 11s; animation-direction: alternate-reverse;
    }
    @keyframes mle-wave {
      from { background-position: 0% 0; }
      to   { background-position: 100% 0; }
    }

    /* The composer's model-and-effort action is ONE kit Small text
       button (.md-button.md-button--small in material-components.css)
       reading "Balanced High" (user wireframe). Size, type, state
       layers, focus ring and the pressed shape all come from the
       component; nothing here restyles it. The one addition is the
       open state, which the kit leaves to the host: while either
       screen of its flyout is open the chip holds the pressed
       layer, so it is clear which control the flyout belongs to. */
    .ax__mode--model[aria-expanded="true"]::before {
      opacity: var(--md-sys-state-pressed-opacity);
    }
    /* The chip's inner parts predate the kit button and are shared
       with the generic mode chip, which stays as it was; inside a
       kit button they take the kit's 20dp icon at full strength and
       the button's own label colour and weight. */
    .md-button--small .ax__mode__ico,
    .md-button--small .ax__mode__c {
      display: inline-grid; place-items: center;
      width: 20px; height: 20px; opacity: 1;
    }
    .md-button--small .ax__mode__ico svg,
    .md-button--small .ax__mode__c svg {
      width: 20px; height: 20px; fill: currentColor; stroke: none;
    }
    .md-button--small .ax__mode__m { color: inherit; font-weight: inherit; }
    /* The effort value beside the model name: same primary, the
       regular weight, so the chip reads as a name and a value. */
    .md-button--small .ax__mode__v { font-weight: 400; }

    /* Model names a host passes in can be long — a real identifier
       easily runs past 25 characters, and "Deep reasoning" is 14 —
       and the chip must not push the field out of
       the composer to show all of them. It truncates; the full
       name is in the accessible label and one row away in the
       menu. Below the field's own minimum it gives up more. */
    .ax__mode--model .ax__mode__m {
      display: inline-block; max-width: 22ch;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      vertical-align: bottom;
    }
    @container dock (max-width: 460px) {
      .ax__mode--model .ax__mode__m { max-width: 12ch; }
    }
    @media (max-width: 520px) {
      .ax__mode--model .ax__mode__m { max-width: 11ch; }
    }

    @media (prefers-reduced-motion: reduce) {
      .md-mle__fill, .md-mle__rest, .md-mle__thumb { transition: none; }
      /* The swell stays as a still shape, so Max still looks
         different; it just does not roll. */
      .md-mle[data-top="true"] .md-mle__fill::before,
      .md-mle[data-top="true"] .md-mle__fill::after { animation: none; }
    }

    .ax__menu--plus { left: 4px; }
    .ax__menu--mode { right: 52px; }
    @keyframes ax-menu {
      from { opacity: 0; transform: translateY(6px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    .ax__mitem {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 11px; border: 0; text-align: left; cursor: pointer;
      border-radius: var(--md-sys-shape-corner-small);
      background: transparent; font: inherit; font-size: 13px;
      color: var(--md-sys-color-on-surface);
    }
    .ax__mitem:hover { background: var(--md-sys-color-surface-container-high); }
    /* A row that owns a second level says so with a chevron, and
       keeps its highlight while that level is open — otherwise the
       submenu looks like it belongs to nothing. */
    .ax__mitem--sub { justify-content: space-between; }
    .ax__mitem--sub[aria-expanded="true"] {
      background: var(--md-sys-color-surface-container-high);
    }
    .ax__mchev { width: 16px; height: 16px; flex: 0 0 auto; margin-left: auto;
      color: var(--md-sys-color-on-surface-variant); }
    /* The second level, anchored to the first rather than to the
       composer, so it stays beside its row whatever width the
       first level turns out to be. Bottom-aligned because these
       menus open upward. */
    .ax__submenu {
      position: absolute; left: calc(100% + 2px); bottom: 0; z-index: 7;
      min-width: 290px; max-width: 320px; padding: 6px;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-lowest);
      box-shadow: 0 2px 6px rgba(16, 14, 24, .08), 0 18px 44px -22px rgba(16, 14, 24, .6);
      animation: ax-sub 200ms var(--md-sys-motion-easing-emphasized) both;
    }
    @keyframes ax-sub {
      from { opacity: 0; transform: translateX(-6px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    /* Inside a flyout the list is furniture, not a card: it drops
       its own outline so there is one border, not two. */
    .ax__submenu .md-conn-list-wrap,
    .ax__submenu .md-conn-list { border: 0; background: transparent; }
    @media (prefers-reduced-motion: reduce) {
      .ax__submenu { animation: none; }
    }
    .ax__mitem small { margin-left: auto; color: var(--md-sys-color-on-surface-variant); font-size: 11px; }
    /* What the composer is doing, in words, under the capsule. */
    .ax__cnote {
      position: relative; z-index: 1;
      margin: 9px 4px 0; font-size: 11.5px; line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant);
    }
    .ax__chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 0 0 auto; }
    .ax__chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 9px; border: 0; cursor: pointer; font: inherit; font-size: 12px;
      border-radius: var(--md-sys-shape-corner-small);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      animation: ax-menu var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing) both;
    }

    /* ── Focus, everywhere ────────────────────────────────── */
    .ax button:focus-visible, .ax input:focus-visible, .ax [tabindex]:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }

    /* ── Tablet: the navigation becomes a rail ────────────── */
    @media (max-width: 900px) {
      .ax { --ax-nav: 60px; }
      .ax__nav { padding: 14px 8px; align-items: center; }
      .ax__brand span:last-child, .ax__item span:not(.ax__dot),
      .ax__group, .ax__new span, .ax__foot { display: none; }
      .ax__new { justify-content: center; padding: 10px; }
      .ax__item { justify-content: center; padding: 9px; }
      .ax__canvas, .ax__head, .ax__dock { padding-left: 16px; padding-right: 16px; }
    }
    /* ── Mobile: the navigation becomes a disclosure ──────── */
    @media (max-width: 640px) {
      .ax { grid-template-columns: 1fr; }
      .ax__nav {
        flex-direction: row; align-items: center; gap: 6px;
        overflow-x: auto; padding: 10px 12px;
        border-right: 0;
        border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
      }
      .ax__nav[data-open="false"] .ax__item, .ax__nav[data-open="false"] .ax__group { display: none; }
      .ax__navtoggle { display: inline-flex; }
      /* In a row the full-width pill stretches to fill the strip.
         Here it is one control among several, not the header of a
         column, so it sizes to itself. */
      .ax__new { width: auto; flex: 0 0 auto; margin-bottom: 0; }
      .ax__brand { padding: 0 4px 0 2px; }
      .ax__item { flex: 0 0 auto; }
      .ax__spacer { display: none; }
      .ax__composer { border-radius: 22px; }
      /* The generic mode chip goes; the MODEL and EFFORT chips
         stay. For every other pattern that chip is a convenience,
         but for Model Selection it is the resting state — hiding
         it on a phone means the one thing the pattern promises to
         keep visible is the first thing to disappear. They wrap
         to their own line instead, which the composer already
         supports. */
      .ax__mode:not(.ax__mode--model):not(.ax__mode--effort) { display: none; }
      .ax__mode--model .ax__mode__m { max-width: 14ch; }
      /* The field takes the whole first line and the controls sit
         under it, rather than three things fighting over one row
         and the prompt losing. */
      .ax__composer .ax__field { flex: 1 1 100%; order: -1; }
      /* …and, as in the Initial CTA's large size, the right-hand
         group (model, microphone, send) sits right. */
      .ax__composer .ax__field + * { margin-left: auto; }
    }

    /* ── Reduced motion ───────────────────────────────────────
       The atmosphere stops entirely. It does not slow down: a
       slow drift is still drift, and this is exactly the kind of
       ambient movement the setting exists to remove. The phase
       still changes the fields' opacity, because that is state
       rather than animation. */
    @media (prefers-reduced-motion: reduce) {
      .ax__aura i { animation: none !important; transform: none !important; }
      .ax__composer, .ax__cbtn, .ax__item, .ax__new, .ax__menu, .ax__chip {
        transition: none; animation: none;
      }
    }

    .wf-hint { margin-top: 12px; }
    .wf-sim { opacity: 0.72; }

    @media (max-width: 760px) {
      .app--wf { grid-template-columns: 1fr; }
      .app--wf .app__rail { display: none; }
      .wf-who { display: none; }
      .app--wf .app__pill { margin-left: auto; }
    }


    /* ════════════════════════════════════════════════════════════
       TRY IT — the interactive scene

       Back to the original surface: a plain white card with its own
       title bar, a gradient greeting, and a simple pill composer.

       The gradient is the DEMO PRODUCT's brand, not Material's and
       not Nucleux's — a stand-in for whatever assistant you are
       putting these patterns into. It is confined to the greeting,
       the agent mark and the send button, so it never touches a
       control that carries meaning.
       ════════════════════════════════════════════════════════════ */
    .demo {
      --demo-g1: #4285F4;
      --demo-g2: #9B72CB;
      --demo-g3: #D96570;
      --demo-ink: #1f1f1f;
      --demo-dim: #5f6368;
      --demo-line: #e3e3e3;
      /* The composer's state layer. Neutral near-black rather than
         `currentColor`: the icons are already a mid grey, and a layer
         tinted from them landed almost invisible. M3's own on-surface
         state layer is what this is, spelled out. */
      --gc-state: #1f1f1f;

      border-radius: 20px;
      border: 1px solid var(--demo-line);
      background: #ffffff;
      overflow: hidden;
      font-family: var(--md-ref-typeface-plain);
      display: flex; flex-direction: column;
      min-height: 480px;
    }

    .demo__bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--demo-line);
    }
    .demo__mark {
      width: 22px; height: 22px; border-radius: 50%;
      background: conic-gradient(from 200deg, var(--demo-g1), var(--demo-g2), var(--demo-g3), var(--demo-g1));
    }
    .demo__name { font-size: 14px; font-weight: 600; color: var(--demo-ink); }
    /* Start over — an M3 text button: no fill, no outline, just the
       label and its state layer. It is the lowest-emphasis action on
       the surface and should read that way; a filled or tonal pill
       here competed with the composer's send for attention. Sized
       down to 32dp with label-medium, since it is chrome, not a
       control anyone came here to press. */
    .demo__reset {
      position: relative;
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: transparent;
      color: var(--md-sys-color-on-surface);
      font-family: var(--md-ref-typeface-plain);
      font-size: var(--md-sys-typescale-label-medium-size);
      line-height: var(--md-sys-typescale-label-medium-line);
      font-weight: var(--md-sys-typescale-label-medium-weight);
      letter-spacing: var(--md-sys-typescale-label-medium-tracking);
      cursor: pointer;
    }
    /* M3 state layer: currentColor at the token opacity on a ::before,
       rather than swapping in a second hand-picked background. */
    .demo__reset::before {
      content: ""; position: absolute; inset: 0;
      border-radius: inherit; background: currentColor; opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .demo__reset:hover::before  { opacity: var(--md-sys-state-hover-opacity); }
    .demo__reset:active::before { opacity: var(--md-sys-state-pressed-opacity); }
    .demo__reset:focus-visible  { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }
    .demo__reset-ico {
      position: relative;
      width: 15px; height: 15px; flex: 0 0 auto;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .demo__scroll {
      flex: 1 1 auto; padding: 26px 24px;
      display: flex; flex-direction: column; gap: 18px;
      overflow-y: auto; max-height: 460px;
    }

    /* ── Greeting ─────────────────────────────────────────── */
    .demo__hello {
      font-size: 30px; line-height: 1.2; font-weight: 500;
      letter-spacing: -0.01em;
      background: linear-gradient(90deg, var(--demo-g1), var(--demo-g2) 45%, var(--demo-g3));
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      /* background-clip must be re-declared after any `background`
         shorthand or the gradient paints as a filled block. */
      padding-bottom: 0.08em; margin: 0 0 -0.08em;
    }

    .demo__chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
    .demo__chip {
      text-align: left; max-width: 240px;
      padding: 14px 16px; border-radius: 14px;
      border: 1px solid var(--demo-line); background: #fbfbfb;
      font: inherit; font-size: 13px; line-height: 1.45; color: var(--demo-ink);
      cursor: pointer;
      transition: border-color 200ms ease, background 200ms ease;
    }
    .demo__chip:hover { background: #f4f6fb; border-color: #c9d3ea; }

    /* ── Composer ─────────────────────────────────────────────
       The Gemini prompt composer, sitting in this card. Its
       arrangement is Gemini's — leading add button, glyph, field,
       mode selector, then mic OR send — and every value it resolves
       is an M3 token: corner-full on the pill, corner-extra-small
       on the menu, label-large on the mode button, primary on the
       send fill, the kit's elevations, and M3's own state-layer
       opacities rather than hand-mixed hovers.

       States, all reachable: rest · hover · focus · typing ·
       sending · disabled, plus the mode menu open. Each is
       documented beside the rule that produces it. */
    .gc {
      position: relative;
      display: flex; align-items: center; gap: 4px;
      margin: 0 18px 18px;
      padding: 6px 8px 6px 6px;
      border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid var(--demo-line);
      background: #ffffff;
      transition: box-shadow var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    /* hover → elevation 1, focus → elevation 2. Gemini raises the
       composer rather than outlining it. */
    .gc:hover { box-shadow: var(--md-sys-elevation-1); }
    .gc:focus-within { box-shadow: var(--md-sys-elevation-2); }
    .gc.is-disabled { opacity: var(--md-sys-state-disabled-content); pointer-events: none; }

    /* Icon button — 40dp target, full corner, M3 state layer on a
       ::before rather than a background swap, so the layer opacity is
       the token value and not a hand-mixed colour. */
    .gc__icon {
      position: relative; flex: 0 0 auto;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: transparent; cursor: pointer; padding: 0;
      color: var(--demo-dim);
    }
    .gc__icon::before {
      content: ""; position: absolute; inset: 0;
      border-radius: inherit; background: var(--gc-state); opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .gc__icon:hover::before  { opacity: var(--md-sys-state-hover-opacity); }
    .gc__icon:active::before { opacity: var(--md-sys-state-pressed-opacity); }
    .gc__icon:focus-visible  { outline: 2px solid var(--md-sys-color-primary); outline-offset: 1px; }
    .gc__icon svg {
      width: 22px; height: 22px; position: relative;
      fill: none; stroke: currentColor; stroke-width: 1.9;
      stroke-linecap: round; stroke-linejoin: round;
    }
    /* `display: grid` on these buttons outranks the UA sheet's
       [hidden] { display: none }, so hiding them by attribute silently
       does nothing — the mic and send both render at once. Restate it
       at author level. */
    .gc__icon[hidden], .gc__send[hidden] { display: none; }

    .gc__field {
      flex: 1 1 auto; min-width: 0;
      display: flex; align-items: center; gap: 8px;
      padding-left: 4px;
    }
    .gc__glyph {
      flex: 0 0 auto; width: 16px; height: 16px;
      fill: none; stroke: var(--demo-dim); stroke-width: 1.6;
      stroke-linejoin: round;
    }
    .gc__input {
      flex: 1 1 auto; min-width: 0;
      border: 0; background: transparent; outline: none;
      font-family: var(--md-ref-typeface-plain);
      font-size: var(--md-sys-typescale-body-large-size);
      line-height: var(--md-sys-typescale-body-large-line);
      letter-spacing: 0;
      color: var(--demo-ink);
      padding: 10px 0;
    }
    .gc__input::placeholder { color: var(--demo-dim); }

    /* Mode selector — a text button in label-large that opens an M3
       menu. The "Thinking ⌄" control. */
    .gc__mode {
      position: relative; flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 4px;
      height: 36px; padding: 0 8px 0 12px;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: transparent; cursor: pointer;
      font-family: var(--md-ref-typeface-plain);
      font-size: var(--md-sys-typescale-label-large-size);
      line-height: var(--md-sys-typescale-label-large-line);
      font-weight: var(--md-sys-typescale-label-large-weight);
      letter-spacing: var(--md-sys-typescale-label-large-tracking);
      color: var(--demo-ink);
    }
    .gc__mode::before {
      content: ""; position: absolute; inset: 0;
      border-radius: inherit; background: var(--gc-state); opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .gc__mode:hover::before { opacity: var(--md-sys-state-hover-opacity); }
    .gc__mode[aria-expanded="true"]::before { opacity: var(--md-sys-state-focus-opacity); }
    .gc__mode svg {
      width: 18px; height: 18px; position: relative;
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
      transition: transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .gc__mode[aria-expanded="true"] svg { transform: rotate(180deg); }

    /* ── Add menu ─────────────────────────────────────────────
       Two groups split by a rule: what you bring IN above, what the
       agent MAKES below. Anchored above the + it belongs to, which
       is why it is left-aligned to the composer rather than centred.

       Corner-large and elevation-3, not the mode selector's
       extra-small — this is a bigger surface carrying icons and two
       sections, and M3 scales corner radius with the size of the
       thing it is rounding. */
    .gc-add {
      position: absolute; left: 0; bottom: calc(100% + 10px);
      min-width: 268px; padding: 8px 0;
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--md-sys-color-surface-container-lowest);
      box-shadow: var(--md-sys-elevation-3);
      z-index: 6;
    }
    /* 2px between rows, not the 11px of a standard M3 menu: this list
       is nine items long and the reference sets it tight. The rows
       keep 32px of height so they are still a real target. */
    .gc-add__group {
      padding: 4px 0;
      display: flex; flex-direction: column; gap: 2px;
    }
    .gc-add__rule {
      height: 1px; margin: 4px 16px;
      background: var(--md-sys-color-outline-variant);
    }
    .gc-add__item {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      min-height: 32px;
      width: 100%; padding: 6px 16px;
      border: 0; background: transparent; cursor: pointer; text-align: left;
      font-family: var(--md-ref-typeface-plain);
      font-size: var(--md-sys-typescale-body-medium-size);
      line-height: var(--md-sys-typescale-body-medium-line);
      letter-spacing: 0;
      color: var(--md-sys-color-on-surface);
    }
    .gc-add__item::before {
      content: ""; position: absolute; inset: 0;
      background: var(--gc-state); opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .gc-add__item:hover::before  { opacity: var(--md-sys-state-hover-opacity); }
    .gc-add__item:active::before { opacity: var(--md-sys-state-pressed-opacity); }
    .gc-add__item:focus-visible  { outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px; }
    .gc-add__ico {
      position: relative; flex: 0 0 auto; width: 20px; height: 20px;
      fill: none; stroke: var(--md-sys-color-on-surface); stroke-width: 1.6;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .gc-add__label { position: relative; flex: 1 1 auto; }
    .gc-add__more {
      position: relative; flex: 0 0 auto; width: 18px; height: 18px;
      fill: none; stroke: var(--md-sys-color-on-surface-variant); stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* Open state: the + spins into a cross and the button fills, so
       the control that opened the menu is visibly the one that shuts
       it. 135deg rather than 45 — the extra half-turn reads as a
       deliberate spin instead of a jump to the nearest equivalent
       angle, and it lands on exactly the same cross either way. */
    .gc__addico {
      transition: transform 320ms var(--md-sys-motion-easing-emphasized);
    }
    .gc__icon.is-open .gc__addico { transform: rotate(135deg); }
    .gc__icon.is-open::before { opacity: var(--md-sys-state-focus-opacity); }

    /* M3 menu — surface-container, extra-small corner, elevation 2. */
    .gc__menu {
      position: absolute; right: 56px; bottom: calc(100% + 8px);
      min-width: 216px; padding: 8px 0;
      border-radius: var(--md-sys-shape-corner-extra-small);
      background: var(--md-sys-color-surface-container);
      box-shadow: var(--md-sys-elevation-2);
      z-index: 5;
    }
    .gc__menu-item {
      display: flex; align-items: flex-start; gap: 12px;
      width: 100%; padding: 10px 16px;
      border: 0; background: transparent; cursor: pointer; text-align: left;
      font-family: var(--md-ref-typeface-plain);
      color: var(--md-sys-color-on-surface);
    }
    .gc__menu-item:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface)
                  calc(var(--md-sys-state-hover-opacity) * 100%), transparent);
    }
    .gc__menu-item[aria-checked="true"] { font-weight: 500; }
    .gc__menu-check { width: 18px; flex: 0 0 auto; color: var(--md-sys-color-primary); }
    .gc__menu-t { font-size: var(--md-sys-typescale-label-large-size); }
    .gc__menu-d {
      display: block; margin-top: 2px;
      font-size: var(--md-sys-typescale-body-small-size);
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Send — hidden until there is text. That swap with the mic is the
       composer's most characteristic state change, and the one place
       the brand gradient appears on a control. */
    .gc__send {
      position: relative;
      flex: 0 0 auto;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border: 0; border-radius: var(--md-sys-shape-corner-full);
      background: linear-gradient(135deg, var(--demo-g1), var(--demo-g2));
      cursor: pointer; padding: 0;
      transition: transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    /* The send button had no hover at all — the one control on the
       composer you are most likely to point at. Same neutral layer as
       its neighbours, which on a filled button reads as a darken. */
    .gc__send::before {
      content: ""; position: absolute; inset: 0;
      border-radius: inherit; background: var(--gc-state); opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .gc__send:hover::before  { opacity: var(--md-sys-state-hover-opacity); }
    .gc__send:active::before { opacity: var(--md-sys-state-pressed-opacity); }
    .gc__send svg { position: relative; width: 18px; height: 18px; fill: #fff; }
    .gc__send:active { transform: scale(0.94); }
    .gc__send:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }
    /* sending → the send affordance becomes stop, which is the honest
       control while a reply is in flight. */
    .gc__send--stop {
      background: var(--md-sys-color-secondary-container);
    }
    .gc__send--stop svg { fill: var(--md-sys-color-on-secondary-container); }

    /* ── Turns ────────────────────────────────────────────── */
    .demo__turn { display: flex; gap: 14px; align-items: flex-start; }
    .demo__turn--user { justify-content: flex-end; }
    .demo__bubble {
      max-width: 74%;
      padding: 12px 16px; border-radius: 18px 18px 4px 18px;
      background: #f0f4f9; color: var(--demo-ink);
      font-size: 14px; line-height: 20px;
    }
    .demo__av {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
      background: conic-gradient(from 200deg, var(--demo-g1), var(--demo-g2), var(--demo-g3), var(--demo-g1));
      display: grid; place-items: center;
    }
    .demo__av svg { fill: #fff; }
    /* Unlabelled agent avatar — flat grey, no gradient, no mark. What
       an unmarked turn actually looks like next to a human one. */
    .demo__av--plain {
      background: #dfe1e5; color: #3c4043;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 500;
    }
    .demo__agent { min-width: 0; flex: 1 1 auto; }
    .demo__agent-head {
      display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .demo__agent-name { font-size: 14px; font-weight: 600; color: var(--demo-ink); }
    .demo__text {
      margin: 0; font-size: 14px; line-height: 22px; color: #3c4043; max-width: 58ch;
    }
    .demo__text b { color: var(--demo-ink); font-weight: 600; }

    /* Thinking — a rise-and-settle, never a constant spin: a constant
       spin says "busy" and tells you nothing about progress. */
    /* The dots are targeted by CLASS, not `.demo__thinking span`.
       That descendant selector also matched the label — which is a
       span — so the label inherited the dot's size, background and
       pulse animation, and sat translating under the dots. Hence the
       overlap and the flicker. */
    .demo__thinking { display: flex; align-items: center; gap: 5px; }
    .demo__dot {
      flex: 0 0 auto;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--demo-g2);
      animation: demo-pulse 1.3s ease-in-out infinite;
    }
    .demo__dot:nth-child(2) { animation-delay: 0.16s; }
    .demo__dot:nth-child(3) { animation-delay: 0.32s; }
    .demo__thinking-label {
      margin-left: 8px;
      font-size: 13px; line-height: 20px; color: var(--demo-dim);
      white-space: nowrap;
    }
    @keyframes demo-pulse {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50%      { opacity: 1;    transform: translateY(-2px); }
    }

    .demo__enter { animation: demo-rise var(--mx-motion-slow-duration) var(--mx-motion-slow-in) both; }
    @keyframes demo-rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Hint ─────────────────────────────────────────────── */
    .demo__hintbar {
      margin: 0 18px 16px; padding: 11px 14px;
      border-radius: 10px;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12px; line-height: 1.55;
    }
    .demo__hintbar b { color: var(--md-sys-color-on-surface); font-weight: 600; }
    .demo__hintbar-sim { opacity: 0.7; }

    @media (prefers-reduced-motion: reduce) {
      .demo__dot { animation: none; opacity: 0.8; }
      .demo__enter { animation: none; }
      .demo__chip, .demo__reset::before { transition: none; }

      /* The composer's own transitions. This list went missing when
         the component layer was pulled into material-components.css,
         so every one of these was still animating under reduced
         motion — including the plus spin. */
      .gc, .gc__icon::before, .gc__mode::before, .gc__send::before,
      .gc-add__item::before, .gc__addico, .gc__mode svg,
      .mp-seg__btn { transition: none; }
      .gc__send:active { transform: none; }
    }

  </style>
