    .md-mcp__cico svg { width: 14px; height: 14px; }

    /* ── Tools ────────────────────────────────────────────── */
    .md-mcp__disc { display: grid; gap: 8px; }
    .md-mcp__dh {
      margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__band { display: grid; gap: 4px; }
    .md-mcp__bt {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin: 6px 0 0;
      font-size: 11.5px; font-weight: 650; color: var(--md-sys-color-on-surface);
    }
    .md-mcp__bn { font-size: 11px; font-weight: 400;
      color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__tools { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }

    .md-mcp__tool {
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-lowest);
      transition: border-color var(--md-sys-motion-duration-short4, 200ms)
                  var(--md-sys-motion-easing-standard);
    }
    /* A disabled tool fades rather than vanishing, so the shape of
       what was declined stays visible. */
    .md-mcp__tool[data-on="false"] { opacity: .55; }
    .md-mcp__trow { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; }
    .md-mcp__tbtn {
      flex: 1 1 auto; display: flex; align-items: center; gap: 8px; min-width: 0;
      padding: 8px; border: 0; border-radius: var(--md-sys-shape-corner-small, 8px);
      background: transparent; font: inherit; text-align: left; cursor: pointer;
    }
    .md-mcp__tbtn:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 5%, transparent);
    }
    .md-mcp__tbtn:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px;
    }
    .md-mcp__tt { display: grid; gap: 2px; flex: 1 1 auto; min-width: 0; }
    .md-mcp__tn {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
      font-size: 12.5px; font-weight: 600; color: var(--md-sys-color-on-surface);
    }
    .md-mcp__tid {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px; font-weight: 400; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__td { font-size: 11.5px; line-height: 1.45;
      color: var(--md-sys-color-on-surface-variant); }
    /* Availability as a WORD first. The icon and the tone repeat
       it; neither one carries it alone. */
    .md-mcp__ta {
      display: inline-flex; align-items: center; gap: 4px; margin-top: 2px;
      font-size: 11px; font-weight: 600; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__ta svg { width: 13px; height: 13px; }
    .md-mcp__ta[data-avail="ok"] { color: var(--mx-color-success, #086C36); }
    .md-mcp__ta[data-avail="asks"] { color: var(--md-sys-color-on-surface); }
    .md-mcp__tchev { flex: 0 0 auto; color: var(--md-sys-color-on-surface-variant);
      transition: transform var(--md-sys-motion-duration-short4, 200ms)
                  var(--md-sys-motion-easing-emphasized); }
    .md-mcp__tchev svg { width: 18px; height: 18px; display: block; }
    .md-mcp__tbtn[aria-expanded="true"] .md-mcp__tchev { transform: rotate(90deg); }

    .md-mcp__tdet {
      display: grid; gap: 2px; padding: 4px 14px 14px;
      animation: mcp-open var(--md-sys-motion-duration-medium1, 250ms)
                 var(--md-sys-motion-easing-emphasized-decelerate,
                     cubic-bezier(0.05, 0.7, 0.1, 1)) both;
    }
    @keyframes mcp-open {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }
    .md-mcp__tdh {
      margin: 8px 0 0; font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__tdb { margin: 0; font-size: 12px; line-height: 1.55;
      color: var(--md-sys-color-on-surface); }

    .md-mcp__kv {
      display: grid; grid-template-columns: auto 1fr; gap: 3px 12px;
      margin: 10px 0 0; font-size: 11.5px;
    }
    .md-mcp__kv dt { color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__kv dd { margin: 0; color: var(--md-sys-color-on-surface); min-width: 0;
      overflow-wrap: anywhere; }
    .md-mcp__kv code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    }

    /* The provenance sentence. A tool list is a claim a stranger
       made about itself, and without this the risk bands read as
       the product's verdict. */
    .md-mcp__trust {
      display: flex; align-items: flex-start; gap: 6px; margin: 4px 0 0;
      font-size: 11px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__trust svg { width: 14px; height: 14px; flex: 0 0 auto; margin-top: 1px; }

    /* ── Technical details ────────────────────────────────── */
    .md-mcp__adv { font-size: 12px; }
    .md-mcp__advs {
      cursor: pointer; font-size: 11.5px; font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__advs:focus-visible { outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px; }

    /* ── The gate ─────────────────────────────────────────── */
    /* A write asks on a tonal ground; only something that cannot be
       undone gets the error container. Both are the same shape and
       the same weight of type — what differs is how loud, and it
       differs for a reason a reader can name. */
    .md-mcp__ask {
      display: grid; gap: 6px; padding: 14px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      animation: mcp-open var(--md-sys-motion-duration-medium2, 300ms)
                 var(--md-sys-motion-easing-emphasized-decelerate,
                     cubic-bezier(0.05, 0.7, 0.1, 1)) both;
    }
    .md-mcp__ask[data-risk="destroy"] {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .md-mcp__askt {
      display: flex; align-items: center; gap: 6px; margin: 0;
      font-size: 13.5px; font-weight: 650;
    }
    .md-mcp__askico svg { width: 16px; height: 16px; display: block; }
    .md-mcp__asks { margin: 0; font-size: 11.5px; font-weight: 600; opacity: .8; }
    .md-mcp__askd { margin: 2px 0 0; font-size: 12.5px; line-height: 1.55; }
    .md-mcp__args {
      display: grid; grid-template-columns: auto 1fr; gap: 3px 12px;
      margin: 8px 0 2px; padding: 10px;
      border-radius: var(--md-sys-shape-corner-small, 8px);
      background: color-mix(in srgb, currentColor 7%, transparent);
      font-size: 11.5px;
    }
    .md-mcp__args dt { font-weight: 600; opacity: .8; }
    .md-mcp__args dd { margin: 0; overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .md-mcp__askf { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .md-mcp__askn { margin: 2px 0 0; font-size: 11px; line-height: 1.45; opacity: .85; }

    /* ── Execution ────────────────────────────────────────── */
    .md-mcp__run {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container);
    }
    .md-mcp__run[data-run="done"] {
      background: color-mix(in srgb, var(--mx-color-success, #086C36) 10%, transparent);
    }
    .md-mcp__rico {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--md-sys-color-outline-variant);
      border-top-color: transparent; color: #fff;
      animation: mcp-spin 900ms linear infinite;
    }
    .md-mcp__rico svg { width: 13px; height: 13px; }
    .md-mcp__run[data-run="done"] .md-mcp__rico,
    .md-mcp__run[data-run="failed"] .md-mcp__rico {
      animation: none; border-color: transparent;
    }
    .md-mcp__run[data-run="done"] .md-mcp__rico {
      background: var(--mx-color-success, #086C36);
    }
    .md-mcp__rt { display: grid; gap: 1px; min-width: 0; }
    .md-mcp__rn { font-size: 12.5px; font-weight: 600;
      color: var(--md-sys-color-on-surface); }
    .md-mcp__rs { font-size: 11.5px; color: var(--md-sys-color-on-surface-variant); }

    /* ── Failure, at two scopes ───────────────────────────── */
    .md-mcp__fail {
      display: grid; gap: 4px; padding: 14px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      animation: mcp-open var(--md-sys-motion-duration-medium1, 250ms)
                 var(--md-sys-motion-easing-standard) both;
    }
    /* A TOOL failure is a note on a working connection: outlined,
       on the ordinary surface, sitting above a tool list that is
       still there. A SERVER failure fills, because the connection
       itself is what is broken. */
    .md-mcp__fail[data-scope="tool"] {
      border: 1px solid var(--md-sys-color-error);
      background: var(--md-sys-color-surface-container-lowest);
      color: var(--md-sys-color-on-surface);
    }
    .md-mcp__fail[data-scope="server"] {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .md-mcp__failt {
      display: flex; align-items: center; gap: 6px; margin: 0;
      font-size: 13.5px; font-weight: 650;
    }
    .md-mcp__fail[data-scope="tool"] .md-mcp__failt { color: var(--md-sys-color-error); }
    .md-mcp__faild { margin: 2px 0 0; font-size: 12.5px; line-height: 1.55; }
    .md-mcp__failn {
      display: flex; align-items: flex-start; gap: 6px; margin: 6px 0 0;
      font-size: 11.5px; line-height: 1.45; opacity: .85;
    }
    .md-mcp__failn svg { width: 14px; height: 14px; flex: 0 0 auto; margin-top: 1px; }
    .md-mcp__kv--fail { padding: 10px; margin-top: 8px;
      border-radius: var(--md-sys-shape-corner-small, 8px);
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 5%, transparent); }
    .md-mcp__failf { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

    .md-mcp__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    /* ── Compact ──────────────────────────────────────────
       Measured against the defaults above, never guessed: panel
       16 gap 12, counts 10, tool row 4/10, detail 4/14/14,
       gate 14, step 8/10. */
    .md-mcp[data-density="compact"] { padding: 12px; gap: 9px; }
    .md-mcp[data-density="compact"] .md-mcp__body { gap: 9px; }
    .md-mcp[data-density="compact"] .md-mcp__counts { padding: 7px; }
    .md-mcp[data-density="compact"] .md-mcp__trow { padding: 2px 8px 2px 2px; }
    .md-mcp[data-density="compact"] .md-mcp__tbtn { padding: 6px; }
    .md-mcp[data-density="compact"] .md-mcp__tdet { padding: 2px 10px 10px; }
    .md-mcp[data-density="compact"] .md-mcp__ask { padding: 11px; }
    .md-mcp[data-density="compact"] .md-mcp__fail { padding: 11px; }
    .md-mcp[data-density="compact"] .md-mcp__step { padding: 5px 8px; }
    .md-mcp[data-density="compact"] .md-mcp__run { padding: 7px 10px; }
    .md-mcp[data-density="compact"] .md-mcp__form { gap: 7px; }

    @media (prefers-reduced-motion: reduce) {
      .md-mcp, .md-mcp__ask, .md-mcp__fail, .md-mcp__tdet { animation: none; }
      .md-mcp__tool, .md-mcp__step, .md-mcp__tchev { transition: none; }
      .md-mcp__step[data-step="now"] .md-mcp__sico,
      .md-mcp__rico, .md-mcp__badge .md-mcp__dot { animation: none; }
    }

    /* ── Knowledge base ────────────────────────────────────
       Persistent curated sources. One surface for all five
       states: what changes is the body, never the frame, because
       a panel that re-draws itself at each stage teaches that
       the stages are unrelated.

       Status is carried three ways at once — the badge's words,
       the SHAPE of its dot (a ring while the base is not usable,
       a filled disc once it is), and the tone. Colour is never
       alone, because "Ready" and "Needs attention" have to be
       distinguishable in greyscale. */
    .md-kb {
      /* The two confirmations sit over the panel rather than
         beside it, so the thing being destroyed stays visible
         while the question is asked. */
      position: relative;
      display: grid; gap: 12px; padding: 16px; width: 100%; max-width: 480px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-lowest, #fff);
      animation: att-in var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing) both;
    }
    .md-kb__body { display: grid; gap: 10px; min-width: 0; }

    /* ── Head ─────────────────────────────────────────────── */
    .md-kb__head { display: flex; align-items: center; gap: 10px; }
    .md-kb__mark {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 34px; height: 34px; border-radius: 10px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .md-kb__id { display: grid; gap: 2px; min-width: 0; flex: 1 1 auto; }
    .md-kb__name {
      font-size: 14px; font-weight: 650; color: var(--md-sys-color-on-surface);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .md-kb__meta {
      font-size: 12px; color: var(--md-sys-color-on-surface-variant);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .md-kb__dash { opacity: .5; }
    .md-kb__statetext {
      flex: 0 0 auto; font-size: 12px; font-weight: 600; white-space: nowrap;
      color: var(--md-sys-color-on-surface-variant);
    }

    .md-kb__badge {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
      height: 24px; padding: 0 10px; border-radius: 999px;
      font-size: 11.5px; font-weight: 600; white-space: nowrap;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }
    /* A ring, not a disc, whenever the agent cannot yet draw on
       this base. The difference survives greyscale. */
    .md-kb__badge .md-kb__dot {
      width: 8px; height: 8px; border-radius: 50%;
      border: 2px solid currentColor; background: transparent;
    }
    /* A FILLED DISC means the agent can draw on this base right
       now. Ready, Answered and a base that looked and found
       nothing are all in that position — it worked, there was
       simply nothing in there. */
    .md-kb__badge[data-state="ready"],
    .md-kb__badge[data-state="answered"],
    .md-kb__badge[data-state="none"] {
      background: color-mix(in srgb, var(--mx-color-success, #086C36) 12%, transparent);
      color: var(--mx-color-success, #086C36);
    }
    .md-kb__badge[data-state="ready"] .md-kb__dot,
    .md-kb__badge[data-state="answered"] .md-kb__dot,
    .md-kb__badge[data-state="none"] .md-kb__dot { background: currentColor; }

    .md-kb__badge[data-state="using"] {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .md-kb__badge[data-state="using"] .md-kb__dot {
      background: currentColor;
      animation: kb-pulse 1400ms var(--md-sys-motion-easing-standard) infinite;
    }

    /* Partly ready keeps the DISC: nine sources answer, so the
       agent can draw on it, and a ring here would say otherwise.
       It is deliberately NOT the error container — the whole
       point of the state is that the base still works — and
       deliberately not tertiary either, which in this palette
       sits close enough to error to be read as one. */
    .md-kb__badge[data-state="partial"] {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    /* A linked file that drifted is the quietest problem here.
       Neutral, because spending a warning colour on it is how
       people learn to ignore warning colours. */
    .md-kb__badge[data-state="stale"] {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }
    .md-kb__badge[data-state="partial"] .md-kb__dot,
    .md-kb__badge[data-state="stale"] .md-kb__dot { background: currentColor; }

    .md-kb__badge[data-state="failed"],
    .md-kb__badge[data-state="unavailable"] {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .md-kb__badge[data-state="uploading"],
    .md-kb__badge[data-state="processing"] {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .md-kb__badge[data-state="uploading"] .md-kb__dot,
    .md-kb__badge[data-state="processing"] .md-kb__dot {
      animation: kb-pulse 1400ms var(--md-sys-motion-easing-standard) infinite;
    }
    /* Switched off: a ring, and the quietest surface on the
       page. It is not broken and it is not working. */
    .md-kb__badge[data-state="inactive"] {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    @keyframes kb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    /* ── Empty ────────────────────────────────────────────── */
    .md-kb__empty { display: grid; gap: 4px; }
    .md-kb__et { margin: 0; font-size: 13px; font-weight: 600;
      color: var(--md-sys-color-on-surface); }
    .md-kb__eb { margin: 0; font-size: 12.5px; line-height: 1.55;
      color: var(--md-sys-color-on-surface-variant); }

    /* ── Where it applies ─────────────────────────────────
       A different promise from "available everywhere", and only
       one of the two is usually true. */
    .md-kb__scope {
      display: flex; align-items: flex-start; gap: 6px; margin: 0;
      font-size: 11.5px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant);
    }
    .md-kb__scope svg { width: 14px; height: 14px; flex: 0 0 auto; margin-top: 1px; }

    /* ── In use ───────────────────────────────────────────
       The state products collapse into Ready. It is a line, not
       a panel: the agent is working, not filing a report. */
    .md-kb__active {
      display: flex; align-items: center; gap: 8px; margin: 0;
      padding: 9px 11px; border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 12.5px; font-weight: 550;
    }
    .md-kb__activedot {
      width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
      background: currentColor;
      animation: kb-pulse 1200ms var(--md-sys-motion-easing-standard) infinite;
    }

    /* ── One source that needs a person ──────────────────── */
    .md-kb__trouble {
      display: flex; align-items: flex-start; gap: 6px; margin: 0;
      padding: 10px 12px; border-radius: var(--md-sys-shape-corner-medium, 12px);
      border: 1px solid var(--md-sys-color-error);
      font-size: 12.5px; line-height: 1.5; color: var(--md-sys-color-on-surface);
    }
    .md-kb__trouble svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px;
      color: var(--md-sys-color-error); }
    /* A linked file that drifted is not an error. Spending the
       error colour on it is how people learn to ignore the
       error colour. */
    .md-kb[data-state="stale"] .md-kb__trouble {
      border-color: var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .md-kb[data-state="stale"] .md-kb__trouble svg {
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ── It looked, and found nothing ─────────────────────
       Not an error. The base worked; the material is not in
       there. Drawn on a neutral surface for exactly that
       reason. */
    .md-kb__none {
      display: grid; gap: 8px; padding: 12px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
    }
    .md-kb__nt {
      display: flex; align-items: flex-start; gap: 6px; margin: 0;
      font-size: 12.5px; line-height: 1.5; color: var(--md-sys-color-on-surface);
    }
    .md-kb__nt svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px;
      color: var(--md-sys-color-on-surface-variant); }
    .md-kb__nact { display: flex; flex-wrap: wrap; gap: 2px; }

    /* ── Not active ───────────────────────────────────────
       The sentence does the work: nothing has been deleted. It
       is the difference between this and the other button. */
    .md-kb__off {
      padding: 12px; border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
    }
    .md-kb__offt {
      display: flex; align-items: flex-start; gap: 6px; margin: 0;
      font-size: 12.5px; line-height: 1.55; color: var(--md-sys-color-on-surface-variant);
    }
    .md-kb__offt svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; }

    /* ── Naming a new base ────────────────────────────────
       First, because the name IS the scope: everything after
       this is "in Product Research". */
    .md-kb__make { display: grid; gap: 6px; }
    .md-kb__mlabel { font-size: 12.5px; font-weight: 600;
      color: var(--md-sys-color-on-surface); }
    .md-kb__mfield {
      height: 40px; padding: 0 12px; font: inherit; font-size: 13px;
      color: var(--md-sys-color-on-surface);
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-small, 8px);
    }
    .md-kb__mfield:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: -1px;
      border-color: transparent;
    }
    .md-kb__mhint { margin: 0; font-size: 11.5px; line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant); }
    .md-kb__mrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .md-kb__chip {
      height: 28px; padding: 0 12px; font: inherit; font-size: 11.5px; font-weight: 550;
      color: var(--md-sys-color-on-surface); cursor: pointer;
      background: transparent; border-radius: 999px;
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .md-kb__chip:hover { background: var(--md-sys-color-surface-container-high); }

    /* ── Two different destructions ───────────────────────
       One takes a file out of a base; the other destroys the
       base. A product that asks the same question for both has
       taught people to answer both the same way. */
    .md-kb__ask {
      position: absolute; inset: 0; z-index: 4;
      display: grid; align-content: center; gap: 8px; padding: 20px;
      background: color-mix(in srgb, var(--md-sys-color-surface) 94%, transparent);
      backdrop-filter: blur(2px);
    }
    .md-kb__askt { margin: 0; font-size: 14px; font-weight: 650;
      color: var(--md-sys-color-on-surface); }
    .md-kb__askb { margin: 0; font-size: 12.5px; line-height: 1.55;
      color: var(--md-sys-color-on-surface-variant); }
    .md-kb__askact { display: flex; gap: 6px; margin-top: 4px; }
    .md-button.md-kb__danger {
      background: var(--md-sys-color-error); color: var(--md-sys-color-on-error);
    }

    /* ── Several knowledge bases ──────────────────────────
       A list, not a dashboard. Each row says the same three
       things — which collection, how much is in it, whether it
       is in play here — because a name alone does not tell you
       whether switching it on gives the agent six documents or
       six hundred. */
    .md-kb__bases { display: grid; gap: 6px; }
    .md-kb__bt {
      margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--md-sys-color-on-surface-variant);
    }
    .md-kb__blist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .md-kb__brow {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: var(--md-sys-shape-corner-medium, 12px);
      transition: background-color var(--md-sys-motion-duration-short4, 200ms)
                  var(--md-sys-motion-easing-standard);
    }
    .md-kb__brow:hover { background: var(--md-sys-color-surface-container-low); }
    /* The active row is tinted, but the WORD on it is what
       carries the state — the tint only makes it findable. */
    .md-kb__brow[data-on="true"] {
      background: color-mix(in srgb, var(--md-sys-color-primary) 7%, transparent);
    }
    .md-kb__bmark {
      display: grid; place-items: center; width: 28px; height: 28px;
      border-radius: var(--md-sys-shape-corner-small, 8px);
      font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-kb__brow[data-on="true"] .md-kb__bmark {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .md-kb__bid { display: grid; gap: 1px; min-width: 0; }
    .md-kb__bn {
      font-size: 12.5px; font-weight: 600; color: var(--md-sys-color-on-surface);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .md-kb__bc { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
    .md-kb__bstate {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-kb__bstate svg { width: 13px; height: 13px; }
    .md-kb__bstate[data-on="true"] { color: var(--md-sys-color-primary); }

    /* Active and Available are two promises about the same
       place, so the line that carries them is weighted, not
       recoloured — the word is doing the work. */
    .md-kb__scope[data-on="true"] { color: var(--md-sys-color-on-surface); font-weight: 600; }

    /* ── Long lists stay one base ─────────────────────────── */
    .md-kb__more {
      justify-self: start; margin-top: 2px; padding: 4px 8px;
      font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
      color: var(--md-sys-color-primary); background: none; border: 0;
      border-radius: var(--md-sys-shape-corner-small, 8px);
    }
    .md-kb__more:hover { background: var(--md-sys-color-surface-container-high); }
    .md-kb__group {
      display: flex; align-items: center; gap: 6px;
      margin: 6px 0 2px; padding: 0 10px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-kb__group:first-child { margin-top: 0; }
    .md-kb__gn {
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      display: inline-grid; place-items: center;
      font-size: 10px; letter-spacing: 0;
      background: var(--md-sys-color-surface-container-highest);
    }

    /* The parser's own words, behind a disclosure, off by
       default: useful to the one person in fifty who can act on
       it, noise to everybody else. */
    .md-kb__sdetail { margin-top: 4px; font-size: 11px; }
    .md-kb__sdetail summary {
      cursor: pointer; color: var(--md-sys-color-primary); font-weight: 600;
    }
    .md-kb__sdetail p {
      margin: 4px 0 0; padding: 6px 8px; font-family: var(--md-font-mono, monospace);
      font-size: 10.5px; line-height: 1.5; word-break: break-word;
      color: var(--md-sys-color-on-surface-variant);
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-sys-shape-corner-small, 8px);
    }

    /* ── Sources ──────────────────────────────────────────── */
    .md-kb__srcs {
      display: grid; gap: 2px; margin: 0; padding: 0; list-style: none;
      animation: kb-open var(--md-sys-motion-duration-medium1, 250ms)
                 var(--md-sys-motion-easing-emphasized-decelerate,
                     cubic-bezier(0.05, 0.7, 0.1, 1)) both;
    }
    /* A long list scrolls inside the panel after five rows.
       max-height here is only the first-paint guess; MaterialKB.fit
       measures the bottom of the fifth row and sets it exactly.
       While there is more below, the bottom edge fades so the cut
       reads as "continues", not as the end of the list. */
    .md-kb__srcs--scroll {
      position: relative;
      max-height: calc(5 * 58px + 8px);
      overflow-y: auto; overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--md-sys-color-outline-variant) transparent;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
    }
    .md-kb__srcs--scroll.is-more {
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
              mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
    }
    .md-kb__srcs--scroll:focus-visible {
      outline: 3px solid color-mix(in oklab, var(--md-sys-color-primary) 55%, transparent);
      outline-offset: 2px;
    }
    @keyframes kb-open {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }
    .md-kb__src {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: var(--md-sys-shape-corner-medium, 12px);
      transition: background-color var(--md-sys-motion-duration-short4, 200ms)
                  var(--md-sys-motion-easing-standard);
    }
    .md-kb__src:hover { background: var(--md-sys-color-surface-container-low); }
    /* The row that needs a person is the one the eye should find,
       and it is outlined rather than filled — the base is still
       usable and a filled error row would say otherwise. */
    .md-kb__src[data-state="failed"],
    .md-kb__src[data-state="unavailable"] {
      background: color-mix(in srgb, var(--md-sys-color-error) 6%, transparent);
      /* Three recovery actions do not fit beside a filename. They
         take a line of their own, under the name they belong to,
         rather than squeezing it to four characters. */
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "ico id state" ".   act act";
      align-items: start; row-gap: 6px;
    }
    .md-kb__src[data-state="failed"] .md-kb__sico,
    .md-kb__src[data-state="unavailable"] .md-kb__sico { grid-area: ico; margin-top: 2px; }
    .md-kb__src[data-state="failed"] .md-kb__st,
    .md-kb__src[data-state="unavailable"] .md-kb__st { grid-area: id; }
    .md-kb__src[data-state="failed"] .md-kb__sstate,
    .md-kb__src[data-state="unavailable"] .md-kb__sstate { grid-area: state; margin-top: 2px; }
    .md-kb__src[data-state="failed"] .md-kb__sact,
    .md-kb__src[data-state="unavailable"] .md-kb__sact {
      grid-area: act; justify-content: flex-start;
    }
    .md-kb__sico { display: grid; place-items: center; color: var(--md-sys-color-on-surface-variant); }
    .md-kb__sico svg { width: 18px; height: 18px; display: block; }
    .md-kb__st { display: grid; gap: 1px; min-width: 0; }
    .md-kb__sn {
      font-size: 12.5px; font-weight: 600; color: var(--md-sys-color-on-surface);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .md-kb__sm { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
    .md-kb__swhy {
      margin-top: 3px; font-size: 11.5px; line-height: 1.45;
      color: var(--md-sys-color-on-surface);
    }
    /* Readiness as a WORD on every row. The tint and the icon
       repeat it; neither one carries it alone. */
    .md-kb__sstate {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-kb__sstate svg { width: 13px; height: 13px; }
    .md-kb__sstate[data-kind="ok"]    { color: var(--mx-color-success, #086C36); }
    .md-kb__sstate[data-kind="stop"]  { color: var(--md-sys-color-error); }
    .md-kb__sstate[data-kind="stale"] { color: var(--md-sys-color-on-surface); }
    /* A source you are no longer allowed to read is not a source
       that broke. Same weight, different word, different icon —
       and a different button on the row. */
    .md-kb__sstate[data-kind="gone"]  { color: var(--md-sys-color-error); }
    .md-kb__wait {
      width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto;
      border: 2px solid var(--md-sys-color-outline-variant);
      border-top-color: var(--md-sys-color-primary);
      animation: kb-spin 900ms linear infinite;
    }
    @keyframes kb-spin { to { transform: rotate(360deg); } }
    /* Queued is not moving. A spinner on a file that is waiting
       its turn claims progress that is not happening. */
    .md-kb__src[data-state="adding"] .md-kb__wait {
      animation: none; border-top-color: var(--md-sys-color-outline-variant); opacity: .7;
    }
    .md-kb__sact { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
    /* The everyday Remove is quiet until the row is under the
       pointer: a delete repeated down a list of twelve reads as
       twelve invitations to delete something. */
    .md-kb__src:not([data-state="failed"]):not([data-state="unavailable"]):not([data-state="stale"]) .md-kb__sact {
      opacity: 0; transition: opacity var(--md-sys-motion-duration-short4, 200ms)
                  var(--md-sys-motion-easing-standard);
    }
    .md-kb__src:hover .md-kb__sact,
    .md-kb__src:focus-within .md-kb__sact { opacity: 1; }

    /* Compact drops the second line; the name is identification
       enough in a side panel. */
    .md-kb[data-layout="compact"] .md-kb__sm,
    .md-kb[data-layout="compact"] .md-kb__swhy { display: none; }
    .md-kb[data-layout="compact"] .md-kb__src { padding: 6px 10px; }

    /* ── Provenance ───────────────────────────────────────
       Which sources the answer actually read. Quiet, because it
       is a footnote to the answer and not a second answer. */
    .md-kb__cite {
      display: grid; gap: 6px; padding: 11px 12px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
      animation: kb-open var(--md-sys-motion-duration-medium1, 250ms)
                 var(--md-sys-motion-easing-standard) both;
    }
    .md-kb__ct {
      margin: 0; font-size: 11.5px; font-weight: 650;
      color: var(--md-sys-color-on-surface);
    }
    .md-kb__clist {
      display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none;
    }
    .md-kb__cbtn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      font: inherit; font-size: 11px;
    }
    .md-kb__cbtn:hover { background: var(--md-sys-color-secondary-container); }
    .md-kb__cbtn:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    .md-kb__cico svg { width: 13px; height: 13px; display: block; }

    .md-kb__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    /* ── Compact ─────────────────────────────────────────
       Measured against the defaults above, never guessed: panel
       16 gap 12, body gap 10, row 9/10, cite 11/12, active 9/11. */
    .md-kb[data-density="compact"] { padding: 12px; gap: 9px; }
    .md-kb[data-density="compact"] .md-kb__body { gap: 7px; }
    .md-kb[data-density="compact"] .md-kb__src { padding: 6px 8px; }
    .md-kb[data-density="compact"] .md-kb__cite { padding: 8px 10px; }
    .md-kb[data-density="compact"] .md-kb__active { padding: 7px 9px; }
    .md-kb[data-density="compact"] .md-kb__trouble { padding: 8px 10px; }

    @media (prefers-reduced-motion: reduce) {
      .md-kb, .md-kb__srcs, .md-kb__cite { animation: none; }
      .md-kb__src, .md-kb__sact { transition: none; }
      .md-kb__wait, .md-kb__activedot, .md-kb__badge .md-kb__dot { animation: none; }
      .md-kb__wait { opacity: .7; }
    }

    /* ── Model selection ───────────────────────────────────
       The composer's own mode chip, carrying two values: a
       capability tier and a reasoning depth, set separately.
       Same size, same shape, same slot — only the content is
       different, because there is no second control. */
    /* Effort used to be the second half of the model chip and
       dropped off here. It is its own chip now, so there is
       nothing left for this to hide. */
    .ax__mode__ico { width: 13px; height: 13px; flex: 0 0 auto; opacity: .8; }
    .ax__mode__ico svg { width: 13px; height: 13px; fill: none; stroke: currentColor;
      stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .ax__mode__m { font-weight: 500; color: var(--md-sys-color-on-surface); }
    .ax__mode__e { opacity: .8; }
    .ax__mode__c { width: 13px; height: 13px; flex: 0 0 auto; opacity: .6; }
    .ax__mode__c svg { width: 13px; height: 13px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .ax__menu--model {
      /* Anchored to the chip that opens it, not to the left edge
         of the composer. A menu that appears somewhere other than
         the control it belongs to makes the reader re-find that
         relationship every time it opens. */
      right: 52px; left: auto;
      /* Compact on purpose: descriptions may wrap to a second line
         (text-wrap: pretty keeps that from leaving an orphan), which
         is a better trade than a menu wide enough to cover the
         conversation. Capped by the viewport so it never forces a
         sideways scroll. */
      min-width: 300px; max-width: min(340px, calc(100vw - 32px)); padding: 8px;
      display: flex; flex-direction: column;
      max-height: min(58vh, 430px);
    }
    /* Only the options scroll. The sentence about what happens to
       the conversation stays put, because it is the one somebody
       is looking for at the moment they hesitate. */
    .md-ml__body { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
    .md-ml__h {
      margin: 6px 6px 4px; font-size: 10.5px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* An option, not a row of a spec sheet: what it is FOR, then
       one line of consequence. Context windows and parameter
       counts belong in developer documentation, where somebody is
       comparing on purpose rather than choosing mid-thought. */
    .md-ml__opt, .md-ml__row {
      display: flex; align-items: flex-start; gap: 8px; width: 100%;
      padding: 6px 9px; border: 0; cursor: pointer; text-align: left;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: transparent; font: inherit;
      color: var(--md-sys-color-on-surface);
      transition: background 140ms var(--md-sys-motion-easing-standard);
    }
    /* One highlight that travels, rather than a tint blinking on
       and off under the pointer. It follows the keyboard too. */
    .md-ml__glow {
      position: absolute; right: 8px; left: 8px; z-index: 0;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-high);
      opacity: 0; pointer-events: none;
      transition: top 220ms var(--md-sys-motion-easing-emphasized),
                  height 220ms var(--md-sys-motion-easing-emphasized),
                  opacity 150ms var(--md-sys-motion-easing-standard);
    }
    .md-ml__body { position: relative; z-index: 1; }
    .md-ml__opt, .md-ml__row, .md-ml__auto { position: relative; }
    .md-ml__opt:focus-visible, .md-ml__row:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px;
    }
    .md-ml__opt[aria-checked="true"], .md-ml__row[aria-checked="true"] {
      background: color-mix(in srgb, var(--md-sys-color-primary) 9%, transparent);
    }
    /* Disabled, not hidden, because a blocked row still has to
       say what to do instead — and the two kinds of block are
       drawn apart, since one ends in waiting and the other ends
       in a person. Neither is dimmed to the point of being
       unreadable: the sentence on them is the useful part. */
    /* The chevron at the right end of a model row (user request:
       18px keyboard_arrow_right). It is part of the row — the
       whole row is what you press — and it only says that the
       press leads on, to that model's effort. Centred on the row. */
    .md-ml__chev {
      flex: 0 0 auto; align-self: center; margin-left: auto;
      width: 18px; height: 18px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-ml__chev svg { display: block; width: 18px; height: 18px;
      fill: currentColor; stroke: none; }
    .md-ml__opt:disabled { cursor: default; }
    .md-ml__opt:disabled:hover { background: transparent; }
    .md-ml__opt[data-avail="unavailable"] .md-ml__n,
    .md-ml__opt[data-avail="restricted"] .md-ml__n { opacity: .7; }
    .md-ml__opt[data-avail="unavailable"] .md-ml__f,
    .md-ml__opt[data-avail="restricted"] .md-ml__f { opacity: .7; }
    /* Restricted carries a struck-through feel via the label, not
       the row: somebody decided this, and the decision is the
       information. Unavailable stays neutral, because it is
       expected back. */
    .md-ml__opt[data-avail="restricted"] {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 4%, transparent);
    }

    /* At most one attribute, right-aligned, and only when the
       host says this product differentiates on it. */
    .md-ml__meta {
      flex: 0 0 auto; margin-left: auto; padding-top: 2px;
      font-size: 10.5px; white-space: nowrap;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* 24dp, the Material Symbols standard size (user request).
       The glyph is a filled Symbols path, so it is filled, not
       stroked — stroking a filled outline draws it hollow. It is
       centred on the name's line, not on the whole row. */
    .md-ml__tick {
      flex: 0 0 auto; width: 24px; height: 24px; margin-top: -3px;
      color: var(--md-sys-color-primary);
    }
    .md-ml__tick svg { display: block; width: 24px; height: 24px;
      fill: currentColor; stroke: none; }
    .md-ml__t { min-width: 0; display: grid; gap: 1px; }
    .md-ml__n {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      font-size: 12.5px; font-weight: 600;
    }
    /* pretty: a description that wraps to a second line never
       ends on one orphaned word. */
    .md-ml__f { font-size: 11.5px; line-height: 1.4; text-wrap: pretty;
      color: var(--md-sys-color-on-surface-variant); }
    .md-ml__w { font-size: 11px; line-height: 1.4;
      color: var(--app-ink-dim, #5f6368); }
    .md-ml__tag {
      padding: 1px 7px; border-radius: 999px;
      font-size: 9.5px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
      background: color-mix(in srgb, var(--md-sys-color-primary) 13%, transparent);
      color: var(--md-sys-color-primary);
    }
    .md-ml__tag--auto {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .md-ml__tag--warn {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 65%, transparent);
      color: var(--md-sys-color-on-error-container);
    }
    /* Temporarily down: a neutral, waiting colour. Nothing has
       gone wrong with the product and nobody needs alarming. */
    .md-ml__tag--wait {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
    }
    /* Decided by somebody: the outline says a boundary rather
       than a fault, which is the distinction people act on. */
    .md-ml__tag--denied {
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      box-shadow: inset 0 0 0 1px var(--md-sys-color-outline);
    }

    /* Selected emphasis. The check always carries it; the fill is
       an option on top, never the thing doing the work. */
    .pv-ml[data-emphasis="tick"] .md-ml__opt[aria-checked="true"],
    .pv-ml[data-emphasis="tick"] .md-ml__row[aria-checked="true"] {
      background: transparent;
    }
    .pv-ml[data-emphasis="tick"] .md-ml__opt[aria-checked="true"]:hover,
    .pv-ml[data-emphasis="tick"] .md-ml__row[aria-checked="true"]:hover {
      background: var(--md-sys-color-surface-container-high);
    }
    .md-ml[data-density="compact"] .md-ml__opt,
    .md-ml[data-density="compact"] .md-ml__row { padding: 5px 8px; }
    .md-ml[data-density="compact"] .md-ml__h { margin: 4px 6px 2px; }

    /* The change, acknowledged. One line under the composer, not
       a toast over it: the selection changed, which is a small
       thing, and the only part anybody needs is when it starts
       mattering. */
    .md-ml__changed {
      margin: 10px auto 0; max-width: var(--ax-composer-max);
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; line-height: 1.45;
      color: var(--md-sys-color-on-surface-variant);
      animation: ml-said var(--mx-motion-spatial-duration, 320ms)
                 var(--mx-motion-spatial-easing, ease) both;
    }
    @keyframes ml-said {
      from { opacity: 0; transform: translateY(-3px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Fallback ──────────────────────────────────────────
       The one state that interrupts, because until it is answered
       the chip is lying about what happens next. It says what is
       NOT affected, because the fear at this moment is the
       thread. */
    /* Aligned to the composer it is about, so the recovery and
       the control it concerns share one edge. */
    .md-ml__fall {
      display: grid; gap: 6px; width: 100%; max-width: var(--ax-composer-max);
      margin: 0 auto 14px; padding: 14px 16px;
      border-radius: var(--md-sys-shape-corner-large, 16px);
      border: 1px solid var(--md-sys-color-error);
      background: color-mix(in srgb, var(--md-sys-color-error-container) 40%, transparent);
      animation: ml-said var(--mx-motion-spatial-duration, 320ms)
                 var(--mx-motion-spatial-easing, ease) both;
    }
    .md-ml__fall:focus-visible { outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px; }
    .md-ml__fallt {
      margin: 0; display: flex; align-items: center; gap: 7px;
      font-size: 13.5px; font-weight: 650;
      color: var(--md-sys-color-on-surface);
    }
    .md-ml__fallt svg { width: 16px; height: 16px; flex: 0 0 auto;
      color: var(--md-sys-color-error); }
    .md-ml__fallb {
      margin: 0; font-size: 12.5px; line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-ml__fallact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

    @media (prefers-reduced-motion: reduce) {
      .md-ml__changed, .md-ml__fall { animation: none; }
      .md-ml__opt, .md-ml__row { transition: none; }
      .md-ml__glow { transition: opacity 150ms ease; }
    }
    /* ── Auto, as a switch ─────────────────────────────────
       A toggle rather than a sixth radio, because Auto is the
       question of whether you pick at all. */
    .md-ml__auto {
      display: flex; align-items: center; gap: 10px; width: 100%;
      /* Left padding matches the tick column on the model rows,
         so Auto's name starts on the same line as theirs — it is
         the same list and should read as one. */
      padding: 8px 9px 8px 32px; border: 0; cursor: pointer; text-align: left;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: transparent; font: inherit;
      color: var(--md-sys-color-on-surface);
      transition: background 140ms var(--md-sys-motion-easing-standard);
    }
    .md-ml__auto:hover { background: var(--md-sys-color-surface-container-high); }
    .md-ml__auto:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px;
    }
    .md-ml__auto .md-ml__t { flex: 1 1 auto; }
    .md-ml__sw {
      flex: 0 0 auto; position: relative; width: 34px; height: 20px;
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-highest);
      box-shadow: inset 0 0 0 1.5px var(--md-sys-color-outline);
      transition: background 200ms var(--md-sys-motion-easing-standard),
                  box-shadow 200ms var(--md-sys-motion-easing-standard);
    }
    .md-ml__sw > span {
      position: absolute; top: 50%; left: 3px; width: 12px; height: 12px;
      margin-top: -6px; border-radius: 50%;
      background: var(--md-sys-color-outline);
      transition: transform 220ms var(--md-sys-motion-easing-emphasized),
                  width 220ms var(--md-sys-motion-easing-emphasized),
                  height 220ms var(--md-sys-motion-easing-emphasized),
                  margin 220ms var(--md-sys-motion-easing-emphasized),
                  background 200ms var(--md-sys-motion-easing-standard);
    }
    .md-ml__auto[aria-checked="true"] .md-ml__sw {
      background: var(--md-sys-color-primary);
      box-shadow: inset 0 0 0 1.5px var(--md-sys-color-primary);
    }
    .md-ml__auto[aria-checked="true"] .md-ml__sw > span {
      width: 14px; height: 14px; margin-top: -7px;
      transform: translateX(15px);
      background: var(--md-sys-color-on-primary);
    }

    /* The separator under Auto travels with the list it separates,
       so switching Auto on does not leave a rule with nothing
       under it. */
    .md-ml__rule {
      height: 1px; margin: 4px 7px 6px;
      background: var(--md-sys-color-outline-variant);
    }

    /* ── The list, collapsing ──────────────────────────────
       0fr to 1fr rather than a guessed max-height, so the
       animation is the real height of the real content whether
       the host ships two models or twenty. */
    .md-ml__models {
      display: grid; grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 280ms ease-in-out,
                  opacity 200ms ease-in-out 60ms,
                  visibility 0s linear 0s;
      visibility: visible;
    }
    .md-ml__models__in { overflow: hidden; min-height: 0; }
    .md-ml__models[data-collapsed="true"] {
      grid-template-rows: 0fr; opacity: 0;
      /* Held back until the collapse finishes, so the rows leave
         the tab order only once they have actually gone. */
      visibility: hidden;
      transition: grid-template-rows 280ms ease-in-out,
                  opacity 160ms ease-in-out,
                  visibility 0s linear 280ms;
    }

    /* After the rules it overrides, or it does not override them.
       The list still goes; it just stops sliding, and the switch
       and the chip were carrying the state anyway. */
    @media (prefers-reduced-motion: reduce) {
      .md-ml__auto, .md-ml__sw, .md-ml__sw > span { transition: none; }
      .md-ml__models {
        transition: opacity 1ms linear, visibility 0s linear 0s;
      }
      .md-ml__models[data-collapsed="true"] {
        transition: opacity 1ms linear, visibility 0s linear 1ms;
      }
    }

    /* The objective section (.md-ml__sub, .md-ml__row radios) was
       removed: Auto says what it weighs in its own description. */
    .md-ml__note {
      margin: 6px 7px 2px; font-size: 10.5px; line-height: 1.45;
      color: var(--app-ink-dim, #5f6368);
    }
    /* The sentence exactly one shipping product answers. */
    .md-ml__note--when {
      flex: 0 0 auto;
      display: flex; align-items: flex-start; gap: 6px;
      margin-top: 8px; padding-top: 7px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .md-ml__note--when svg { width: 13px; height: 13px; flex: 0 0 auto; margin-top: 1px; }

    /* Attribution on a past answer. Ahead of current practice and
       marked as such in the documentation — but silent
       substitution is already shipping, which is what makes the
       absence worth designing against. */
    .md-ml__credit {
      display: inline-block; padding: 1px 8px; border-radius: 999px;
      font-size: 10.5px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-ml__credit.is-sub {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 45%, transparent);
      color: var(--md-sys-color-on-error-container);
    }

    /* A single answer, shown in the preview so attribution has
       something to be attached to. */
    .pv-mlturn { display: grid; gap: 5px; justify-items: start;
      width: 100%; max-width: 460px; margin: 0 auto 18px; }
    .pv-mlq { margin: 0; font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); }
    .pv-mla { margin: 0; font-size: 13.5px; line-height: 1.5;
      color: var(--md-sys-color-on-surface); }

    /* ── Standing context ──────────────────────────────────
       What the agent can reach for the whole conversation, as
       opposed to the attachments row above the input. The visual
       difference is deliberate and load-bearing: attachments are
       OUTLINED CARDS carrying a cross, standing context is a
       TONAL CHIP carrying a chevron. One is a thing you took out
       of your machine; the other is a door you left open. */
    .ax__scopes {
      flex: 1 0 100%; order: -2;
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 1px 2px 6px;
    }
    .md-scope {
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 100%; min-width: 0; padding: 4px 8px 4px 5px;
      border: 0; border-radius: var(--md-sys-shape-corner-full, 999px);
      cursor: pointer; font: inherit; font-size: 11.5px; line-height: 1.3;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      transition: filter 160ms var(--md-sys-motion-easing-standard),
                  transform var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing);
      animation: att-in var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing) both;
    }
    .md-scope:hover { filter: brightness(.97); }
    .md-scope:active { transform: scale(.97); }
    .md-scope:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    .md-scope__mark {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 19px; height: 19px; border-radius: 6px;
      font-size: 9px; font-weight: 600; letter-spacing: .01em;
      text-transform: uppercase;
      background: var(--md-sys-color-surface-container-lowest, #fff);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-scope__mark--logo { padding: 1px; background: transparent; }
    .md-scope__mark--logo svg { width: 100%; height: 100%; display: block; }
    .md-scope__t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .md-scope__d { opacity: .82; white-space: nowrap; }
    .md-scope__chev {
      width: 13px; height: 13px; flex: 0 0 auto; opacity: .6;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    /* A door that has swung shut. Never colour alone — the detail
       line carries the word, and the chip only reinforces it. */
    .md-scope[data-state="stale"] {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-scope[data-state="error"] {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 70%, transparent);
      color: var(--md-sys-color-on-error-container);
    }
    /* Knowledge reads as the agent's own standing material, so it
       takes the primary tone rather than the secondary one. */
    .md-scope[data-kind="knowledge"] {
      background: color-mix(in srgb, var(--md-sys-color-primary) 13%, transparent);
      color: var(--md-sys-color-primary);
    }
    @media (prefers-reduced-motion: reduce) {
      .md-scope { animation: none; transition: none; }
      .md-scope:active { transform: none; }
    }

    /* ── The composer, in voice mode ───────────────────────
       The SAME element. Same width, same place, same radius
       system, same 34px controls. What changes is the middle:
       the text field gives way to a small activity indicator and
       one line of status, and the container grows by about a line
       of text. It is a mode, not a second component, and the
       measure of that is how little moves. */
    .ax__composer[data-mode="voice"] {
      /* Roughly 15% taller. Enough to hold a status line and a
         line of transcript; not enough to read as a new surface. */
      min-height: 64px;
      /* Text mode wraps because chips accumulate on it. Voice mode
         has a fixed set of parts and must never become two rows —
         a control that drops to a second line has changed the
         height of the bar by more than the mode change did. */
      flex-wrap: nowrap;
      /* Material shape, one step more expressive while the
         microphone is open, and back again afterwards. */
      border-radius: 22px;
      border-color: color-mix(in srgb, var(--md-sys-color-primary) 55%, transparent);
    }
    .ax__composer[data-mode="voice"][data-voice="error"] {
      border-color: color-mix(in srgb, var(--md-sys-color-error) 55%, transparent);
    }
    .ax__composer[data-mode="voice"][data-voice="muted"] {
      border-color: color-mix(in srgb, var(--md-sys-color-outline-variant) 90%, transparent);
    }
    /* The microphone, on: the kit's tonal icon button
       (md-icon-button--tonal), set in the markup. */
    .ax__voice {
      flex: 1 1 0; min-width: 0;
      display: flex; align-items: center; gap: 12px;
      padding-left: 2px;
    }
    .ax__vtext { min-width: 0; display: grid; gap: 1px; }
    .ax__vstatus {
      font-size: 13px; line-height: 1.35;
      color: var(--md-sys-color-on-surface);
    }
    /* One line, clipped. A spoken sentence does not need a panel
       of its own to prove it was heard, and a transcript that
       grows the composer as you speak is a composer that moves
       under your hand. */
    .ax__vline {
      font-size: 12px; line-height: 1.35;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ax__composer[data-voice="error"] .ax__vstatus { color: var(--md-sys-color-error); }

    /* ══ Voice Input · dictation into the shared composer ═════
       The bar is the same composer. While capture is on: a lit
       microphone with a dot (never in doubt), the clock, what has
       been heard, and Pause / Stop / Cancel. The gradient sits
       BEHIND the bar and answers the voice — a word swells it a
       little, silence settles it, transcribing makes it drift —
       and it goes the moment voice ends. */
    .md-vx { position: relative; display: grid; gap: 10px; width: 100%; max-width: var(--ax-composer-max, 640px); }
    .md-vx__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .md-vx__bar { position: relative; isolation: isolate; }
    .md-vx__bar > .ax__composer { position: relative; z-index: 1; }
    .md-vx__glow {
      --vx-e: 0; --vx-base: 0;
      position: absolute; z-index: 0; inset: -26px -30px; border-radius: 48px; pointer-events: none;
      background:
        radial-gradient(60% 90% at 18% 55%, color-mix(in oklab, var(--md-sys-color-primary-container) 95%, transparent), transparent 70%),
        radial-gradient(55% 85% at 82% 45%, color-mix(in oklab, var(--md-sys-color-tertiary-container, #FFD8E4) 85%, transparent), transparent 70%),
        radial-gradient(70% 100% at 50% 100%, color-mix(in oklab, var(--md-sys-color-inverse-primary, #D0BCFF) 60%, transparent), transparent 70%);
      background-size: 160% 160%; background-position: 50% 50%;
      filter: blur(18px);
      opacity: min(1, calc(var(--vx-base) + var(--vx-e) * .25));
      transform: scale(calc(1 + var(--vx-e) * .045));
      transition: opacity 420ms var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1)),
                  transform 520ms var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1));
    }
    /* Resting / transcribed: nothing behind the bar. */
    .md-vx[data-vx="listening"] .md-vx__glow { --vx-base: .85; animation: md-vx-drift 18s ease-in-out infinite alternate; }
    .md-vx[data-vx="paused"] .md-vx__glow { --vx-base: .4; }
    .md-vx[data-vx="processing"] .md-vx__glow { --vx-base: .7; animation: md-vx-flow 14s linear infinite; }
    .md-vx[data-glow="subtle"] .md-vx__glow { inset: -10px -12px; filter: blur(14px); }
    .md-vx[data-glow="subtle"][data-vx="listening"] .md-vx__glow { --vx-base: .32; }
    .md-vx[data-glow="subtle"][data-vx="processing"] .md-vx__glow { --vx-base: .26; }
    .md-vx[data-glow="off"] .md-vx__glow { display: none; }
    @keyframes md-vx-drift { from { background-position: 40% 50%; } to { background-position: 60% 50%; } }
    @keyframes md-vx-flow { from { background-position: 0% 50%; } to { background-position: 160% 50%; } }

    /* The bar while capture is on. */
    .md-vx .ax__composer[data-mode="voice"] { min-height: 64px; }
    .md-vx[data-density="compact"] .ax__composer[data-mode="voice"] { min-height: 56px; }
    .md-vx[data-density="comfortable"] .ax__composer .ax__cbtn { min-width: 40px; min-height: 40px; }
    .md-vx .ax__composer[data-mode="voice"] .ax__cbtn .mi { width: 22px; height: 22px; fill: currentColor; }
    .ax__vxmic {
      position: relative; flex: 0 0 auto; display: inline-grid; place-items: center; width: 40px; height: 40px;
      border-radius: 999px; color: var(--md-sys-color-on-surface-variant);
      background: var(--md-sys-color-surface-container-high);
    }
    .ax__vxmic .mi { width: 22px; height: 22px; fill: currentColor; }
    .ax__vxmic.is-live { color: var(--md-sys-color-on-primary-container); background: var(--md-sys-color-primary-container); }
    .md-vx[data-emphasis="strong"] .ax__vxmic.is-live { color: var(--md-sys-color-on-primary); background: var(--md-sys-color-primary); }
    .ax__vxdot {
      position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%;
      background: var(--md-sys-color-error); box-shadow: 0 0 0 2px var(--md-sys-color-surface-container-lowest);
      animation: md-vx-dot 2.4s ease-in-out infinite;
    }
    @keyframes md-vx-dot { 50% { opacity: .45; } }
    .md-vx .ax__vline { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ax__vtyped { color: var(--md-sys-color-on-surface-variant); }
    .ax__vheard { color: var(--md-sys-color-on-surface); }
    .ax__vhint { color: var(--md-sys-color-on-surface-variant); font-style: italic; }
    .ax__vxstop { color: var(--md-sys-color-on-secondary-container); }

    .md-vx .ax__cbtn--mic[aria-disabled="true"] { opacity: .38; cursor: not-allowed; }
    /* "From voice": what was transcribed, and the way back. */
    .ax__vxfrom {
      flex: 1 0 100%; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 10px; min-height: 32px;
      color: var(--md-sys-color-on-surface-variant); font: 500 12px/16px var(--md-ref-typeface-plain);
      animation: md-vx-in var(--md-sys-motion-duration-medium2, 300ms) var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1)) both;
    }
    .ax__vxfrom .mi { width: 16px; height: 16px; fill: var(--md-sys-color-primary); }
    .ax__vxfrom .md-button { margin-left: auto; }
    .md-vx[data-vx="transcribed"] .ax__field, .md-vx[data-vx="editing"] .ax__field {
      background: color-mix(in oklab, var(--md-sys-color-primary-container) 26%, transparent); border-radius: 12px;
      padding: 10px 14px 14px; margin: 2px 6px 2px 0; box-sizing: border-box;
      /* The usual 72px ceiling is for an unpadded field: keep three full lines plus the padding. */
      max-height: 100px;
    }
    @keyframes md-vx-in { from { opacity: 0; transform: translateY(4px); } }

    .md-vxp { width: 100%; max-width: var(--ax-composer-max, 640px); display: grid; gap: 14px; justify-items: stretch; }
    .md-vxp__sent { justify-self: end; max-width: 88%; display: grid; gap: 4px; padding: 10px 14px; border-radius: 18px 18px 6px 18px;
      background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
      animation: md-vx-in var(--md-sys-motion-duration-medium2, 300ms) var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1)) both; }
    .md-vxp__sent p { margin: 0; font: 400 14px/20px var(--md-ref-typeface-plain); }
    .md-vxp__who { font: 500 11px/16px var(--md-ref-typeface-plain); opacity: .8; }
    .md-vxp__then { font: 400 12px/16px var(--md-ref-typeface-plain); opacity: .8; }
    .sim-vx-src { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: 11.5px; opacity: .75; }
    .sim-vx-src .mi { width: 14px; height: 14px; fill: currentColor; }
    .sim-vx-list { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; line-height: 1.45; }
    .sim-vx-block { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; margin-left: 4px; border-radius: 6px;
      background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); font: 500 11px/16px var(--md-ref-typeface-plain); }
    /* Visual Input · simulator (Q3 dashboard) */
    .sim-vi { display: grid; gap: 16px; max-width: 640px; }
    .sim-vi-dash { position: relative; display: grid; gap: 12px; padding: 14px; border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant);
      transition: box-shadow var(--md-sys-motion-duration-medium2, 300ms) var(--md-sys-motion-easing-standard), border-color 300ms; }
    /* The shared window gets a soft, persistent boundary — the window, not the screen. */
    .sim-vi-dash.is-shared { border-color: color-mix(in oklab, var(--md-sys-color-primary) 60%, transparent);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--md-sys-color-primary-container) 80%, transparent), 0 8px 28px -14px color-mix(in oklab, var(--md-sys-color-primary) 45%, transparent); }
    .sim-vi-tag { position: absolute; top: -11px; right: 12px; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px;
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); font: 500 11px/16px var(--md-ref-typeface-plain); }
    .sim-vi-tag .mi { width: 14px; height: 14px; fill: currentColor; }
    .sim-vi-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .sim-vi-tile { display: grid; gap: 2px; padding: 10px; border-radius: 10px; background: var(--md-sys-color-surface-container-low); }
    .sim-vi-k { font: 400 11.5px/16px var(--md-ref-typeface-plain); color: var(--md-sys-color-on-surface-variant); }
    .sim-vi-v { font: 500 17px/22px var(--md-ref-typeface-plain); color: var(--md-sys-color-on-surface); }
    .sim-vi-d { font: 500 11px/16px var(--md-ref-typeface-plain); color: #1b6e3c; }
    .sim-vi-d.is-down { color: var(--md-sys-color-error); }
    .sim-vi-chart svg { display: block; width: 100%; height: 110px; }
    .sim-vi-thread { display: grid; gap: 12px; }
    .sim-vi-note { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--md-sys-color-on-surface-variant); font: 400 13px/18px var(--md-ref-typeface-plain); }
    .sim-vi-note .mi { width: 18px; height: 18px; fill: currentColor; }
    @media (max-width: 560px) { .sim-vi-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    /* ══ Visual Input · visual context on the shared composer ══ */
    .md-vip { width: 100%; max-width: var(--ax-composer-max, 640px); display: grid; gap: 12px; }
    .md-vip__st { display: grid; gap: 4px; justify-items: start; }
    .md-vip__st svg { display: block; width: 132px; height: 91px; border-radius: 8px; box-shadow: 0 0 0 1px var(--md-sys-color-outline-variant); }
    .md-vip__st small { font: 400 11.5px/16px var(--md-ref-typeface-plain); opacity: .8; }
    .md-vip__ans { display: grid; gap: 4px; padding: 10px 14px; border-radius: 18px 18px 18px 6px; max-width: 92%;
      background: var(--md-sys-color-surface-container-low); color: var(--md-sys-color-on-surface); }
    .md-vip__ans p { margin: 0; font: 400 14px/20px var(--md-ref-typeface-plain); }
    .md-vip__used { display: inline-flex; align-items: center; gap: 6px; color: var(--md-sys-color-on-surface-variant); font: 500 12px/16px var(--md-ref-typeface-plain); }
    .md-vip__used .mi { width: 16px; height: 16px; fill: var(--md-sys-color-primary); }
    .pv-stage:has(.md-vi .ax__menu--plus) { align-items: end; padding-top: 230px; }
    .md-vi { position: relative; display: grid; gap: 10px; width: 100%; max-width: var(--ax-composer-max, 640px); }
    .md-vi__bar { position: relative; }
    /* The card: big enough to recognise what was shown, never a 16px clip. */
    .ax__vis {
      flex: 1 0 100%; display: flex; align-items: center; gap: 12px; padding: 6px 4px 6px 6px; margin-bottom: 2px;
      border-radius: var(--md-sys-shape-corner-medium, 12px); background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      animation: md-vi-in var(--md-sys-motion-duration-medium4, 400ms) var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1)) both;
    }
    @keyframes md-vi-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    .ax__vis__thumb { position: relative; flex: 0 0 auto; width: 96px; height: 66px; border-radius: 8px; overflow: hidden;
      box-shadow: 0 0 0 1px var(--md-sys-color-outline-variant); background: var(--md-sys-color-surface); }
    .ax__vis[data-thumb="compact"] .ax__vis__thumb { width: 56px; height: 40px; }
    .ax__vis__thumb svg { display: block; width: 100%; height: 100%; }
    .ax__vis__chip { flex: 0 0 auto; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px;
      background: var(--md-sys-color-surface-container-high); }
    .ax__vis__chip .mi { width: 18px; height: 18px; fill: var(--md-sys-color-on-surface-variant); }
    .ax__vis__t { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
    .ax__vis__n { color: var(--md-sys-color-on-surface); font: 500 13.5px/18px var(--md-ref-typeface-plain); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ax__vis__l { display: flex; align-items: center; gap: 6px; color: var(--md-sys-color-on-surface-variant); font: 400 12px/16px var(--md-ref-typeface-plain); }
    .ax__vis__live { width: 8px; height: 8px; border-radius: 50%; background: var(--md-sys-color-error); flex: 0 0 auto; animation: md-vx-dot 2.4s ease-in-out infinite; }
    .ax__vis[data-vis-state="failed"] { border-color: color-mix(in oklab, var(--md-sys-color-error) 50%, transparent); }
    .ax__vis[data-vis-state="failed"] .ax__vis__l { color: var(--md-sys-color-error); }
    /* Reading: a slow, low-contrast sheen moves across what is being read —
       the expressive feedback sits ON the visual, not around the screen. */
    .ax__vis[data-vis-state="processing"] { border-color: color-mix(in oklab, var(--md-sys-color-primary) 40%, transparent); }
    .ax__vis__sheen { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(100deg, transparent 20%, color-mix(in oklab, var(--md-sys-color-primary-container) 75%, transparent) 50%, transparent 80%);
      background-size: 250% 100%; animation: md-vi-sheen 2.8s var(--md-sys-motion-easing-standard, ease) infinite; mix-blend-mode: multiply; }
    @keyframes md-vi-sheen { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    .ax__vis .ax__cbtn .mi { width: 20px; height: 20px; fill: currentColor; }
    /* Sharing is ACTIVE: a persistent bar, never a hidden state. */
    .md-vi__share {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 6px 6px 12px; border-radius: 999px;
      background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
      font: 400 13px/18px var(--md-ref-typeface-plain);
      animation: md-vi-in var(--md-sys-motion-duration-medium2, 300ms) var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1)) both;
    }
    .md-vi__share[data-emphasis="subtle"] { background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); }
    .md-vi__share > span { flex: 1 1 200px; min-width: 0; }
    .md-vi__share > .mi { width: 18px; height: 18px; fill: currentColor; }
    .md-vi__share .md-button .mi { width: 18px; height: 18px; fill: currentColor; margin-right: 4px; }
    .md-vi__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--md-sys-color-error); flex: 0 0 auto; animation: md-vx-dot 2.4s ease-in-out infinite; }
    .md-vi__pick { display: grid; gap: 6px; margin-left: 28px; }
    .md-vi__opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-align: left; cursor: pointer;
      border: 1px solid var(--md-sys-color-outline-variant); background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); }
    .md-vi__opt:hover { background: color-mix(in oklab, var(--md-sys-color-on-surface) 6%, var(--md-sys-color-surface)); }
    .md-vi__opt:focus-visible { outline: 3px solid var(--md-sys-color-secondary); outline-offset: 2px; }
    .md-vi__opt .mi { width: 22px; height: 22px; fill: var(--md-sys-color-primary); flex: 0 0 auto; }
    .md-vi__opt span { display: grid; } .md-vi__opt small { color: var(--md-sys-color-on-surface-variant); font-size: 12px; }
    @media (max-width: 560px) { .ax__vis__thumb { width: 72px; height: 50px; } .md-vi .ax__cbtn { min-width: 48px; min-height: 48px; } }
    @media (prefers-reduced-motion: reduce) {
      .ax__vis, .md-vi__share, .ax__vis__sheen, .ax__vis__live, .md-vi__dot { animation: none !important; }
    }
    /* ══ Handwriting Input · a writing surface on the shared composer ══
       Ink stays ink; recognized text is set in type below it, with
       uncertain words marked; accepted text is in the message. */
    .md-hw { position: relative; display: grid; gap: 10px; width: 100%; max-width: var(--ax-composer-max, 640px); }
    .md-hw__pad { display: grid; gap: 8px; padding: 8px 10px 10px; border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant);
      animation: md-vi-in var(--md-sys-motion-duration-medium4, 400ms) var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1)) both; }
    .md-hw__bar { display: flex; align-items: center; gap: 2px; }
    .md-hw__lab { flex: 1 1 auto; display: inline-flex; align-items: center; gap: 8px; color: var(--md-sys-color-on-surface-variant); font: 500 12.5px/18px var(--md-ref-typeface-plain); }
    .md-hw__lab .mi { width: 18px; height: 18px; fill: var(--md-sys-color-primary); }
    .md-hw__tb { width: 40px; height: 40px; }
    .md-hw__tb .mi { width: 20px; height: 20px; fill: currentColor; }
    .md-hw__tb[disabled] { opacity: .38; }
    /* The surface: ruled like paper, ink in on-surface — the handwriting dominates. */
    .md-hw__surface { position: relative; height: 112px; border-radius: 12px; overflow: hidden; color: var(--md-sys-color-on-surface);
      background: repeating-linear-gradient(to bottom, transparent 0 55px, color-mix(in oklab, var(--md-sys-color-outline-variant) 70%, transparent) 55px 56px), var(--md-sys-color-surface-container-low);
      touch-action: none; }
    .md-hw__svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .md-hw__w { font: 500 44px/1 'Caveat', 'Segoe Print', 'Bradley Hand', cursive; fill: currentColor; stroke: currentColor; paint-order: stroke; }
    .md-hw__w.is-new { animation: md-hw-write 700ms var(--md-sys-motion-easing-standard, ease) both; }
    @keyframes md-hw-write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .md-hw__canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; color: var(--md-sys-color-on-surface); }
    /* Placeholder sits ON the first ruled line, like writing on paper — never struck through by it. */
    .md-hw__ph { position: absolute; left: 16px; top: 31px; color: var(--md-sys-color-on-surface-variant); font: 400 14px/20px var(--md-ref-typeface-plain); opacity: .8; pointer-events: none; }
    /* Interpretation still happening: a slow, low-contrast pass over the ink. */
    .md-hw__surface.is-reading::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(100deg, transparent 25%, color-mix(in oklab, var(--md-sys-color-primary-container) 70%, transparent) 50%, transparent 75%);
      background-size: 250% 100%; animation: md-vi-sheen 2.2s var(--md-sys-motion-easing-standard, ease) infinite; mix-blend-mode: multiply; }
    .md-hw__read { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-radius: 10px;
      background: var(--md-sys-color-surface-container); animation: md-vx-in var(--md-sys-motion-duration-medium2, 300ms) var(--md-sys-motion-easing-emphasized-decelerate, cubic-bezier(.05,.7,.1,1)) both; }
    .md-hw__k { color: var(--md-sys-color-on-surface-variant); font: 500 11px/16px var(--md-ref-typeface-plain); text-transform: uppercase; letter-spacing: .06em; }
    .md-hw__txt { color: var(--md-sys-color-on-surface); font: 400 16px/24px var(--md-ref-typeface-plain); }
    .md-hw__word.is-fixed { background: color-mix(in oklab, var(--md-sys-color-primary-container) 60%, transparent); border-radius: 4px; padding: 0 2px; }
    /* Uncertain: not color alone — a dotted underline and a question mark, and it is a button. */
    .md-hw__unsure { font: inherit; color: inherit; border: 0; background: transparent; padding: 0 2px; cursor: pointer;
      text-decoration: underline dotted 2px var(--md-sys-color-error); text-underline-offset: 4px; border-radius: 4px; }
    .md-hw__txt[data-emphasis="strong"] .md-hw__unsure { background: color-mix(in oklab, var(--md-sys-color-error-container) 70%, transparent); }
    .md-hw__unsure span { margin-left: 1px; color: var(--md-sys-color-error); font-weight: 600; }
    .md-hw__unsure:focus-visible { outline: 3px solid var(--md-sys-color-secondary); outline-offset: 2px; }
    .md-hw__alts { display: inline-flex; gap: 6px; }
    .md-hw__alt { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--md-sys-color-outline-variant); background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface); font: 500 13px/18px var(--md-ref-typeface-plain); cursor: pointer; }
    .md-hw__alt:hover { background: color-mix(in oklab, var(--md-sys-color-on-surface) 8%, var(--md-sys-color-surface)); }
    .md-hw__note { flex: 1 0 100%; color: var(--md-sys-color-on-surface-variant); font: 400 12px/16px var(--md-ref-typeface-plain); }
