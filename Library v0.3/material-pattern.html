      opacity: 0; transition: opacity 180ms var(--md-sys-motion-easing-standard);
    }
    .md-icta:not([data-state="resting"]) .md-icta__keys { opacity: 1; }

    .md-icta[data-density="compact"] .md-icta__center { gap: 10px; }
    .md-icta[data-density="compact"] .ax__composer[data-size="initial"] { min-height: 52px; padding: 5px 6px; }
    /* Tonal: a filled container rather than an outline. Focus still
       draws the primary edge, because readiness has to be visible
       whichever emphasis the host picked. */
    .md-icta[data-emphasis="tonal"] .ax__composer:not(:focus-within) {
      background: var(--md-sys-color-surface-container-highest);
      border-color: transparent; box-shadow: none;
    }

    /* Working: the thread takes the space the invitation had, and the
       composer sits at its working place at the bottom. */
    .md-icta__thread {
      flex: 1 1 auto; min-height: 0; overflow: auto;
      display: flex; flex-direction: column; justify-content: flex-end; gap: 16px;
      padding: 22px 24px 8px;
    }
    .md-icta__dock {
      display: flex; justify-content: center; padding: 8px 16px 16px;
    }
    .md-icta__dock .ax__composer { max-width: var(--ax-composer-max); }

    /* Phone-width containers: the invitation anchors low, where a
       thumb and the on-screen keyboard are, rather than floating in
       the middle of a tall screen. Not the desktop layout shrunk. */
    @container icta (max-width: 420px) {
      .md-icta__center { justify-content: flex-end; padding: 16px 12px 12px; }
      /* Anchored low, so its flyouts open upwards again. */
      .md-icta .ax__composer[data-size="initial"] .ax__menu {
        top: auto; bottom: calc(100% + 10px);
      }
      .md-icta__lead { text-align: left; align-self: stretch; font-size: 14px; }
      .md-icta__keys { display: none; }
      .md-icta__thread { padding: 16px 14px 6px; }
      .md-icta__dock { padding: 6px 10px 10px; }
    }

    /* The simulator's empty workspace: the canvas centres the
       invitation instead of pushing content to the dock, and the dock
       is empty until the first request. */
    .ax[data-empty="true"] .ax__canvas { justify-content: center; }
    .sim-icta {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      width: 100%; padding: 12px 0 24px;
    }
    .sim-icta .ax__composer { width: 100%; max-width: var(--ax-composer-max); }
    /* Model Selection opens upward here too (user request, 7 Oct): while
       it is open the invitation drops to the foot of the empty canvas so
       the whole list fits above it, the same move the Live Preview makes. */
    .ax[data-empty="true"] .ax__canvas:has(.sim-icta .ax__menu--model),
    .ax[data-empty="true"] .ax__canvas:has(.sim-icta .ax__menu--effort) { justify-content: flex-end; }
    .sim:has(.sim-icta .ax__menu--model), .sim:has(.sim-icta .ax__menu--effort) { overflow: visible; }
    .sim-icta:focus-within .md-icta__keys { opacity: 1; }
    @media (max-width: 640px) {
      .ax[data-empty="true"] .ax__canvas { justify-content: flex-end; }
      .sim-icta .md-icta__lead { text-align: left; align-self: stretch; font-size: 14px; }
      .sim-icta .md-icta__keys { display: none; }
    }

    /* ── Open Input · a conversation already under way ─────────
       The working composer lives at the bottom of a conversation, so
       the Live Preview shows it there: a short history above, the
       composer docked below it at its compact working size. One box,
       one height, in every state — the composer never moves or
       disappears; only its own contents change. Container-aware, so it
       behaves in a side panel as it does full width. */
    .md-oi {
      position: relative; width: 100%; max-width: calc(var(--ax-composer-max) + 48px); margin: 0 auto;
      height: 420px; display: flex; flex-direction: column;
      border-radius: var(--md-sys-shape-corner-extra-large, 28px);
      background: transparent;  /* no tint: the outline alone marks the workspace (user, 30 Sep) */
      border: 0;  /* no stroke container (user, 30 Sep) */
      container: oi / inline-size;
    }
    .md-oi__thread {
      flex: 1 1 auto; min-height: 0; overflow: auto;
      display: flex; flex-direction: column; gap: 14px;
      padding: 20px 24px 8px;
    }
    .md-oi__thread > :first-child { margin-top: auto; }
    .md-oi__dock {
      display: grid; justify-items: center; gap: 4px; padding: 8px 16px 14px;
    }
    .md-oi__dock .ax__composer { width: 100%; max-width: var(--ax-composer-max); }
    .md-oi__keys { width: 100%; max-width: var(--ax-composer-max); margin: 0; padding: 0 14px; }
    .md-oi[data-emphasis="tonal"] .ax__composer:not(:focus-within):not([data-error]) {
      background: var(--md-sys-color-surface-container-highest);
      border-color: transparent; box-shadow: none;
    }
    /* Compact: the kit's controls keep their 48dp targets; only the
       container's breathing room shrinks. */
    .md-oi[data-density="compact"] .ax__composer { min-height: 52px; padding: 5px 6px; }
    .md-oi[data-density="compact"] .md-oi__thread { gap: 10px; }
    @container oi (max-width: 460px) {
      .md-oi__thread { padding: 14px 14px 6px; }
      .md-oi__dock { padding: 6px 10px 10px; }
      .md-oi[data-narrow="stack"] .ax__composer .ax__field { flex: 1 1 100%; order: -1; }
      .md-oi[data-narrow="stack"] .ax__composer .ax__field + * { margin-left: auto; }
      .md-oi[data-narrow="stack"] .ax__composer { border-radius: 22px; }
    }

    /* ── Suggested Prompts ────────────────────────────────────
       Level two, directly above the level-one composer and never
       wider than it. The set's own state is data-prominence:
       full · quiet · hidden, moved in place (see MaterialSim). */
    .md-sp {
      width: 100%; max-width: var(--ax-composer-max);
      display: grid; grid-template-rows: 1fr; opacity: 1;
      container: sp / inline-size;
      transition: grid-template-rows var(--md-sys-motion-duration-medium2) var(--md-sys-motion-easing-emphasized),
                  opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
    }
    .md-sp[hidden] { display: none; }
    /* Room inside the clip for the 3px focus ring and its 2px offset. */
    .md-sp__in { min-height: 0; overflow: hidden; padding: 6px 6px 10px; margin: -6px -6px 0; }
    /* Hidden keeps its space (the composer above it must not move under
       the caret); visibility takes it out of the tab order and the
       accessibility tree once the fade has played. Gone collapses. */
    .md-sp[data-prominence="hidden"] {
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                  visibility 0s linear var(--md-sys-motion-duration-short4);
    }
    .md-sp[data-prominence="gone"] { grid-template-rows: 0fr; opacity: 0; visibility: hidden; pointer-events: none; }
    .md-sp__h {
      margin: 0 0 8px 2px; color: var(--md-sys-color-on-surface-variant);
    }
    .md-sp__hquiet { display: none; }
    .md-sp__how {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
    .md-sp__set { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .md-sp__cell { display: flex; min-width: 0; max-width: 100%; }
    .md-sp__text { display: grid; gap: 2px; min-width: 0; }
    .md-sp__cat { color: var(--md-sys-color-on-surface-variant); }
    .md-sp__desc {
      color: var(--md-sys-color-on-surface-variant);
      font-size: var(--md-sys-typescale-body-medium-size);
      line-height: var(--md-sys-typescale-body-medium-line);
      letter-spacing: var(--md-sys-typescale-body-medium-tracking);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* Md3Chip (@nucleux/md3-chip) is the chip: its markup and Tailwind
       classes come from the package, styled by nucleux-md3.css (built
       from @nucleux/tokens, no preflight). What the page adds is what a
       preflight-free page needs and the library's own rules: the type
       face, the solid border style, truncation, Material Symbols in
       primary, and the page's one
       focus treatment in place of the package's ring. */
    .md-sp__chip {
      max-width: 100%; margin: 0; cursor: pointer; white-space: nowrap; text-align: left;
      border-style: solid;  /* preflight's `* { border: 0 solid }` is off */
      font-family: var(--md-ref-typeface-plain);
      letter-spacing: var(--md-sys-typescale-label-large-tracking);
    }
    .md-sp__chip > .md-sp__title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .md-sp__chip .md-sp__lead { display: inline-flex; }
    .md-sp__chip .md-sp__lead .mi.mi { fill: var(--md-sys-color-primary); }
    .md-sp__chip:focus-visible { --tw-ring-shadow: 0 0 #0000; }

    /* Chips stacked: one per line, left-aligned, their own width. */
    .md-sp[data-layout="chips"][data-arrange="stacked"] .md-sp__set { flex-direction: column; align-items: flex-start; }

    /* List: M3 list rows, full width, no dividers. */
    .md-sp[data-layout="list"] .md-sp__set { flex-direction: column; gap: 0; }
    .md-sp[data-layout="list"] .md-sp__cell { width: 100%; }
    .md-sp[data-layout="list"] .md-sp__title {
      font-size: var(--md-sys-typescale-body-large-size);
      line-height: var(--md-sys-typescale-body-large-line);
      letter-spacing: var(--md-sys-typescale-body-large-tracking);
      color: var(--md-sys-color-on-surface);
    }
    .md-sp[data-layout="list"] .md-list-row:has(.md-sp__desc) { min-height: 72px; }
    .md-sp[data-layout="list"] .md-sp__h { margin-left: 16px; margin-bottom: 2px; }

    /* Compact cards: two to a row where there is room, never tall. */
    .md-sp[data-layout="cards"] .md-sp__set {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .md-sp[data-layout="cards"][data-arrange="stacked"] .md-sp__set { grid-template-columns: 1fr; }
    .md-sp[data-layout="cards"] .md-sp__cell { width: 100%; }
    .md-sp[data-layout="cards"] .md-sp__title {
      font-size: var(--md-sys-typescale-title-small-size);
      line-height: var(--md-sys-typescale-title-small-line);
      font-weight: 500; color: var(--md-sys-color-on-surface);
    }

    /* Density: less room between and inside; the 48dp targets stay. */
    .md-sp[data-density="compact"] .md-sp__set { gap: 6px; }
    .md-sp[data-density="compact"][data-layout="list"] .md-sp__set { gap: 0; }
    .md-sp[data-density="compact"] .md-list-row { min-height: 48px; padding-top: 4px; padding-bottom: 4px; }
    .md-sp[data-density="compact"][data-layout="list"] .md-list-row:has(.md-sp__desc) { min-height: 64px; }
    .md-sp[data-density="compact"] .md-card--action { padding: 8px 12px; }
    .md-sp[data-density="compact"] .md-sp__h { margin-bottom: 4px; }

    /* Over the halo (user request, 1 Oct): outlined chips and compact
       cards take a white, translucent fill with a light blur so they sit
       ON the gradient instead of merging into it. Only where a halo is
       actually behind them — a Live Preview stage that draws one, or a
       simulator with the halo — otherwise they keep their default fill. */
    .pv-aura-host.has-halo .md-sp__item.md-sp__chip:not(.md-sp__chip--elevated):not(.is-chosen),
    .pv-aura-host.has-halo .md-sp__item.md-card:not(.is-chosen),
    .pv-aura-host.has-halo .md-sp[data-prominence="quiet"] .md-sp__item:not(.is-chosen),
    .ax:has(.ax__aura.is-halo:not(.is-off)) .md-sp__item.md-sp__chip:not(.md-sp__chip--elevated):not(.is-chosen),
    .ax:has(.ax__aura.is-halo:not(.is-off)) .md-sp__item.md-card:not(.is-chosen),
    .ax:has(.ax__aura.is-halo:not(.is-off)) .md-sp[data-prominence="quiet"] .md-sp__item:not(.is-chosen) {
      background: color-mix(in srgb, var(--md-sys-color-surface-container-lowest, #fff) 72%, transparent);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }

    /* Hover (user request, 1 Oct): every suggestion chip — on white or
       over the halo — takes the solid surface fill (#FEF7FF) and keeps
       its outline-variant stroke, so hover reads the same everywhere. */
    .md-sp__item.md-sp__chip:not(.md-sp__chip--elevated):not(.is-chosen):not(:disabled):hover,
    .md-sp[data-prominence="quiet"] .md-sp__item:not(.is-chosen):not(:disabled):hover,
    .pv-aura-host.has-halo .md-sp__item.md-sp__chip:not(.md-sp__chip--elevated):not(.is-chosen):not(:disabled):hover,
    .pv-aura-host.has-halo .md-sp[data-prominence="quiet"] .md-sp__item:not(.is-chosen):not(:disabled):hover,
    .ax:has(.ax__aura.is-halo:not(.is-off)) .md-sp__item.md-sp__chip:not(.md-sp__chip--elevated):not(.is-chosen):not(:disabled):hover,
    .ax:has(.ax__aura.is-halo:not(.is-off)) .md-sp[data-prominence="quiet"] .md-sp__item:not(.is-chosen):not(:disabled):hover {
      background: var(--md-sys-color-surface);
    }
    .md-sp__item.md-sp__chip:not(.md-sp__chip--elevated):not(.is-chosen):hover:not(:active):not(:focus-visible)::before,
    .md-sp[data-prominence="quiet"] .md-sp__item:not(.is-chosen):hover:not(:active):not(:focus-visible)::before { opacity: 0; }

    /* Selected: the chosen one gains emphasis while its text travels
       into the composer — the tonal fill of a selected chip. */
    .md-sp__item.is-chosen {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-color: transparent;
    }
    .md-sp__item.is-chosen > .mi.mi,
    .md-sp__item.is-chosen .md-sp__lead .mi.mi { fill: var(--md-sys-color-on-secondary-container); }
    .md-sp__item.is-chosen .md-sp__title,
    .md-sp__item.is-chosen .md-sp__desc,
    .md-sp__item.is-chosen .md-sp__cat { color: var(--md-sys-color-on-secondary-container); }

    /* Quiet: the choice is in the field and untouched. The others stay
       as small plain chips — no icons, no supporting lines, whatever
       the layout — and the one already in the field is not offered. */
    .md-sp[data-prominence="quiet"] .md-sp__hfull { display: none; }
    .md-sp[data-prominence="quiet"] .md-sp__hquiet { display: inline; }
    .md-sp[data-prominence="quiet"] .md-sp__h {
      margin: 0 0 6px 2px;
      font-size: var(--md-sys-typescale-label-medium-size);
      line-height: var(--md-sys-typescale-label-medium-line);
    }
    .md-sp[data-prominence="quiet"] .md-sp__set {
      display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px;
    }
    .md-sp[data-prominence="quiet"] .md-sp__cell { width: auto; }
    .md-sp[data-prominence="quiet"] .md-sp__cell[data-chosen] { display: none; }
    .md-sp[data-prominence="quiet"] .md-sp__item {
      width: auto; min-height: 0; height: 32px; padding: 0 12px; gap: 0;
      align-items: center; box-shadow: none; background: transparent;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-small);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-sp[data-prominence="quiet"] .md-sp__item > .mi,
    .md-sp[data-prominence="quiet"] .md-sp__lead,
    .md-sp[data-prominence="quiet"] .md-sp__desc,
    .md-sp[data-prominence="quiet"] .md-sp__cat { display: none; }
    .md-sp[data-prominence="quiet"] .md-sp__title {
      font-size: var(--md-sys-typescale-label-large-size);
      line-height: var(--md-sys-typescale-label-large-line);
      font-weight: var(--md-sys-typescale-label-large-weight);
      color: var(--md-sys-color-on-surface-variant); white-space: nowrap;
    }

    /* Narrow: chips either wrap, or become one row that scrolls. Cards
       fall to one column by themselves. Text never shrinks. */
    @container sp (max-width: 420px) {
      .md-sp[data-layout="chips"][data-narrow="scroll"]:not([data-prominence="quiet"]) .md-sp__set {
        flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity;
        margin: -6px; padding: 6px; scrollbar-width: none;
      }
      .md-sp[data-layout="chips"][data-narrow="scroll"] .md-sp__set::-webkit-scrollbar { display: none; }
      .md-sp[data-layout="chips"][data-narrow="scroll"] .md-sp__cell { flex: 0 0 auto; scroll-snap-align: start; }
    }

    /* The travelling copy of a chosen suggestion (decorative). */
    .md-sp-ghost {
      position: fixed; z-index: 2000; pointer-events: none; white-space: nowrap;
      font-family: var(--md-ref-typeface-plain);
      font-size: var(--md-sys-typescale-label-large-size);
      line-height: var(--md-sys-typescale-label-large-line);
      font-weight: var(--md-sys-typescale-label-large-weight);
      color: var(--md-sys-color-on-surface);
    }

    /* The Live Preview frame: the set and the shared composer docked
       at the bottom; the conversation, once started, above them. */
    .md-spv {
      position: relative; width: 100%; max-width: calc(var(--ax-composer-max) + 48px); margin: 0 auto;
      min-height: 380px; display: flex; flex-direction: column;
      border-radius: var(--md-sys-shape-corner-extra-large, 28px);
      background: transparent;  /* no tint: the outline alone marks the workspace (user, 30 Sep) */
      border: 0;  /* no stroke container (user, 30 Sep) */
      container: spv / inline-size;
    }
    .md-spv__body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 20px 24px 8px; }
    .md-spv__facts {
      margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px;
    }
    .md-spv__fact {
      padding: 10px 12px; border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-lowest);
    }
    .md-spv__fact dt {
      font-size: var(--md-sys-typescale-label-medium-size);
      line-height: var(--md-sys-typescale-label-medium-line);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-spv__fact dd {
      margin: 2px 0 0;
      font-size: var(--md-sys-typescale-body-medium-size);
      line-height: var(--md-sys-typescale-body-medium-line);
      color: var(--md-sys-color-on-surface);
    }
    .md-spv__thread {
      flex: 1 1 auto; max-height: 240px; overflow: auto;
      display: flex; flex-direction: column; gap: 14px;
    }
    .md-spv__thread > :first-child { margin-top: auto; }
    .md-spv__dock { display: grid; justify-items: center; gap: 4px; padding: 4px 16px 14px; }
    .md-spv__dock .ax__composer { width: 100%; max-width: var(--ax-composer-max); }
    @container spv (max-width: 460px) {
      .md-spv__body { padding: 14px 14px 6px; }
      .md-spv__dock { padding: 4px 10px 10px; }
      .md-spv__facts { grid-template-columns: 1fr 1fr; }
    }

    /* The simulator docks the same set above the same composer. */
    /* Below the composer, with clear air between them (user request,
       1 Oct, Copilot reference): 48px from the composer's edge to the
       chips, so they read as a separate, secondary group. */
    .ax__dock > .md-sp { margin: 48px auto 0; }
    .md-spv__dock > .md-sp { margin-top: 44px; }  /* + the dock's 4px gap = 48 */

    /* ══ Nucleux Md3 components: what a preflight-free page adds ═══
       Md3Button / Md3IconButton / Md3Tooltip / Md3Chip markup comes
       from the packages (nucleux-md3.css). The page supplies the type
       face, the solid border style, its single focus treatment (in
       place of the packages' ring + offset), and the behaviour the MCP
       leaves to us: tooltips on hover and focus, Escape, and
       aria-disabled (focusable, so a disabled control can still say
       why in its tooltip). */
    .md3-btn, .md3-iconbtn, .md3-chip {
      margin: 0; cursor: pointer; border-style: solid;
      font-family: var(--md-ref-typeface-plain);
      letter-spacing: var(--md-sys-typescale-label-large-tracking);
    }
    .md3-btn .mi, .md3-iconbtn .mi, .md3-chip .mi { fill: currentColor; }
    .md3-btn:focus-visible, .md3-iconbtn:focus-visible, .md3-chip:focus-visible {
      --tw-ring-shadow: 0 0 #0000; --tw-ring-offset-shadow: 0 0 #0000;
      outline: 3px solid color-mix(in oklab, var(--md-sys-color-primary) 55%, transparent);
      outline-offset: 2px;
    }
    .md3-btn[aria-disabled="true"], .md3-iconbtn[aria-disabled="true"] {
      opacity: .38; cursor: default; box-shadow: none;
    }
    .md3-btn[aria-disabled="true"]::before, .md3-iconbtn[aria-disabled="true"]::before { opacity: 0 !important; }
    .md3-tip { vertical-align: middle; }
    .md3-tip__pop {
      visibility: hidden; opacity: 0; pointer-events: none;
      font-family: var(--md-ref-typeface-plain); font-weight: 400; text-align: left;
      transition: opacity var(--md-sys-motion-duration-short3, 150ms) var(--md-sys-motion-easing-standard),
                  visibility 0s linear var(--md-sys-motion-duration-short3, 150ms);
      animation: none;
    }
    .md3-tip:not(.md3-tip--rich):hover > .md3-tip__pop,
    .md3-tip:not(.md3-tip--rich):focus-within:has(:focus-visible) > .md3-tip__pop,
    .md3-tip.is-hover > .md3-tip__pop, .md3-tip.is-focus > .md3-tip__pop,
    .md3-tip--rich.is-open > .md3-tip__pop {
      visibility: visible; opacity: 1; transition-delay: 0s; pointer-events: auto;
    }
    /* After the show rules, and as specific (0,5,0), so Escape wins. */
    .md3-tip.is-dismissed:not(.is-open):not(.is-hover) > .md3-tip__pop { visibility: hidden; opacity: 0; }
    .md3-tip--rich > .md3-tip__pop { left: 0; transform: none; z-index: 60; }
    /* Held states (from the state list), drawn with the packages' own

    /* ══ Autocomplete — ghost text + completion menus ═════════
       The suggestion lives in an aria-hidden overlay laid exactly

    /* ══ Icons — the AI icon vocabulary ═══════════════════════

       painted beneath everything in it; the phases mirror the
       simulator's (focus gathers, thinking breathes faster). */
    .pv-aura-host { isolation: isolate; }
    .pv-aura {
      position: absolute; inset: 0; z-index: -1; overflow: hidden;
      border-radius: inherit; pointer-events: none;
    }
    .pv-aura > .ax__aura { right: auto; bottom: auto; transition: none; }
    .pv-aura.is-moving > .ax__aura {
      transition: left 500ms var(--md-sys-motion-easing-emphasized),
                  top 500ms var(--md-sys-motion-easing-emphasized),
                  width 500ms var(--md-sys-motion-easing-emphasized),
                  height 500ms var(--md-sys-motion-easing-emphasized);
    }
    .pv-aura[data-phase="focus"] .ax__aura i:nth-child(1) { opacity: .52; transform: translate3d(6%, -2%, 0) scale(1.04); }
    .pv-aura[data-phase="focus"] .ax__aura i:nth-child(2) { opacity: .44; transform: translate3d(-5%, -2%, 0) scale(1.04); }
    .pv-aura[data-phase="focus"] .ax__aura i:nth-child(3) { opacity: .34; }
    .pv-aura[data-phase="thinking"] .ax__aura i:nth-child(1) { animation-duration: 14s; opacity: .5; }
    .pv-aura[data-phase="thinking"] .ax__aura i:nth-child(2) { animation-duration: 12s; opacity: .42; }
    .pv-aura[data-phase="thinking"] .ax__aura i:nth-child(3) { animation-duration: 17s; opacity: .34; }
    /* Initial CTA: one round halo centred on the composer, brightest
       just under it, fading out on every side (user request, 1 Oct). */
    /* ONE colour (user request, 1 Oct, Gemini reference): three
       ellipses of the same light purple (the primary's container and
       inverse tones — bright on white, never grey), brighter at the core just below the
       composer and fading out wide on every side. Drawn closest-side so
       each reaches zero inside its own box — no edge anywhere. */
    /* 90% of full strength (user request, 1 Oct: reduce by 10%). */
    .ax__aura.is-halo i { filter: blur(44px); opacity: .9; }
    /* The same strength in every state (user request): the phases keep
       their drift and their gathering, not their dimming — except when
       the agent is waiting on a decision, which must stay the brightest
       thing on screen. */
    .ax[data-phase] .ax__aura.is-halo i:nth-child(n),
    .pv-aura[data-phase] .ax__aura.is-halo i:nth-child(n) { opacity: .9; }
    .ax[data-phase="blocked"] .ax__aura.is-halo i:nth-child(n) { opacity: .4; }
    /* Placed on the composer by script; until then the default box. */
    .ax__aura.is-halo.is-placed { right: auto; bottom: auto; }
    /* Zero state only: gone once a conversation exists. */
    .pv-aura.is-fading, .ax__aura.is-halo.is-fading {
      transition: opacity 600ms var(--md-sys-motion-easing-standard);
    }
    .pv-aura.is-off, .ax__aura.is-halo.is-off { opacity: 0; }
    .ax__aura.is-halo i:nth-child(1) {
      left: 6%; bottom: 0; width: 88%; height: 96%;
      background: radial-gradient(closest-side,
        color-mix(in oklab, var(--md-sys-color-primary-container, #EADDFF) 90%, transparent), transparent);
    }
    .ax__aura.is-halo i:nth-child(2) {
      left: 26%; right: auto; bottom: 16%; width: 48%; height: 50%;
      background: radial-gradient(closest-side,
        color-mix(in oklab, var(--md-sys-color-inverse-primary, #D0BCFF) 80%, transparent), transparent);
    }
    .ax__aura.is-halo i:nth-child(3) {
      left: 14%; bottom: 34%; width: 72%; height: 56%;
      background: radial-gradient(closest-side,
        color-mix(in oklab, var(--md-sys-color-primary-container, #EADDFF) 60%, transparent), transparent);
    }
    /* …on white (user request): the halo is the only colour. */
    .pv-frame:has(.ax__composer) { --pv-ground: var(--md-sys-color-surface-container-lowest, #fff); }
    @media (prefers-reduced-motion: reduce) {
      .pv-aura > .ax__aura, .pv-aura.is-fading, .ax__aura.is-halo.is-fading { transition: none; }
    }

    /* Playground guidance, beside the component and never inside it. */
    .pv-guard {
      width: 100%; max-width: 760px; margin: 14px auto 0; padding: 12px 14px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
    }
    .pv-guard__h {
      display: flex; align-items: center; gap: 8px; margin: 0 0 6px;
      font-size: 13px; font-weight: 600;
    }
    .pv-guard__h .mi { width: 18px; height: 18px; fill: currentColor;
      color: var(--md-sys-color-on-surface-variant); }
    .pv-guard ul { margin: 0; padding-left: 20px; }
    .pv-guard li { font-size: 13px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant); }
    .pv-guard li + li { margin-top: 4px; }

    /* ── Working composer, stacked ─────────────────────────────
       Same size, same controls; the field takes the first line and
       the controls sit on the one below — Add context left, the rest
       right. Used where the controls would otherwise crowd the words. */
    .ax__composer[data-layout="stack"] {
      row-gap: 2px; padding: 8px 8px 7px; border-radius: 24px;
    }
    .ax__composer[data-layout="stack"]:focus-within { border-radius: 20px; }
    .ax__composer[data-layout="stack"] .ax__field {
      flex: 1 1 100%; order: -1; padding: 6px 8px 2px;
    }
    .ax__composer[data-layout="stack"] .ax__field + * { margin-left: auto; }
    /* The chip gives way before the row breaks: its model name
       truncates rather than pushing Send onto a line of its own. */
    .ax__composer[data-layout="stack"] > .ax__mode--model {
      flex: 0 1 auto; min-width: 0;
      /* Room for Add context, voice and send (3 × 40dp + gaps), so the
         row wraps only if there is genuinely no space. */
      max-width: calc(100% - 144px);
    }
    .ax__composer[data-layout="stack"] > .ax__mode--model .ax__mode__m {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── A send that did not happen ───────────────────────────
       Said in words on its own row inside the composer, which still
       holds the request. The edge takes the error colour; the text
       does not move and is not cleared. */
    .ax__composer[data-error] {
      border-color: var(--md-sys-color-error);
    }
    .ax__composer[data-error]:focus-within { border-color: var(--md-sys-color-error); }
    .ax__err {
      flex: 1 1 100%; order: -2;
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 2px; padding: 4px 4px 4px 12px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      font-size: 13px; line-height: 1.4;
      animation: ax-err-in 200ms var(--md-sys-motion-easing-emphasized-decel) both;
    }
    .ax__err__ico { flex: 0 0 auto; width: 18px; height: 18px; fill: currentColor; }
    .ax__err__t { flex: 1 1 auto; min-width: 0; }
    .ax__err__retry { flex: 0 0 auto; color: var(--md-sys-color-on-error-container); }
    @keyframes ax-err-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ax__err { animation: none; } }

    /* ── Writing, and done writing ─────────────────────────────
       Only for a host that sets data-entry. While keys are moving,
       Send is available at a secondary emphasis; once the person
       pauses with a request in the field it takes the primary fill.
       A pause never submits anything. */
    .ax__composer[data-entry] .ax__cbtn--send {
      transition: background-color 200ms var(--md-sys-motion-easing-standard),
                  color 200ms var(--md-sys-motion-easing-standard),
                  border-radius var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing);
    }
    .ax__composer[data-entry="typing"] .ax__cbtn--send:not(:disabled) {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    /* Provenance on a turn: which context the answer actually
       read. Quiet, because it is a footnote to the answer rather
       than a second answer. */
    .sim-src {
      margin: 6px 0 0; font-size: 11.5px; line-height: 1.4;
      color: var(--app-ink-dim, #5f6368);
    }
    .sim-src b { font-weight: 500; color: var(--md-sys-color-on-surface); }

    /* A panel the PERSON opened, rather than a turn the agent
       took. It carries no card of its own — the list inside it is
       already a bordered surface, and a box around a box is how a
       picker starts looking like a settings page. */
    .sim-panel { display: grid; gap: 4px; margin: 4px 0 8px; }
    .sim-panel__h {
      margin: 0; font-size: 14px; font-weight: 650;
      color: var(--md-sys-color-on-surface);
    }
    .sim-panel__b {
      margin: 0 0 8px; font-size: 12.5px; line-height: 1.55; max-width: 62ch;
      color: var(--md-sys-color-on-surface-variant);
    }
    .sim-panel__f { display: flex; gap: 6px; margin-top: 6px; }

    /* The sentence a remove control owes the person. Sits under
       the composer, where the standing caveat sits, because it is
       the same kind of statement: a fact about what this surface
       can and cannot do. */
    .ax__cnote--life { max-width: 62ch; }

    /* ── The composer, carrying context ────────────────────
       Attachments take their own row above the input, inside the
       same form. That placement is the claim: these files belong
       to this message, and the composer grows by exactly the room
       they need. */
    .ax__atts {
      flex: 1 0 100%; order: -1;
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 1px 2px 6px;
      /* A composer that grows without bound is a panel. Past about
         three rows the list scrolls instead, so attaching a tenth
         file cannot push the input off the screen. */
      max-height: 132px; overflow-y: auto; overscroll-behavior: contain;
    }
    .md-att {
      display: inline-flex; align-items: center; gap: 8px;
      max-width: 100%; min-width: 0; padding: 4px 4px 4px 7px;
      position: relative; overflow: hidden;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-lowest, #fff);
      /* Spring, because a file JOINING the message is a
         user-initiated arrival and should feel like one. */
      animation: att-in var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing) both;
    }
    @keyframes att-in {
      from { transform: scale(.9) translateY(4px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    .md-att__ico {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 24px; height: 24px; border-radius: 7px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-att__ico svg { width: 15px; height: 15px; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    /* Images get a real thumbnail because it identifies the file
       faster than its name. Documents deliberately do not: an
       invented page preview is a claim about unread content. */
    .md-att__thumb {
      flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px;
      background-size: cover; background-position: center;
      box-shadow: inset 0 0 0 1px rgba(16, 14, 24, .1);
    }
    .md-att__txt { min-width: 0; display: grid; gap: 1px; }
    /* The name may be truncated — a filename is recognisable from
       its head. The STATE may not: it is the sentence that decides
       what the person does next, so the meta line is given room
       for it and only the trailing detail is allowed to clip. */
    .md-att__name {
      font-size: 12px; line-height: 1.25; color: var(--md-sys-color-on-surface);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26ch;
    }
    .md-att__meta {
      font-size: 10.5px; line-height: 1.25; color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34ch;
    }
    .md-att__state { flex: 0 0 auto; }
    .md-att__state { color: var(--md-sys-color-on-surface-variant); }
    /* A separator that exists in the TEXT stream, not only in the
       gap — read aloud, "Ready" and "PDF" were arriving as one word. */
    .md-att__sep { }
    .md-att__btn {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%;
      cursor: pointer; background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      transition: background 160ms var(--md-sys-motion-easing-standard),
                  color 160ms var(--md-sys-motion-easing-standard);
    }
    .md-att__btn:hover {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }
    .md-att__btn:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    .md-att__btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
      stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* Material linear progress, hairline, along the bottom edge of
       the object it belongs to — so it reads as that file's
       progress and not as the composer's. */
    .md-att__bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
      background: var(--md-sys-color-surface-container-high);
    }
    .md-att__bar i {
      display: block; height: 100%; background: var(--md-sys-color-primary);
      transition: width 220ms var(--md-sys-motion-easing-standard);
    }
    /* No number to show, so it does not invent one. */
    .md-att__bar--wait {
      width: 38%; animation: att-wait 1.5s var(--md-sys-motion-easing-standard) infinite;
    }
    @keyframes att-wait {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    .md-att__live {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    /* State. Never colour alone — the word is already in the meta
       line above; this is the reinforcement, not the message. */
    .md-att[data-state="ready"] .md-att__state { color: var(--md-sys-color-primary); }
    .md-att[data-state="toobig"],
    .md-att[data-state="unsupported"],
    .md-att[data-state="failed"] {
      border-color: color-mix(in srgb, var(--md-sys-color-error) 55%, transparent);
      background: color-mix(in srgb, var(--md-sys-color-error-container) 26%, transparent);
    }
    .md-att[data-state="toobig"] .md-att__state,
    .md-att[data-state="unsupported"] .md-att__state,
    .md-att[data-state="failed"] .md-att__state { color: var(--md-sys-color-error); }
    .md-att[data-state="partial"] .md-att__state { color: var(--md-sys-color-on-surface); }
    .md-att[data-state="uploading"],
    .md-att[data-state="processing"],
    .md-att[data-state="queued"] { color: var(--md-sys-color-on-surface-variant); }

    @media (prefers-reduced-motion: reduce) {
      .md-att { animation: none; }
      .md-att__bar i { transition: none; }
      /* A travelling bar with nowhere to travel: it becomes a
         static half-filled track, and the word carries the state. */
      .md-att__bar--wait { animation: none; width: 50%; }
    }

    /* ── Connector ─────────────────────────────────────────
       One external service, in two places: a settings list, and
       inside a conversation where the agent has just found a wall.
       Same component either way — only the sentence above it
       changes, because the reason it is on screen changes. */
    .md-conn {
      display: grid; gap: 10px;
      padding: 14px; max-width: 420px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-lowest, #fff);
      animation: att-in var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing) both;
    }
    /* In a conversation it is an agent turn, so it sits in the
       agent's tonal surface rather than on a card of its own. */
    .md-conn--inline {
      background: color-mix(in srgb, var(--md-sys-color-primary) 5%, #fff);
      border-color: color-mix(in srgb, var(--md-sys-color-primary) 22%, transparent);
    }
    .md-conn__because {
      margin: 0; font-size: 13.5px; line-height: 1.55;
      color: var(--md-sys-color-on-surface);
    }
    .md-conn__head { display: flex; align-items: center; gap: 10px; }
    .md-conn__mark {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 34px; height: 34px; border-radius: 10px;
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    /* A real service keeps its own logo, unmodified — recognition
       is the logo's whole job, and it needs no tile under it to be
       legible. No fill, no inset padding, at every size this mark
       appears in: the compact card, the big setup surface and the
       list row all show the same bare mark, so the logo never
       gains or loses a container as the state changes underneath
       it. (The plain, non-logo `.md-conn__mark` — an initials
       monogram for a service with no real logo — keeps its tile,
       since letters do need a surface to sit on.) */
    .md-conn__mark--logo { padding: 0; background: transparent; }
    .md-conn__mark--logo svg { width: 100%; height: 100%; display: block; }
    .md-conn__id { min-width: 0; display: grid; gap: 1px; }
    .md-conn__name {
      font-size: 13.5px; font-weight: 600; color: var(--md-sys-color-on-surface);
    }
    .md-conn__meta {
      font-size: 11.5px; line-height: 1.35;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* A live connection gets a dot, but only ALONGSIDE the word —
       a green dot on its own is nothing to anyone who cannot see
       it, and ambiguous to everyone else. */
    .md-conn__dot {
      margin-left: auto; flex: 0 0 auto;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--md-sys-color-primary);
    }
    /* A separator that has to be SEEN, not only read: these sit in
       running inline text where no flex gap exists to stand in for
       them. The visually-hidden ax__sep is for the other case. */
    .md-conn__dash { opacity: .75; }
    .md-conn__blurb {
      margin: 0; font-size: 12.5px; line-height: 1.5;
      color: var(--app-ink-dim, #5f6368);
    }

    /* The scope list: what the agent will be able to do, in the
       PRODUCT's words, before any handoff. */
    .md-conn__scope {
      margin: 0; padding: 0; list-style: none; display: grid; gap: 6px;
      padding: 10px 12px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
    }
    .md-conn__s {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 12px; line-height: 1.45;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-conn__s b { font-weight: 600; color: var(--md-sys-color-on-surface); }
    .md-conn__sic { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 2px; }
    .md-conn__sic svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    /* Already granted versus still being asked for. A person
       re-reading a connection they set up months ago needs to see
       which is which. */
    .md-conn__s[data-has="true"] .md-conn__sic { color: var(--md-sys-color-primary); }
    .md-conn__s[data-has="false"] .md-conn__sic { opacity: .45; }

    .md-conn__wait {
      font-size: 12px; color: var(--md-sys-color-on-surface-variant);
    }
    .md-conn__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .md-conn__fine {
      flex: 1 1 100%; font-size: 11px; line-height: 1.45;
      color: var(--app-ink-dim, #5f6368);
    }

    /* State. The word is already in the meta line; this is
       reinforcement and nothing is carried by colour alone. */
    .md-conn[data-state="connected"] .md-conn__state,
    .md-conn[data-state="active"] .md-conn__state,
    .md-conn[data-state="limited"] .md-conn__state { color: var(--md-sys-color-primary); }
    .md-conn[data-state="stale"] .md-conn__state,
    .md-conn[data-state="error"] .md-conn__state { color: var(--md-sys-color-error); }
    .md-conn[data-state="error"] { border-color:
      color-mix(in srgb, var(--md-sys-color-error) 45%, transparent); }
    .md-conn[data-state="blocked"] { opacity: .92; }
    .md-conn[data-state="blocked"] .md-conn__state {
      color: var(--md-sys-color-on-surface-variant); }

    /* Read-only note under the scope list — a real connector says
       so explicitly rather than letting "Connected" imply more. */
    .md-conn__ro {
      display: flex; gap: 6px; align-items: flex-start;
      margin: 0; font-size: 11.5px; line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-conn__roic { flex: 0 0 auto; width: 13px; height: 13px; margin-top: 1px; opacity: .8; }
    .md-conn__roic svg { width: 100%; height: 100%; fill: currentColor; }

    @media (prefers-reduced-motion: reduce) { .md-conn { animation: none; } }

    /* ── Source list ──────────────────────────────────────────
       ONE reusable Material list, not a layout tied to this page.
       One surface for the whole list — a tinted fill and a stroke
       shared with the setup card — with dividers, not cards,
       between rows. Every value is a token mix rather than a fixed
       colour, so nothing here assumes a light-gray canvas behind
       it. Interaction is a state layer on hover/focus, not a
       per-row card background, which is what keeps four, one or
       eight rows all reading as the same kind of thing rather than
       a wall of cards.
       `--compact` is the same list with the supporting line
       dropped and the row at the 48px touch floor, for a side panel
       or a dialog — a density change, not a different surface.
       `data-layout="grid"` is an opt-in for a host that can spare
       the width: the container query below only switches to two
       columns once the LIST's own box is wide enough, never off
       the viewport, so the same markup drops into a narrow side
       panel or a wide setup page unchanged. The size query lives on
       this wrap, one element up from the list it resizes — a
       container cannot query its own box, only a descendant's. */
    .md-conn-list-wrap {
      container-type: inline-size; container-name: conn-list;
      width: 100%; max-width: var(--md-conn-list-max, 460px);
    }
    /* The same surface the setup card sits on, to the token: a
       faint primary tint over the lowest container role, and a
       stroke of the same primary at low opacity. Choosing a source
       and reviewing what that source may reach are two moments in
       ONE flow, so the surface must not change underneath the
       person between them. Both values are mixes of theme tokens,
       not fixed colours, so the pair travels to a dark theme (and
       to any host page) together. */
    .md-conn-list {
      margin: 0; padding: 0; list-style: none;
      display: grid; width: 100%;
      background: color-mix(in srgb, var(--md-sys-color-primary) 4%,
        var(--md-sys-color-surface-container-lowest, #fff));
      border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 18%, transparent);
      border-radius: var(--md-sys-shape-corner-large, 16px);
      overflow: hidden;
    }
    /* Row height is set by the type, not by padding: a 20px name
       line over a 16px supporting line inside 9px of padding lands
       at ~54px. The old row ran to 71px on the same content purely
       because the name carried a 1.55 line-height meant for running
       prose. A list is scanned, not read. */
    .md-conn-row {
      max-width: none; align-items: center; gap: 12px;
      background: transparent; border-radius: 0;
      padding: 9px 14px; min-height: 52px;
      transition: background-color var(--mx-motion-effects-duration, 120ms)
                  var(--mx-motion-effects-easing, ease);
    }
    .md-conn-row + .md-conn-row {
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    /* ── Several sources: grouped surface ─────────────────────
       The grouped variant is the same surface as the flat list —
       same tint, same stroke, same radius — holding two <ul>s and
       one hairline instead of one <ul>. Each group is its own list
       for assistive tech, named by its visible heading, so "row 2
       of 2, Connected sources" is true rather than "row 2 of 7" of
       a list that mixes connected and unconnected sources. */
    .md-conn-list--groups { display: block; }
    .md-conn-group { margin: 0; padding: 0; list-style: none; display: grid; }
    /* A list subheader, not a section title: it labels the rows
       under it at the smallest size the type scale still reads at,
       because the rows are the content and this is the signpost. */
    .md-conn-group__label {
      margin: 0; padding: 11px 14px 5px;
      font-size: 11.5px; line-height: 14px; font-weight: 600;
      letter-spacing: .04em; text-transform: none;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* One hairline between the groups, full-bleed, in the same
       token the row dividers use — so the boundary between
       connected and available is the same weight as the boundary
       between two rows, never a heavier rule that reads as two
       separate components. */
    .md-conn-group__sep {
      height: 1px; background: var(--md-sys-color-outline-variant);
    }
    /* The footer entry. A row-shaped text action rather than a
       button sitting in a row: it carries the whole width, takes
       the same state layer as a row, and keeps a 44px target
       without being 44px of visible chrome. */
    .md-conn-settings {
      display: flex; align-items: center; gap: 10px;
      width: 100%; min-height: 44px; padding: 8px 14px;
      border: 0; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 12.5px; line-height: 16px;
      text-align: left; color: var(--md-sys-color-on-surface-variant);
      transition: background-color var(--mx-motion-effects-duration, 120ms)
                  var(--mx-motion-effects-easing, ease);
    }
    .md-conn-settings:hover, .md-conn-settings:focus-visible {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent);
      color: var(--md-sys-color-on-surface);
    }
    .md-conn-settings:active {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 10%, transparent);
    }
    .md-conn-settings__ic { display: grid; place-items: center; width: 20px; height: 20px; }
    .md-conn-settings__ic svg { width: 18px; height: 18px; fill: currentColor; }
    /* Many connectors: the list scrolls inside its own surface
       rather than growing the page, and only when the host asks
       for it. The rounded corners are why the flat list clips its
       overflow, so the scrolling variant has to re-open the axis
       it actually scrolls on. */
    .md-conn-list--groups[data-scroll="true"] {
      max-height: var(--md-conn-list-h, 320px);
      overflow-y: auto; overscroll-behavior: contain;
    }

    /* ── Material switch ──────────────────────────────────────
       The availability control, and the first switch in the
       library to be a shared component rather than a local one:
       M3 proportions at the compact end of the scale (40x24 track,
       thumb 10px unselected growing to 14px selected), coloured
       only from system roles so it travels to a dark theme with
       everything else.

       Two things are deliberate. The thumb changes SIZE as well as
       position, which is the M3 switch's tell and the reason the
       state survives greyscale or a colour-vision difference. And
       the visible control is smaller than its target: the ::after
       carries a 44px hit area so a compact row never costs
       anyone the ability to hit the switch. */
    .md-switch {
      position: relative; flex: 0 0 auto;
      display: inline-flex; align-items: center;
      padding: 0; border: 0; background: transparent;
      cursor: pointer; border-radius: 999px;
    }
    .md-switch::after {
      content: ''; position: absolute; left: -6px; right: -6px;
      top: 50%; transform: translateY(-50%); height: 44px;
    }
    .md-switch:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 3px;
    }
    .md-switch__track {
      box-sizing: border-box;
      width: 40px; height: 24px; padding: 3px;
      display: flex; align-items: center;
      border-radius: 999px;
      border: 2px solid var(--md-sys-color-outline);
      background: var(--md-sys-color-surface-container-highest, #e6e0e9);
      transition: background-color var(--md-sys-motion-duration-short4, 200ms)
                    var(--md-sys-motion-easing-standard, ease),
                  border-color var(--md-sys-motion-duration-short4, 200ms)
                    var(--md-sys-motion-easing-standard, ease);
    }
    .md-switch__thumb {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--md-sys-color-outline);
      transition: transform var(--md-sys-motion-duration-medium2, 280ms)
                    var(--md-sys-motion-easing-emphasized),
                  width 180ms var(--md-sys-motion-easing-standard, ease),
                  height 180ms var(--md-sys-motion-easing-standard, ease),
                  background-color 180ms var(--md-sys-motion-easing-standard, ease);
    }
    .md-switch.is-on .md-switch__track {
      background: var(--md-sys-color-primary);
      border-color: var(--md-sys-color-primary);
    }
    .md-switch.is-on .md-switch__thumb {
      width: 14px; height: 14px;
      background: var(--md-sys-color-on-primary, #fff);
      transform: translateX(16px);
    }
    @media (prefers-reduced-motion: reduce) {
      .md-switch__track, .md-switch__thumb { transition: none; }
    }

    /* The state layer: a translucent tint of the row's own text
       colour, so it is visible at the same strength on a light or
       a dark host surface without a second, theme-specific rule.
       Pressed goes one step further than hover — the Expressive
       response belongs on the row being pressed, not on the list. */
    .md-conn-row:hover, .md-conn-row:focus-within {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent);
    }
    .md-conn-row:active {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 10%, transparent);
    }
    .md-conn-row[data-state="blocked"] { opacity: .64; }
    .md-conn-row[data-state="blocked"]:hover,
    .md-conn-row[data-state="blocked"]:focus-within,
    .md-conn-row[data-state="blocked"]:active { background: transparent; }
    @media (prefers-reduced-motion: reduce) { .md-conn-row { transition: none; } }

    /* COMPACT density: the identity line only. The supporting text
       is the first thing to go when the host is tight, because the
       logo and the name already say which service this is. Height
       still stops at the 48px Material touch minimum — compact is
       a content decision, never a reason to make a row unhittable. */
    .md-conn-list--compact .md-conn-row { padding: 6px 14px; min-height: 48px; }
    .md-conn-list--compact .md-list-item__supporting { display: none; }

    /* A host narrow enough to be a side panel: tighten the gutters.
       The mark and the type already sit at their floor. */
    @container conn-list (max-width: 359px) {
      .md-conn-row { padding: 8px 12px; gap: 10px; }
    }

    /* A host wide enough to spare it (a full-page setup step) and
       that has opted in: the same rows become a two-column grid.
       Border math stays correct for any row count, not just four. */
    @container conn-list (min-width: 520px) {
      .md-conn-list[data-layout="grid"] { grid-template-columns: 1fr 1fr; }
      .md-conn-list[data-layout="grid"] .md-conn-row {
        border-top: 1px solid var(--md-sys-color-outline-variant);
      }
      .md-conn-list[data-layout="grid"] .md-conn-row:nth-child(-n+2) { border-top: none; }
      .md-conn-list[data-layout="grid"] .md-conn-row:nth-child(odd) {
        border-right: 1px solid var(--md-sys-color-outline-variant);
      }
    }

    /* Body-medium proportions: the name drops from a title size to
       the Material body-medium size (14px), still at medium weight
       so it keeps enough presence to anchor the row, but it no
       longer reads as a heading over a supporting caption — the two
       lines now sit closer in weight, the way a settings list pairs
       a label with a hint rather than a card pairing a title with a
       subtitle. */
    .md-conn-row .md-list-item__line { justify-content: space-between; gap: 10px; }
    .md-conn-row .md-list-item__headline {
      font-size: 14px; font-weight: 500; line-height: 18px;
    }
    .md-conn-row .md-list-item__supporting {
      margin-top: 1px; font-size: 12px; line-height: 16px;
    }
    /* A trailing list action, not a button sitting in a row: small
       and quiet to look at, while the ::after keeps a 44px-tall hit
       area so shrinking it visually never shrinks what a finger or
       a pointer has to land on. */
    .md-conn-row .md-list-item__trailing .md-button {
      position: relative; height: 28px; padding: 0 10px; font-size: 13px;
    }
    .md-conn-row .md-list-item__trailing .md-button::after {
      content: ''; position: absolute; left: 0; right: 0;
      top: 50%; transform: translateY(-50%); height: 44px;
    }
    .md-conn-row__chip { flex: 0 0 auto; }
    .md-conn-row__chip--on {
      background: color-mix(in srgb, var(--md-sys-color-primary) 14%, transparent);
      color: var(--md-sys-color-primary);
    }
    .md-conn-row__chip--warn {
      background: color-mix(in srgb, var(--md-sys-color-error) 14%, transparent);
      color: var(--md-sys-color-error);
    }
    /* Same bare mark as everywhere else this pattern shows a logo
       — just resized for a list row. One size for every mark at
       every density, so no service outweighs another. */
    .md-conn-row .md-conn__mark--logo { width: 24px; height: 24px; }

    /* ── Active use ───────────────────────────────────────────
       Connected and USED are different facts, and this is the
       only place that difference shows: a quiet line while the
       agent draws on the source, settling into a small receipt
       once it is done. Never a progress percentage — there is no
       honest one for "reading issues". */
    .md-conn__active {
      display: flex; align-items: center; gap: 8px; margin: 0;
      font-size: 12.5px; color: var(--md-sys-color-on-surface-variant);
    }
    .md-conn__activedot {
      flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;
      background: var(--md-sys-color-primary);
      animation: conn-pulse 1.4s ease-in-out infinite;
    }
    .md-conn__active--done .md-conn__activedot { display: none; }
    .md-conn__active--done { color: var(--md-sys-color-on-surface); }
    .md-conn__active--done svg { width: 14px; height: 14px; fill: var(--md-sys-color-primary); }
    @keyframes conn-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .45; transform: scale(.7); }
    }
    @media (prefers-reduced-motion: reduce) {
      .md-conn__activedot { animation: none; }
    }

    /* ── Manage / disconnect ──────────────────────────────────
       A compact Material surface over the connection it manages
       — not a settings maze. The scrim sits within the pattern's
       own stage/scene, never the full viewport, because this is
       a component being demonstrated, not a page being taken
       over. */
    .md-conn-scene { position: relative; width: 100%; display: grid; place-items: center; }
    /* The compact card behind Manage/Disconnect is now shorter than
       the dialog it hosts, since it lost its scope list — but the
       overlay is absolutely positioned and does not itself grow the
       scene, so the scene needs a floor tall enough for the overlay
       it is about to show, not just for the card sitting under it. */
    .md-conn-scene:has(.md-conn-modal) { min-height: 400px; }
    .md-conn-modal {
      position: absolute; inset: 0; z-index: 2;
      display: grid; place-items: center; padding: 12px;
      background: color-mix(in srgb, #101014 42%, transparent);
      border-radius: var(--md-sys-shape-corner-large, 16px);
      animation: conn-scrim-in var(--mx-motion-effects-duration, 180ms)
                 var(--mx-motion-effects-easing, ease) both;
    }
    .md-conn-modal .md-dialog {
      width: 100%; max-width: 340px; text-align: left;
      animation: conn-dialog-in var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing) both;
    }
    .md-conn-manage .md-conn__head { margin-bottom: 2px; }
    .md-conn-manage .md-facts { margin: 12px 0 0; }
    .md-conn-manage .md-conn__ro { margin-top: 10px; }
    .md-conn-manage__actions { flex-wrap: wrap; }
    @keyframes conn-scrim-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes conn-dialog-in {
      from { opacity: 0; transform: translateY(6px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .md-conn-modal, .md-conn-modal .md-dialog { animation: none; }
    }

    /* The zero-state lede: what this is and why it is worth a
       press, above the list it introduces. Not a marketing
       headline &mdash; one sentence of benefit, product-plain. */
    .md-conn-intro { display: grid; gap: 3px; max-width: 460px; margin-bottom: 10px; }
    .md-conn-intro__title {
      margin: 0; font-size: 16px; font-weight: 600; line-height: 22px;
      font-family: var(--md-ref-typeface-brand);
      color: var(--md-sys-color-on-surface);
    }
    .md-conn-intro__body {
      margin: 0; font-size: 12.5px; line-height: 1.45;
      color: var(--md-sys-color-on-surface-variant); max-width: 46ch;
    }
    /* A small note sitting above a list &mdash; "Connected sources",
       "Disconnected." &mdash; sized and coloured like list supporting
       text so it reads as part of the same surface, not a caption
       bolted on top of it. */
    .md-conn-note { margin: 0 0 6px; font-size: 12px; line-height: 1.4;
      width: 100%; max-width: 460px; text-align: left;
      color: var(--md-sys-color-on-surface-variant); }

    /* The card plus what follows it &mdash; the "agent can now use"
       receipt, the active-use line &mdash; sharing one measure so
       they read as one continuing surface rather than the card and
       an unrelated caption floating separately in a centred stage. */
    .md-conn-block { display: grid; gap: 10px; width: 100%; max-width: 420px; text-align: left; }
    .md-conn-block__facts { padding: 0 2px; }
    .md-conn-block .md-conn__active { padding: 0 2px; }

    /* Source selected: the chosen row gains emphasis and expands
       slightly in place, per the Expressive brief &mdash; a shape and
       elevation change on the SAME element, never a swap to a
       different card. */
    .md-conn-row--picked {
      position: relative; z-index: 1;
      background: color-mix(in srgb, var(--md-sys-color-primary) 11%, var(--md-sys-color-surface-container-lowest));
      border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 30%, transparent);
      padding: 14px 16px;
      transform: scale(1.01);
      transition: transform var(--mx-motion-spatial-duration, 260ms) var(--mx-motion-spatial-easing, ease),
                  background-color var(--mx-motion-spatial-duration, 260ms) var(--mx-motion-spatial-easing, ease);
    }
    @media (prefers-reduced-motion: reduce) { .md-conn-row--picked { transform: none; } }

    /* The technical reason, one press away rather than the
       headline &mdash; a native disclosure widget, not a bespoke
       toggle, so it is keyboard- and screen-reader-operable for
       free. */
    .md-conn__advanced {
      margin-top: 10px; font-size: 11.5px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-conn__advanced summary {
      cursor: pointer; color: var(--md-sys-color-on-surface-variant);
      list-style: revert;
    }
    .md-conn__advanced summary:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
    }
    .md-conn__advanced code {
      display: block; margin-top: 6px; padding: 8px 10px;
      border-radius: var(--md-sys-shape-corner-small, 8px);
      background: var(--md-sys-color-surface-container-high);
      font-family: var(--md-ref-typeface-mono, monospace);
      font-size: 11px; line-height: 1.5; white-space: pre-wrap;
    }

    /* ── Setup surface: access review + connecting (calm setup) ──
       The one surface in this pattern used for a SETUP step rather
       than a status: deciding to connect, and watching the handoff
       happen. Same container for both — data-state switches
       between "authorise" and "connecting" — so connecting reads
       as this surface mid-transition, never a different loading
       screen. Every other state keeps the compact .md-conn below
       completely unchanged. Centered identity, one dominant
       heading, a short two-line description, three benefit rows in
       a single grouped surface (never a scope matrix), and one
       calm filled action — nothing framing it above and nothing
       technical to expand below it. */
    .md-conn-review {
      max-width: 420px;
      padding: 28px 24px 22px;
      gap: 20px;
      border-radius: var(--md-sys-shape-corner-extra-large, 28px);
      text-align: center;
    }
    .md-conn-review--inline {
      background: color-mix(in srgb, var(--md-sys-color-primary) 4%,
        var(--md-sys-color-surface-container-lowest, #fff));
      border-color: color-mix(in srgb, var(--md-sys-color-primary) 18%, transparent);
    }

    .md-conn-review__id { display: grid; justify-items: center; gap: 10px; }
    .md-conn-review__mark {
      position: relative;
      width: 44px; height: 44px; padding: 0;
      display: grid; place-items: center;
    }
    /* Scoped off the spinner deliberately: the logo fills the mark,
       the indicator has to overflow it. */
    .md-conn-review__mark svg:not(.md-conn-review__spinner) {
      width: 100%; height: 100%; display: block;
    }
    /* Connecting: the SAME bare logo, sitting INSIDE an
       indeterminate wavy-circle progress indicator (Material 3
       Expressive) rather than replaced by a different loading
       graphic — the object is still the service, only now waiting.

       Geometry: an 88px ring centred on the 44px logo, so its
       innermost stroke edge lands at 34px from centre — clear of
       the widest service glyph (GitHub and Notion both reach
       31.1px). The two sizes must be overridden explicitly here:
       the global `img, svg { max-width: 100% }` reset would
       otherwise clamp the ring back to the logo's 44px width and
       leave it hanging off-centre.

       Motion follows the Material indeterminate circular spec
       rather than a constant spinning ring: the whole indicator
       rotates on one clock (1568ms) while the active arc grows and
       shrinks on another (1333ms), so the sweep never repeats the
       same position twice in a row. `pathLength="100"` on the arc
       normalises the scalloped path's real length to 100 units, so
       the dash keyframes below read as plain percentages. */
    .md-conn-review__mark .md-conn-review__spinner {
      position: absolute; inset: -22px;
      width: calc(100% + 44px); height: calc(100% + 44px);
      max-width: none; max-height: none;
      display: block; overflow: visible;
      animation: conn-setup-spin 1568ms linear infinite;
    }
    /* Flat track, wavy active indicator — the Expressive pairing.
       The track is a true circle, so the container's rotation is
       invisible on it and only the arc reads as moving. */
    .md-conn-review__spinner-track {
      fill: none; stroke-width: 3;
      stroke: color-mix(in srgb, var(--md-sys-color-primary) 16%, transparent);
    }
    .md-conn-review__spinner-arc {
      fill: none; stroke-width: 3;
      stroke: var(--md-sys-color-primary);
      stroke-linecap: round; stroke-linejoin: round;
      animation: conn-setup-dash 1333ms var(--mx-motion-effects-easing) infinite;
    }
    /* The busy mark reserves the ring's own footprint, so the
       indicator never crowds the heading underneath it. */
    .md-conn-review__mark--busy { margin: 22px 0; }
    @keyframes conn-setup-spin { to { transform: rotate(360deg); } }
    @keyframes conn-setup-dash {
      0%   { stroke-dasharray: 1 99;  stroke-dashoffset: 0; }
      50%  { stroke-dasharray: 71 29; stroke-dashoffset: -28; }
      100% { stroke-dasharray: 71 29; stroke-dashoffset: -98; }
    }
    /* Reduced motion: both clocks stop and the arc closes into the
       complete wavy ring, dimmed — a quiet "waiting" mark rather
       than a spinner frozen mid-sweep. */
    @media (prefers-reduced-motion: reduce) {
      .md-conn-review__mark .md-conn-review__spinner { animation: none; opacity: .55; }
      .md-conn-review__spinner-arc {
        animation: none; stroke-dasharray: none; stroke-dashoffset: 0;
      }
    }
    /* Title-large rather than headline-small: the setup surface
       shrank around this heading over the last few passes (the
       logo, the benefit rows, the outer measure), and a 24px
       headline had started to overshoot everything else on the
       card. Overriding the size here rather than in the shared
       .md-headline-small utility, so nothing else that borrows
       that class elsewhere in the library shifts with it. */
    .md-conn-review__title {
      margin: 0; color: var(--md-sys-color-on-surface);
      font-size: var(--md-sys-typescale-title-large-size, 22px);
      line-height: var(--md-sys-typescale-title-large-line, 28px);
    }
    /* Full card width rather than a narrow measure — every
       service's one-sentence description is written to land in
       two lines at this width, never three. */
    .md-conn-review__lede {
      margin: 0; max-width: 100%;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* One soft grouped surface, not a stack of separate cards:
       three rows, each icon + strong title + supporting sentence,
       divided by hairlines rather than by whitespace, so the
       three read as one considered list rather than three cards. */
    .md-conn-review__benefits {
      margin: 0; padding: 4px 16px; list-style: none;
      display: grid; text-align: left;
      border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-low);
    }
    .md-conn-review__benefit {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px 0;
    }
    .md-conn-review__benefit + .md-conn-review__benefit {
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .md-conn-review__benefit-icon {
      flex: 0 0 auto; width: 36px; height: 36px; margin-top: 1px;
      display: grid; place-items: center;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
      color: var(--md-sys-color-primary);
    }
    .md-conn-review__benefit-icon svg { width: 18px; height: 18px; fill: currentColor; }
    .md-conn-review__benefit-text { display: grid; gap: 2px; min-width: 0; }
    .md-conn-review__benefit-text b {
      display: block; font-size: 13.5px; line-height: 1.4; font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .md-conn-review__benefit-text span {
      font-size: 12.5px; line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* One calm, full-width filled action and a quiet text button
       under it — a real decision to make, not a footer of buttons
       competing for the same press. The button keeps the kit's
       own 40px height and pill shape; only its width changes. */
    .md-conn-review__actions { display: grid; gap: 6px; justify-items: center; }
    .md-conn-review__actions .md-button--filled { width: 100%; }
    .md-conn-review__cta-ic svg { width: 16px; height: 16px; fill: currentColor; }

    .md-conn-review__trust { margin: 0; color: var(--md-sys-color-on-surface-variant); }

    /* A tool call, in the transcript. The protocol asks for
       "clear visual indicators when tools are invoked", and a
       call nobody can see afterwards is a call nobody can audit. */
    .sim-call {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
      padding: 7px 11px; margin-left: 34px;
      border-radius: var(--md-sys-shape-corner-medium, 12px);
      border-left: 2px solid var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-container-low);
      font-size: 11.5px; color: var(--md-sys-color-on-surface-variant);
    }
    .sim-call code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px; color: var(--md-sys-color-on-surface);
    }
    .sim-call__k { font-weight: 600; color: var(--md-sys-color-primary); }
    .sim-call__a { opacity: .85; }
    .sim-call__r {
      margin-left: auto; padding-left: 10px;
      color: var(--md-sys-color-on-surface);
    }
    /* A refusal is part of the record too. */
    .sim-call.is-denied {
      border-left-color: var(--md-sys-color-error);
      background: color-mix(in srgb, var(--md-sys-color-error-container) 22%, transparent);
    }
    .sim-call.is-denied .sim-call__k { color: var(--md-sys-color-error); }

    /* ── MCP server connection ─────────────────────────────
       One surface for the whole lifecycle. The states differ in
       what is inside the body, never in the frame around it —
       a panel that re-draws itself at each stage teaches that
       the stages are unrelated, which is the opposite of the
       thing this pattern exists to show.

       Status is carried three ways at once: the badge's words,
       its dot's SHAPE (a ring when the server is not usable, a
       filled disc when it is), and the tone. Colour is never
       alone, because "Ready" and "Authentication expired" have
       to be distinguishable in greyscale. */
    .md-mcp {
      display: grid; gap: 12px; padding: 16px; width: 100%; max-width: 480px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-large, 16px);
      background: var(--md-sys-color-surface-container-lowest, #fff);
      animation: att-in var(--mx-motion-spatial-duration) var(--mx-motion-spatial-easing) both;
    }
    .md-mcp__body { display: grid; gap: 12px; min-width: 0; }

    /* ── Head ─────────────────────────────────────────────── */
    .md-mcp__head { display: flex; align-items: center; gap: 10px; }
    .md-mcp__mark {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 34px; height: 34px; border-radius: 10px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__id { display: grid; gap: 2px; min-width: 0; flex: 1 1 auto; }
    .md-mcp__name {
      font-size: 14px; font-weight: 650; color: var(--md-sys-color-on-surface);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .md-mcp__meta {
      font-size: 12px; color: var(--md-sys-color-on-surface-variant);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .md-mcp__dash { opacity: .5; }

    .md-mcp__badge {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
      height: 24px; padding: 0 10px; border-radius: 999px;
      font-size: 11.5px; font-weight: 600; white-space: nowrap;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }
    /* A ring, not a disc, whenever the agent cannot use this
       server. The difference survives greyscale and a photocopier. */
    .md-mcp__badge .md-mcp__dot {
      width: 8px; height: 8px; border-radius: 50%;
      border: 2px solid currentColor; background: transparent;
    }
    .md-mcp__badge[data-status="ready"],
    .md-mcp__badge[data-status="partial"] {
      background: color-mix(in srgb, var(--mx-color-success, #086C36) 12%, transparent);
      color: var(--mx-color-success, #086C36);
    }
    .md-mcp__badge[data-status="ready"] .md-mcp__dot,
    .md-mcp__badge[data-status="partial"] .md-mcp__dot { background: currentColor; }
    .md-mcp__badge[data-status="expired"],
    .md-mcp__badge[data-status="unreachable"] {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .md-mcp__badge[data-status="reaching"],
    .md-mcp__badge[data-status="validating"],
    .md-mcp__badge[data-status="connected"],
    .md-mcp__badge[data-status="discovering"] {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .md-mcp__badge[data-status="reaching"] .md-mcp__dot,
    .md-mcp__badge[data-status="validating"] .md-mcp__dot,
    .md-mcp__badge[data-status="discovering"] .md-mcp__dot {
      animation: mcp-pulse 1400ms var(--md-sys-motion-easing-standard) infinite;
    }
    @keyframes mcp-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    /* ── Zero ─────────────────────────────────────────────── */
    .md-mcp__zero { display: grid; gap: 4px; }
    .md-mcp__zt { margin: 0; font-size: 13px; font-weight: 600;
      color: var(--md-sys-color-on-surface); }
    .md-mcp__zb { margin: 0; font-size: 12.5px; line-height: 1.55;
      color: var(--md-sys-color-on-surface-variant); }

    /* ── Add server ───────────────────────────────────────── */
    .md-mcp__form { display: grid; gap: 10px; }
    .md-mcp__field { display: grid; gap: 4px; }
    .md-mcp__flab { font-size: 11.5px; font-weight: 600;
      color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__input {
      height: 38px; padding: 0 12px; font: inherit; font-size: 13px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-small, 8px);
      background: var(--md-sys-color-surface-container-lowest);
      color: var(--md-sys-color-on-surface);
    }
    .md-mcp__input:focus-visible {
      outline: 2px solid var(--md-sys-color-primary); outline-offset: 1px;
      border-color: transparent;
    }
    .md-mcp__fnote {
      display: flex; align-items: flex-start; gap: 6px; margin: 0;
      font-size: 12px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__fnote svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; }

    /* ── Connecting ───────────────────────────────────────── */
    .md-mcp__steps { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
    .md-mcp__step {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 10px; border-radius: var(--md-sys-shape-corner-small, 8px);
      transition: background-color var(--md-sys-motion-duration-medium1, 250ms)
                  var(--md-sys-motion-easing-standard);
    }
    .md-mcp__step[data-step="now"] { background: var(--md-sys-color-surface-container); }
    .md-mcp__sico {
      flex: 0 0 auto; display: grid; place-items: center;
      width: 18px; height: 18px; margin-top: 1px; border-radius: 50%;
      border: 2px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-primary);
    }
    .md-mcp__sico svg { width: 12px; height: 12px; }
    .md-mcp__step[data-step="done"] .md-mcp__sico {
      background: var(--mx-color-success, #086C36); border-color: transparent;
      color: #fff;
    }
    /* The working step's ring spins; it does not fill, because a
       filling ring is a percentage and nothing here knows one. */
    .md-mcp__step[data-step="now"] .md-mcp__sico {
      border-color: var(--md-sys-color-primary);
      border-top-color: transparent;
      animation: mcp-spin 900ms linear infinite;
    }
    @keyframes mcp-spin { to { transform: rotate(360deg); } }
    .md-mcp__st { display: grid; gap: 2px; flex: 1 1 auto; min-width: 0; }
    .md-mcp__sl { font-size: 12.5px; font-weight: 600;
      color: var(--md-sys-color-on-surface); }
    .md-mcp__step[data-step="todo"] .md-mcp__sl { color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__sn { font-size: 11.5px; line-height: 1.45;
      color: var(--md-sys-color-on-surface-variant); }
    .md-mcp__ss {
      flex: 0 0 auto; margin-top: 1px; font-size: 11px; font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ── Counts ───────────────────────────────────────────── */
    .md-mcp__counts {
      display: flex; gap: 6px;
      padding: 10px; border-radius: var(--md-sys-shape-corner-medium, 12px);
      background: var(--md-sys-color-surface-container-low);
    }
    .md-mcp__count {
      flex: 1 1 0; display: grid; justify-items: center; gap: 1px;
      font-size: 10.5px; color: var(--md-sys-color-on-surface-variant);
    }
    .md-mcp__count b { font-size: 15px; font-weight: 650;
      color: var(--md-sys-color-on-surface); }
    .md-mcp__cico { display: block; }
