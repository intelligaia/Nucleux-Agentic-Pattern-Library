<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="base.css">
<style>
  .field .v{width:500px;height:500px;right:40px;top:40px;opacity:.26}
  .field .r{width:360px;height:360px;right:380px;bottom:-160px;opacity:.18}
  .field .a{width:300px;height:300px;right:520px;top:-120px;opacity:.16}
  .c6-head{position:absolute;left:72px;top:188px;width:420px}
  .c6-head .display{font-size:50px;line-height:1.04}
  .c6-head .support{margin-top:20px;font-size:18px;max-width:24ch}
  .hub{position:absolute;right:58px;top:104px;width:480px;height:440px}
  .hub svg.links{position:absolute;inset:0}
  .node{position:absolute;transform:translate(-50%,-50%);z-index:2}
  .role{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);
    border-radius:9999px;padding:10px 18px 10px 12px;box-shadow:var(--shadow-float)}
  .role .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
  .role .ic svg{width:17px;height:17px}
  .role .nm{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
  .hubcore{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:3;width:116px;height:116px;
    border-radius:50%;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-float);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
  .hubcore .glow{position:absolute;inset:-26px;border-radius:50%;background:var(--ux-grad);filter:blur(30px);opacity:.3;z-index:-1}
  .hubcore .m{width:34px;height:34px;position:relative}
  .hubcore .m .ring{position:absolute;inset:0;border-radius:11px;border:2px solid var(--border-strong)}
  .hubcore .m .cc{position:absolute;inset:9px;border-radius:50%;background:var(--ux-grad)}
  .hubcore .cn{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  /* faint pattern vocabulary chips */
  .pat{position:absolute;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:9999px;
    border:1px solid var(--border);background:rgba(255,255,255,.7);font-size:12px;font-weight:500;color:var(--muted);
    letter-spacing:-.005em;z-index:1}
  .pat .d{width:6px;height:6px;border-radius:50%;background:var(--border-strong)}
</style></head>
<body><div class="frame">
  <div class="field"><div class="blob v"></div><div class="blob r"></div><div class="blob a"></div></div>
  <div class="grain"></div>

  <div class="eyebrow" style="position:absolute;left:72px;top:68px"><span class="dot"></span>NUCLEUX · AGENTIC PATTERN LIBRARY</div>

  <div class="c6-head">
    <div class="display">One agent language for the whole&nbsp;team.</div>
    <div class="support">Product, design and engineering, building from one vocabulary.</div>
  </div>

  <div class="hub">
    <svg class="links" viewBox="0 0 480 440" fill="none">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#D97706"/><stop offset="0.5" stop-color="#E11D48"/><stop offset="1" stop-color="#7C3AED"/>
      </linearGradient></defs>
      <line x1="240" y1="229" x2="240" y2="78"  stroke="url(#g)" stroke-width="2.5" opacity="0.55"/>
      <line x1="240" y1="229" x2="116" y2="356" stroke="url(#g)" stroke-width="2.5" opacity="0.55"/>
      <line x1="240" y1="229" x2="364" y2="356" stroke="url(#g)" stroke-width="2.5" opacity="0.55"/>
    </svg>

    <div class="hubcore"><div class="glow"></div>
      <div class="m"><div class="ring"></div><div class="cc"></div></div>
      <div class="cn">Nucleux</div>
    </div>

    <div class="node" style="left:240px;top:78px">
      <div class="role"><span class="ic" style="background:#7C3AED"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg></span><span class="nm">Product</span></div>
    </div>
    <div class="node" style="left:116px;top:356px">
      <div class="role"><span class="ic" style="background:#E11D48"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg></span><span class="nm">Design</span></div>
    </div>
    <div class="node" style="left:364px;top:356px">
      <div class="role"><span class="ic" style="background:#D97706"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg></span><span class="nm">Engineering</span></div>
    </div>

    <!-- ambient pattern vocabulary -->
    <div class="pat" style="left:-14px;top:150px"><span class="d"></span>Open&nbsp;Input</div>
    <div class="pat" style="right:-12px;top:120px"><span class="d"></span>Model&nbsp;Selection</div>
    <div class="pat" style="left:30px;top:30px"><span class="d"></span>Consent</div>
    <div class="pat" style="right:18px;bottom:30px"><span class="d"></span>Knowledge&nbsp;Base</div>
    <div class="pat" style="left:132px;bottom:-4px"><span class="d"></span>Approval</div>
  </div>

  <div class="brand" style="position:absolute;left:72px;bottom:56px">
    <div class="mark"><div class="ring"></div><div class="core"></div></div>
    <div class="name">Nucleux</div>
  </div>
</div></body></html>
