<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="base.css">
<style>
  .field .v{width:620px;height:620px;right:-120px;top:-180px;opacity:.42}
  .field .r{width:420px;height:420px;right:120px;top:260px;opacity:.26}
  .c1-head{position:absolute;left:72px;top:150px;width:600px}
  .c1-head .display{font-size:78px}
  .c1-head .support{margin-top:26px;font-size:22px}
  /* right-side model-selection surface, bleeding off the edge */
  .c1-ui{position:absolute;right:-26px;top:118px;width:452px}
  .menu{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-float);
    padding:7px;width:300px}
  .menu .mh{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    padding:9px 12px 6px}
  .mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px}
  .mi.sel{background:var(--violet-soft)}
  .mi .mtxt{flex:1}
  .mi .mt{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .mi .md{font-size:12px;color:var(--muted)}
  .mi .mck{color:var(--violet)}
  .mi .spk{color:var(--violet)}
  .mi .gl{color:var(--muted)}
  .c1-comp{margin-top:14px;margin-left:36px;width:412px}
  .selbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 13px;border-radius:9999px;
    border:1px solid var(--border-strong);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink);
    box-shadow:0 1px 2px rgba(20,18,16,.05);margin:0 0 12px 8px}
  .selbtn .spk{color:var(--violet)}
</style></head>
<body><div class="frame">
  <div class="field"><div class="blob v"></div><div class="blob r"></div></div>
  <div class="grain"></div>

  <div class="eyebrow" style="position:absolute;left:72px;top:68px"><span class="dot"></span>NUCLEUX · AGENTIC PATTERN LIBRARY</div>

  <div class="c1-head">
    <div class="display">Stop designing<br>agent&nbsp;UX<br>from scratch.</div>
    <div class="support">Start with patterns that already&nbsp;work.</div>
  </div>

  <div class="c1-ui">
    <div class="menu float">
      <div class="mh">Model</div>
      <div class="mi sel">
        <span class="spk"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/></svg></span>
        <div class="mtxt"><div class="mt">Instant</div><div class="md">Fast · everyday tasks</div></div>
        <span class="mck"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      </div>
      <div class="mi">
        <span class="gl"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <div class="mtxt"><div class="mt">Balanced</div><div class="md">Reasoning · tool use</div></div>
      </div>
      <div class="mi">
        <span class="gl"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v6c0 4 3.4 6.9 8 8 4.6-1.1 8-4 8-8V7Z"/></svg></span>
        <div class="mtxt"><div class="mt">Expert</div><div class="md">Deep · long-horizon</div></div>
      </div>
    </div>

    <div class="c1-comp">
      <div class="selbtn"><span class="spk"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></span>Instant<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
      <div class="composer"><span class="ph">Ask the agent to draft the release notes…</span>
        <span class="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></div>
    </div>
  </div>

  <div class="brand" style="position:absolute;left:72px;bottom:60px">
    <div class="mark"><div class="ring"></div><div class="core"></div></div>
    <div class="name">Nucleux</div><div class="divider"></div>
    <div class="sub">Agentic Pattern Library</div>
  </div>
</div></body></html>
